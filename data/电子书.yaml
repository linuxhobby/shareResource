  quark_url: "https://pan.quark.cn/s/04afe66367b4"
  description: "【pdf】塔拉·韦斯特弗的自传体回忆录。她生长在爱达荷州巴克峰山脚下，父亲偏执地反对政府、医院与学校，七个孩子没有出生证明、没进过教室；她在废料场分拣铁皮，在母亲的草药室帮忙，还要忍受兄长的暴力。十七岁那年她靠自学考上大学，此后一路读到剑桥大学历史学博士——教育让她重新看见了世界，也让她与原生家庭彻底撕裂。书名取自《圣经》：你当像鸟飞往你的山，去找到属于你的那座山。｜作者：[美] 塔拉·韦斯特弗"
