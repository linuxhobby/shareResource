  description: "【epub】斯蒂芬·金的中篇小说，收录于《四季奇谭》。银行家安迪·杜佛兰被误判枪杀妻子及其情人，判处两次无期徒刑，进入肖申克州立监狱。他在狱中替狱警处理税务、替典狱长做假账，也用一把小锤子、几张海报和无人相信的耐心，花了近二十年凿开通往自由的隧道。小说讲的是希望——有些鸟是关不住的，它们的羽毛太光辉了。｜作者：[美] 斯蒂芬·金"
