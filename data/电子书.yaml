  description: "【epub】巴西作家保罗·柯艾略的寓言式小说。牧羊少年圣地亚哥两次做了同一个关于埃及金字塔宝藏的梦，在撒冷之王的指引下卖掉羊群，穿越地中海与撒哈拉，一路遇见骗子、水晶店老板、炼金术士和沙漠少女法蒂玛。当他终于抵达金字塔挖开沙土，才发现真正的财富藏在出发的地方。全书讲的是「天命」与「预兆」——当你真心渴望某件事，整个宇宙都会合力帮你完成。｜作者：[巴西] 保罗·柯艾略"
