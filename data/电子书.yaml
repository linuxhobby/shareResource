  description: "【epub · pdf · mobi · azw3】美国作家肯·凯西的长篇小说。故事发生在俄勒冈州一所精神病院：为逃避监狱苦役而装疯的麦克墨菲，撞上了病区里刻板冷酷的「大护士」拉契特和她那套规训机器。他带着病友钓鱼、打牌、放声大笑，把被磨平的人一个个唤醒，而这场关于自由与尊严的角力最终以最沉重的方式落幕。小说被视为六十年代反体制文学的代表作，改编的同名电影包揽奥斯卡五项大奖。｜作者：[美] 肯·凯西"
