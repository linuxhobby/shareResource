  added: 2026-10-04
  image: app-077.jpg


- id: app-078
  title: "Ice"
  category: 软件
  tags: ["软件", "macOS", "Ice"]
  quark_url: "https://pan.quark.cn/s/2f056d98424a"
  description: "Ice 是整理 macOS 菜单栏的工具。Mac 用久了，右上角会被各种图标塞满，系统自带的收纳能力却很有限。Ice 的做法是给菜单栏划一道可拖动的分隔线：常用图标留在左边，不常用的收进右边，需要时点一下展开，或者按快捷键临时呼出。图标可以逐个设为「总显示」「自动隐藏」或「从不显示」，也能设定某些 App 在有活动时才露脸。习惯之后桌面上方会清爽很多，截图和录屏时也不用再临时去关一堆菜单栏。适合已经被菜单栏图标挤到放不下、又不想一个个进 App 设置里翻开关的人。开源免费，主页 https://github.com/jordanbaird/Ice。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-078.jpg


- id: app-079
  title: "Hoppscotch"
  category: 软件
  tags: ["软件", "macOS", "Hoppscotch"]
  quark_url: "https://pan.quark.cn/s/dca4ff659b8b"
  description: "Hoppscotch 是 Postman、Insomnia 那一类 API 调试工具的开源替代品，主打轻快：网页版打开就能发请求，也提供桌面客户端和命令行工具。它支持 REST、WebSocket、GraphQL、Socket.IO 等多种协议，请求可以分组存成集合、配上环境变量（比如区分本地、测试、生产三套地址），还能把调通的请求一键生成多种语言的调用代码。团队模式下可以共享集合协作，自部署时数据留在自己的服务器。适合嫌重量级客户端启动慢、又不想把接口信息交到别人云上的开发者。开源免费，主页 https://hoppscotch.io。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-079.jpg


