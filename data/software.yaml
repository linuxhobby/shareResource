  quark_url: "https://pan.quark.cn/s/d67d7b90f4bf"
  description: "CotEditor 是一款轻量级纯文本编辑器，适合源代码、笔记、Markdown、网页内容等多种场景。界面干净利落，让日常编辑简单舒适；需要进阶操作时，强大的工具随时待命。专为 Mac 打造：只面向 macOS，从一开始就遵循系统习惯，与深色模式、版本、iCloud、VoiceOver 无缝集成，设置窗口也放在 Mac 用户习惯的位置。快速、专注、能扛真活：启动迅速，界面简洁有条理；内置 70 多种语言的语法高亮与基于语法的大纲菜单，一眼看清文档结构；还提供强大的查找替换（支持正则）、多光标编辑、脚本支持，以及把细节调到顺手为止的灵活配置。对文本讲究：从文本编码、换行符到 Unicode 规范化与各类书写系统都细致处理，可显示不可见字符，在换行符混用或存在无法以所选编码保存的字符时给出警告，并提供字符检查器与放大字形预览。｜Mineko IMANISHI"
