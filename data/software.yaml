- id: app-115
  title: "AnyBar"
  category: 软件
  tags: ["软件", "macOS", "AnyBar"]
  quark_url: "https://pan.quark.cn/s/96cf6cfd934d"
  description: "AnyBar 是一盏挂在菜单栏的彩色小圆点，简单到几乎没有界面。它本身不带任何业务逻辑，只监听本机一个 UDP 端口（默认 1738），你从命令行、脚本或任何程序发一个颜色名过去，圆点就变成那个颜色。于是任何长期任务都能被看见——备份进行中挂黄色、跑完变绿色、出错变红色，编译、下载、定时任务、服务器健康检查都可以这样可视化。它支持自定义图像，也能开多个实例分别盯不同的事。极轻、无窗口、常驻不惹事，适合本来就爱写脚本的人。开源免费，主页 https://github.com/tonsky/AnyBar。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-115.jpg


