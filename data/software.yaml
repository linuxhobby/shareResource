- id: app-081
  title: "The Jukebox App - Desktop"
  category: 软件
  tags: ["软件", "音乐", "macOS", "The Jukebox App - Desktop"]
  quark_url: "https://pan.quark.cn/s/a6c8245822e0"
  description: "The Jukebox App 把 Mac 变成聚会上的点唱机：以 Spotify 为曲库，启动后生成一个房间，宾客用手机扫码或输入房间码加入，各自把想听的歌加进队列，还能给别人点的歌投票，票数高的自动往前排。这样一来播放列表不再由某个人独裁，气氛也更容易热起来。要注意主办的人需要有 Spotify Premium 会员，一般宾客不必付费。适合家里聚会、生日、办公室活动时用——与其把手机递来递去排队点歌，不如让大家自己决策。｜Benjamin Barnett"
