  description: "百度网盘官方 macOS 客户端，本次收录 8.8.8 版 Apple Silicon（arm64）安装包，dmg 格式约 412MB，打开后拖进应用程序文件夹即可使用。作为国内覆盖面最广的网盘之一，百度网盘的 Mac 端覆盖文件上传下载、相册自动备份、离线下载、分享链接管理等核心功能，与手机端、Windows 端账号互通，多设备之间传文件、同步资料可以直接走网盘中转，不必再插 U 盘。对 Apple Silicon 用户来说，原生的 arm64 版本比转译运行效率高不少，M 系芯片上传输与解压大文件明显更省电，界面也针对 Retna 屏做了适配。免费账号的下载速度有限制，会员可享极速通道，这一点与 Windows 端一致；客户端内置的在线预览支持文档、图片、音视频等常见格式，不必下载到本地就能查看。适合已经把资料沉淀在百度网盘、需要在 Mac 上做日常存取与备份的用户，首次使用需登录百度账号，大文件传输建议在稳定网络下进行。｜百度"
