- id: app-046
  title: "Macdown"
  category: 软件
  tags: ["软件", "macOS", "Macdown"]
  quark_url: "https://pan.quark.cn/s/ddfafe83d514"
  description: "Macdown 是 macOS 上一款老牌开源 Markdown 编辑器，作者 uranusjr，界面走原生双栏：左边写源码，右边实时渲染，改动立刻看得见。语法上支持 GFM、表格、任务列表、脚注、MathJax 公式和代码块高亮，写完可以直接导出 HTML 或 PDF。它和后来那批 Electron 编辑器最大的区别是轻——体积小、启动快、界面干净，更像系统自带的备忘录，代价是没有标签页和插件生态。适合只想在本机安静写文档、记笔记、写博客初稿的人，不需要协同也不需要发布流程。开源免费，主页 https://macdown.uranusjr.com/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-046.jpg


