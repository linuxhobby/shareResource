- id: app-021
  title: "Marker Data"
  category: 软件
  tags: ["软件", "macOS", "Marker Data"]
  quark_url: "https://pan.quark.cn/s/196a9f4d8870"
  description: "Marker Data 是给 Final Cut Pro 用户做的标记处理工具。剪辑时打的标记往往不只是提示：客户的修改意见、配音的时间点、要交付的字幕参考，全都堆在时间线上。这个工具负责把标记数据从 FCPXML 里提取出来，整理成表格或文本导出去，方便发给客户看、交给字幕组，或者自己统计数量和时长。对手工一个个抄标记的人能省下大量重复劳动，也减少抄漏。适合接纪录片、广告、长期外包的剪辑从业者。开源免费，主页 https://markerdata.theacharya.co。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-021.jpg


- id: app-022
  title: "PearCleaner"
  category: 软件
  tags: ["软件", "macOS", "PearCleaner"]
  quark_url: "https://pan.quark.cn/s/a683246591b5"
  description: "PearCleaner 是 Mac 上的应用卸载与残留清理工具。拖动图标到废纸篓只删掉了主程序，偏好设置、缓存、日志、应用支持目录里的文件往往还散在各处，日积月累就是好几个 G。它的做法是：选中要卸载的 App，把关联文件一并扫出来列给你，先看再删，不满意可以单独取消勾选；反过来也能查某个 App 究竟在系统里放了些什么。还支持按大小找大文件、清理通用缓存。界面比同类商业工具朴素，但免费开源（fair-code 许可），也不常驻后台偷资源。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-022.jpg


- id: app-023
  title: "LeafView"
  category: 软件
  tags: ["软件", "macOS", "LeafView"]
  quark_url: "https://pan.quark.cn/s/32603f93f857"
  description: "LeafView 是一款极简的 Mac 图片查看器，用 Electron 打包、Leaflet.js 负责图像渲染。它的克制程度很高：不做图库管理、不做批量处理、不做任何编辑，只把「双击、看图、关掉」这件事做快。支持常见格式、缩放拖拽、适应窗口和全屏浏览，临时看一眼截图或者翻几张参考图时不用等大型程序加载。作者 sprout2000 还做了同系列的 Tauview（Tauri 版本），界面和功能几乎一致，差别只在打包方式：Electron 兼容性更稳，Tauri 更省内存。开源免费，主页 https://github.com/sprout2000/leafview。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-023.jpg


- id: app-024
  title: "OpenEmu"
  category: 软件
  tags: ["软件", "macOS", "OpenEmu"]
  quark_url: "https://pan.quark.cn/s/daa09128237e"
  description: "OpenEmu 是 macOS 上的复古游戏模拟器前端，开源免费。它自己不写模拟器核心，而是把 NES、SNES、Game Boy、世嘉 MD、PlayStation 等几十种主机核心整合到同一个图形界面里：拖入 ROM 就自动生成带封面、简介的游戏库，外接手柄开箱即识别，存档、即时存档也都是可视化操作。以往在 Mac 上玩老游戏要分别装好几个模拟器、各配一套手柄映射，OpenEmu 把这些步骤一次收拢。想重温童年主机游戏的话这是最省事的做法，界面友好，主页 https://openemu.org。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-024.jpg


- id: app-025
  title: "Only Switch"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Only Switch"]
  quark_url: "https://pan.quark.cn/s/a3a42a3d2081"
  description: "Only Switch 有两副面孔。作为 macOS 菜单栏工具，它把藏在系统设置深处的开关搬到一点即开的位置：隐藏桌面图标、切换深色模式、开热点、静音、清废纸篓、启动屏保等等，还能把自己常用的那几样排列成一列。作为家居中控，它可以管理家里的智能设备——灯光、电视、空调、窗帘、风扇、冰箱都能控制，兼容主流品牌，也接得上语音助手。适合既想随手切换 Mac 设置、又不想为全屋设备装上好几个 App 的人。｜Sivakumar Ramamurthy"
  date: 2025-05-22
  added: 2026-10-04
  image: app-025.jpg


- id: app-026
  title: "NetNewsWire: RSS Reader"
  category: 软件
  tags: ["软件", "新闻", "macOS", "NetNewsWire: RSS Reader"]
  quark_url: "https://pan.quark.cn/s/90ab9b758931"
  description: "如果播客能订阅收听，阅读为什么不能？NetNewsWire 就是一款免费开源的 RSS 阅读器，把你常看的博客与新闻站点的更新汇总到一个列表里，并记录哪些读过、哪些还没有。它做得最出色的是快——启动快、同步快、滚动不卡，中间也不会插广告和「猜你喜欢」。界面是地道的 macOS 移植风格，读长文时不会被一堆按钮打断。macOS 与 iOS 版体验一致，可以配合 iCloud 或主流 RSS 同步服务。适合仍然习惯「自己订阅、自己读」这种获取信息方式的人。｜Brent Simmons"
  date: 2020-03-08
  added: 2026-10-04
  image: app-026.jpg


- id: app-027
  title: "MonitorControl Lite"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "MonitorControl Lite"]
  quark_url: "https://pan.quark.cn/s/92831965704d"
  description: "MonitorControl Lite 解决的是 macOS 一直欠着不给的小功能：用菜单栏滑块直接调外接显示器的亮度（部分机型连音量也能调）。苹果自家的显示器可以用键盘直接控制，但绝大多数第三方外接屏的系统亮度滑块根本不起作用，只能去摸显示器边框上那排难按的物理按键。它支持平滑过渡而不是一格一格跳，也能自定义快捷键，外观参考了新版 macOS 控制中心的样子，简洁又不碍事。适合外接显示器长期办公、早已烦透了手动按边框按键的人。"
  date: 2021-11-23
  added: 2026-10-04
  image: app-027.jpg


- id: app-028
  title: "MeetingBar"
  category: 软件
  tags: ["软件", "效率", "macOS", "MeetingBar"]
  quark_url: "https://pan.quark.cn/s/391aadfc4405"
  description: "MeetingBar 解决的是开会前那两分钟的慌乱。日历里明明写着这个会，但链接藏在邀请的角落里，下一个会什么时候开始也得翻半天——它把今天剩下的日程直接摆进菜单栏，点开就能看到每场会的时间和「加入」按钮，Zoom、Google Meet、Teams 这类常见链接它会自己识别出来，一点即进。还支持直接从菜单栏发起临时会议、显示距离下一场还剩多久。对一天被切成好几段、在不同会议平台之间反复横跳的人，这个小小入口能省下大量找链接的时间。｜Andrii Leitsius"
  date: 2020-10-04
  added: 2026-10-04
  image: app-028.jpg


- id: app-029
  title: "MakeItHome - Screen extender"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "MakeItHome - Screen extender"]
  quark_url: "https://pan.quark.cn/s/088180690984"
  description: "MakeItHome 的思路是把「最常用的东西放在手边」这件小事做彻底：它提供一块可以自定义的常驻面板，把你常用的应用、文件夹和链接摆到鼠标一挥就到的位置，不必回到 Dock，也不用先最小化眼前的窗口去翻Finder。它更像给 Mac 加了一条随身工具带——藏在系统深处的目录、临时在用的素材夹、几个频繁切换的小工具，都可以收进去固定下来。适合显示器不够宽、或者受不了在层层窗口里找东西的人。作者 Riccardo Cecchini，主打开源工作区。支持 macOS。｜Riccardo Cecchini"
  date: 2022-12-02
  added: 2026-10-04
  image: app-029.jpg


- id: app-030
  title: "System Color Picker"
  category: 软件
  tags: ["软件", "开发工具", "macOS", "System Color Picker"]
  quark_url: "https://pan.quark.cn/s/10a30ed0fd8d"
  description: "System Color Picker 只做一件事：调用系统内置的取色器，从屏幕任意位置吸取颜色。取到的值可以复制成 HEX、RGB 等常用格式，边上还有调色板、最近取色记录和格式转换这些顺手的小功能。它的边界同样很清楚——依赖 macOS 自带的取色器，作者 Sindre Sorhus 在简介里坦承，macOS 26 上存在系统级 bug，偶尔会吸到错误的颜色，应用层面绕不过去。适合偶尔要抓个颜色、不想为此装专业设计工具的人；如果做的是精细的视觉工作，这个已知问题值得先确认在自己的系统上是否复现。｜Sindre Sorhus"
  date: 2021-04-29
  added: 2026-10-04
  image: app-030.jpg


- id: app-031
  title: "VoiceOver Designer"
  category: 软件
  tags: ["软件", "开发工具", "macOS", "VoiceOver Designer"]
  quark_url: "https://pan.quark.cn/s/3719d3a0081b"
  description: "VoiceOver Preview 是 VoiceOver Designer 的配套应用，专门打开 .vodesign 后缀的文件，也就是在 VoiceOver Designer 里排好的无障碍布局方案。使用流程很简单：先在 Designer 里把界面元素的朗读顺序与内容编排妥当，导出之后用这个 Preview 打开试听，确认视障用户实际听到的顺序是否符合预期。要想真的听到效果，得先在系统里启用 VoiceOver（可以让 Siri 帮你打开）。适合正在做无障碍适配、需要验证改造成果的开发者与设计师。配套工具支持 macOS。｜Mikhail Rubanov"
  date: 2023-02-26
  added: 2026-10-04
  image: app-031.jpg


- id: app-032
  title: "UnnaturalScrollWheels"
  category: 软件
  tags: ["软件", "macOS", "UnnaturalScrollWheels"]
  quark_url: "https://pan.quark.cn/s/5ccf926dff51"
  description: "macOS 的滚动方向设置一直有个二选一的麻烦：要么让触控板保持「自然」滚动（内容跟着手指走），要么为了外接鼠标把方向反转，系统不区分输入设备，两者只能取其一。UnnaturalScrollWheels 专门治这个：它只反转物理滚轮的方向，触控板那套自然滚动原样保留。于是同一台 Mac 上插着鼠标和用触控板时都符合直觉，不会因为换了输入设备就上下颠倒。工具极轻，设一次基本就忘了它。适合同时用两种输入设备、被这个方向问题困扰很久的人。开源免费。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-032.jpg


- id: app-033
  title: "SwiftShift Job Compare"
  category: 软件
  tags: ["软件", "商务", "macOS", "SwiftShift Job Compare"]
  quark_url: "https://pan.quark.cn/s/d24fe4ee73d7"
  description: "比较两份工作机会，只看表面工资几乎一定会看错。SwiftShift 让你把两个 offer 逐项填进去——时薪或年薪、预期每周工时、一年工作多少周、带薪休假天数、每天通勤的时间与距离、停车费和过路费——然后算出它们各自的真实价值：扣掉通勤时间之后每小时究竟挣多少，假期折算成钱值多少，每天开车的油钱过路费又吃掉多少。它不做职业规划，只是把那些容易被忽略的成本显性化，让两个数字放在一起比较。适合手上不止一个 offer、或者正在纠结要不要跳槽的人。Mac 上也能直接使用。｜Ian Neuhaus"
  date: 2026-08-12
  added: 2026-10-04
  image: app-033.jpg


- id: app-034
  title: "Tuneful for Spotify & Music"
  category: 软件
  tags: ["软件", "音乐", "macOS", "Tuneful for Spotify & Music"]
  quark_url: "https://pan.quark.cn/s/6eab5b0d8e26"
  description: "Tuneful 为 Spotify 和 Apple Music 带来精美的原生音乐控制，可从刘海、菜单栏或可自定义的迷你播放器操控音乐，完全融入 macOS。刘海集成：悬停即唤出播放器，带触感反馈，外观与行为可自定义；菜单栏播放器：菜单栏直接显示正在播放的内容，点击展开精致的控制浮层，多种样式可选；迷你播放器：多款精美样式让控制始终顺手；无需打开 Spotify 或 Apple Music，即可从刘海、菜单栏或迷你播放器把当前歌曲加入收藏；用 Swift 与 SwiftUI 打造，快速流畅、资源占用低；可接入 Spotify 与 Last.fm，支持曲目记录（scrobble）、更新正在播放状态与收藏曲目。每个界面都是可选的，只开启你需要的部分。｜Martin Fekete"
  date: 2025-01-06
  added: 2026-10-04
  image: app-034.jpg


- id: app-035
  title: "Tomato Bar"
  category: 软件
  tags: ["软件", "美食佳饮", "macOS", "Tomato Bar"]
  quark_url: "https://pan.quark.cn/s/d743608560e7"
  description: "Tomato Bar 是 Mac 菜单栏上的番茄工作法计时器。平时它只占菜单栏一格，点开能看到当前这一轮的剩余时间，也可以暂停、跳过或重置。节奏按番茄工作法来：专注一段时间、短休息一下，完成若干轮再安排一次长休息，具体时长都能自己调。它比较讨巧的地方是能和系统的「勿扰 / 专注模式」联动，专注计时期间自动屏蔽通知，结束时用提示音提醒，也支持全局快捷键直接开一轮。适合容易被消息打断、想给自己定个明确节奏的人——不联网、不注册，装上就能用。开源免费，macOS 原生包，下载后拖入「应用程序」文件夹即可使用。｜Tomato Bar LLC"
  date: 2020-07-13
  added: 2026-10-04
  image: app-035.jpg


- id: app-036
  title: "Tauview"
  category: 软件
  tags: ["软件", "macOS", "Tauview"]
  quark_url: "https://pan.quark.cn/s/59654547d72d"
  description: "Tauview 是一款走极简路线的 Mac 图片查看器，用 Leaflet.js 渲染图像、Tauri 做外壳，比起 Electron 那套体积更小、启动更快、内存更省。它只做一件事：双击就把图打开，支持缩放拖拽、适应窗口和全屏浏览，常见格式都能吃下。想快速看一眼截图或翻几张参考图时，不用等重量级程序慢慢起来。作者 sprout2000 另外还有一个 Electron 版本的兄弟项目 LeafView，界面和功能差不多，差别只在打包技术——要兼容性更稳就 Electron，要省资源就 Tauri。开源免费，主页 https://github.com/sprout2000/tauview。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-036.jpg


- id: app-037
  title: "Swift Bar"
  category: 软件
  tags: ["软件", "macOS", "Swift Bar"]
  quark_url: "https://pan.quark.cn/s/7fbdc7f5420a"
  description: "Swift Bar 是 macOS 上的一款菜单栏自定义工具，开源免费。做法很直接：把任意脚本的输出放到菜单栏。你可以用 shell、Python 或 Swift 写一小段代码，让它定时抓取汇率、服务器状态、待办数量、日程或天气，结果就显示在右上角，点开还能展开二级菜单和快捷操作。它是老牌工具 BitBar 的 Swift 重写版，体积更小、更省电，脚本生态可以直接沿用。对喜欢折腾效率工具的人来说，这是把零散信息收拢到一处的办法，主页 https://swiftbar.app。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-037.jpg


- id: app-038
  title: "Pika"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Pika"]
  quark_url: "https://pan.quark.cn/s/71a79e30adf1"
  description: "Pika 是 macOS 原生的开源取色器，名字谐音 picker。用法极简：拿起它吸取屏幕上任意一点的颜色，然后按需要的格式输出——HEX、RGB、HSL 都有，连 Swift 的 UIColor、CSS 变量这类能直接粘进代码的写法也备好了。设计师与前端之间来回核对颜色时最省事，看到界面上某个调得挺好的灰也能立刻抓下来存着。它还保留最近取过的颜色历史，不至于眼睛一离开就找不回来。作者 David Charles Gleason。支持 macOS。｜David Charles Gleason"
  date: 2024-12-11
  added: 2026-10-04
  image: app-038.jpg


- id: app-039
  title: "SwiftQuit"
  category: 软件
  tags: ["软件", "macOS", "SwiftQuit"]
  quark_url: "https://pan.quark.cn/s/82cf9ec8f993"
  description: "macOS 和 Windows 的习惯不一样：Windows 上关掉最后一个窗口通常就退出了程序，Mac 上关窗之后 App 还留在后台，久了 Dock 里挂一串没在用的图标，内存和电量都在悄悄消耗。SwiftQuit 把这套改回 Windows 的样子——关掉某个应用的最后一个窗口时就自动退出它。工具常驻后台、无需配置，也可以设一份例外名单，把邮件、备忘录、下载工具这类希望常驻的程序排除掉。适合从 Windows 转过来的人，或者单纯不喜欢后台堆着一堆程序的人；装上以后基本就在后台安静待着，不会打扰你。开源免费，主页 https://github.com/onebadidea/swiftquit。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-039.jpg


- id: app-040
  title: "Reminders"
  category: 软件
  tags: ["软件", "效率", "macOS", "Reminders"]
  quark_url: "https://pan.quark.cn/s/44420c3c3961"
  description: "「提醒事项」是苹果自带的待办应用，Mac 上随系统就有。用法很朴素：想到什么随手记一条，购物清单、工作任务、旅行准备都能往里塞，可以按时间提醒，也能按地点提醒——走到超市门口才弹出来的那种。清单能分组、能拆子任务，靠着 iCloud 在 iPhone、iPad、Mac 之间自动同步，在哪台设备上改动都一样。更进一步可以把一个清单共享给家人：谁买完谁勾掉，对方那边立刻更新。适合不想为了记待办再装一个 App、也懒得折腾同步方案的人。｜Apple"
  date: 2016-05-23
  added: 2026-10-04
  image: app-040.jpg


- id: app-041
  title: "Activity Bar - Menu Bar Stats"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Activity Bar - Menu Bar Stats"]
  quark_url: "https://pan.quark.cn/s/84426b8abf37"
  description: "Activity Bar 是一款轻量级工具，在 macOS 菜单栏实时监控系统状态，极简而实用，小屏幕也放得下。CPU：可监控系统、用户、空闲与总占用率（分项或一次全显），并可按核心查看，视图支持百分比或自定义柱状图标。GPU：监控占用率。内存：监控总量、应用、联动、压缩内存及内存压力。网络：显示上传、下载或双向速度，并可显示当前 IP 地址。磁盘：监控已用、可用与总空间，发生写入时红绿闪烁提示。蓝牙设备：查看设备电量并自定义外观。Pro 版可解锁弹窗与小组件中的详细指标。｜Denis Litvin"
  date: 2023-04-09
  added: 2026-10-04
  image: app-041.jpg


- id: app-042
  title: "SlowQuitApps"
  category: 软件
  tags: ["软件", "macOS", "SlowQuitApps"]
  quark_url: "https://pan.quark.cn/s/4b6fa3e9b9aa"
  description: "macOS 的 Command-Q 没有任何二次确认，写文档或开会投屏时手滑带上旁边的 Q，辛苦半天的窗口就没了。SlowQuitApps 的做法很轻：给全局的 Command-Q 加一段可配置的延迟（默认约一秒），按住不放才会真正退出，退出前还会显示倒计时，松手就取消。它不弹窗、不改你的使用习惯，只是把那个危险瞬间拉长到来得及后悔。可以设自选时长，也能按应用单独排除。适合经常演示、投屏、协作，或者单纯手不稳的人；装上以后它的存在感接近于零，直到哪天真救了你一次。开源免费，主页 https://github.com/dteoh/SlowQuitApps。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-042.jpg


- id: app-043
  title: "Plash"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Plash"]
  quark_url: "https://pan.quark.cn/s/d92462a5b9b2"
  description: "Plash 能把任意网页变成 Mac 的桌面壁纸。填上网址，那个页面就铺到墙纸的位置：可以常挂一张缓慢变化的气象雷达图、一份实时数据面板，或者干脆放 GIF 动图让桌面动起来。它可以添加多个网页随时切换，还能选择这个网页要不要响应鼠标——需要交互就让它点得到，不需要就把事件穿透到后面的桌面图标。配合隐藏 Dock，观感上几乎就是一块真的动态桌面。作者 Sindre Sorhus 一向做这类小而美的 Mac 工具。支持 macOS。｜Sindre Sorhus"
  date: 2020-01-08
  added: 2026-10-04
  image: app-043.jpg


- id: app-044
  title: "Focus Sessions • Self control"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Focus Sessions • Self control"]
  quark_url: "https://pan.quark.cn/s/564e4bf0ed6d"
  description: "Focus Sessions 是一款把「屏蔽」做成定时轮换的工具：设定一段专注时长，在这段时间里把指定的应用和网站挡住，时间没到就用不了，用外部约束来对付分心和刷网页的习惯。它也可以反过来当家长控制用——给孩子划出允许使用的范围和时段，并用密码把设置本身保护起来，防止孩子自己把限制改掉。这类工具的取舍很直白：不指望你靠意志力，而是先把诱惑隔断开。适合需要一点外力才能进入状态的人，或者家里有孩子用电脑、需要管理屏幕时间的家长。｜Denk Alexandru"
  date: 2020-08-22
  added: 2026-10-04
  image: app-044.jpg


