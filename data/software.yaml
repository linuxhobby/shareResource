  quark_url: "https://pan.quark.cn/s/e2efab4229ac"
  description: "Elephicon 是命令行工具 png2icons 的图形界面封装。做跨平台桌面应用时图标是个烦环节：macOS 要 .icns、Windows 要 .ico，各自还要求把一整套不同尺寸塞进同一个文件。用它的话，把一张 PNG（建议 1024×1024 起步）拖进窗口，一次性就把各平台需要的图标文件和尺寸序列生成出来，省掉敲命令行参数和背尺寸清单的功夫。适合正在用 Electron、Tauri、Flutter 打包桌面应用的开发者，走到发布环节会需要它。开源免费，主页 https://github.com/sprout2000/elephicon。macOS 原生包，拖入「应用程序」文件夹即可使用。"
