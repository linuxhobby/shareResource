  category: 软件
  tags: ["软件", "macOS", "Mackup"]
  quark_url: "https://pan.quark.cn/s/6f54ddc00090"
  description: "Mackup 是一个命令行工具，用来把散落在主目录各处的应用配置备份并同步到云端或 Git 仓库。它内置一份常见软件的支持列表，知道 ssh、vim、git、zsh、各类编辑器各自把配置放在哪里，跑一遍就把这些文件归到一个统一目录（通常是 Dropbox 或 iCloud），再用符号链接替回去。换机器时只要恢复目录、执行 mackup restore，所有软件的习惯设置一次性就位。对常重装系统或多台机器的人，这一步能省下几小时手动配置。开源免费，代码在 https://github.com/lra/mackup。"
