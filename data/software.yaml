- id: app-001
  title: "Parallels Desktop 18"
  category: 软件
  tags: ["软件", "虚拟机", "macOS", "Parallels Desktop 18"]
  quark_url: "https://pan.quark.cn/s/e9d2e5ed8ccc"
  description: "Parallels Desktop 18 是 2022 年那版的 macOS 虚拟机软件，作用是在 Mac 上同时跑起 Windows 与 Linux。它的看家本领是「融合模式」：Windows 应用可以像 Mac 应用一样出现在程序坞里，两个系统的窗口并排放在一起，互相拖文件、共享文件夹、共用剪贴板，不必在两套桌面之间来回切换。这一版针对 Apple M 系列芯片做了适配，Apple 芯片机型上跑的是 ARM 版 Windows。适合离不开某个 Windows 独占软件（网银、OA、专业工程工具），或者需要在 Mac 上验证 Windows 环境、做跨端测试的开发者。｜Parallels"
  date: 2022-08-09
  added: 2026-10-02
  image: app-001.jpg

- id: app-002
  title: "Parallels Desktop 19"
  category: 软件
  tags: ["软件", "虚拟机", "macOS", "Parallels Desktop 19"]
  quark_url: "https://pan.quark.cn/s/2c1e8d006a03"
  description: "Parallels Desktop 19 是 2023 年的那版 macOS 虚拟机软件，用途是在 Mac 上跑 Windows 与 Linux。这一版的重点是跟上当时的新系统：兼容 macOS Sonoma，同时对 Apple 芯片机型的性能与图形表现做了优化，一些 Windows 游戏和图形应用的流畅度比前代明显更好。它的标志性功能依然是「融合模式」——Windows 应用直接出现在 macOS 桌面和程序坞里，两边互相拖文件、共享剪贴板，不必在两个系统之间来回切换。适合离不开某个 Windows 独占软件，或者需要在 Mac 上验证 Windows 端表现的开发者。｜Parallels"
  date: 2023-08-21
  added: 2026-10-02
  image: app-002.jpg

- id: app-003
  title: "Raycast"
  category: 软件
  tags: ["软件", "启动器", "效率工具", "macOS", "Raycast"]
  quark_url: "https://pan.quark.cn/s/75eb7fb3f303"
  description: "Raycast 是很多人拿来替代 Spotlight 的命令面板：一个热键唤出输入框，之后基本不用再碰鼠标——启动应用、找文件、翻剪贴板历史、插入常用文本片段、管理窗口布局、做单位换算，都能在这里完成，主打的就是一个字快。它的扩展商店里有大量第三方插件，查 GitHub 议题、搜图标符号、改动工单状态、接 AI 提问都能一键装上；自己也支持用脚本写扩展，把每天重复的流程压成两下按键。适合希望把常用动作全部键盘化的人。macOS 为主，近两年也开始有 Windows 版本。｜Raycast Technologies"
  date: 2026-09-30
  added: 2026-10-02
  image: app-003.jpg

- id: app-004
  title: "Alfred"
  category: 软件
  tags: ["软件", "启动器", "效率工具", "macOS", "Alfred"]
  quark_url: "https://pan.quark.cn/s/f206383617c1"
  description: "Alfred 是 macOS 上的老牌键盘启动器，这一版是 Alfred 5。它比 Spotlight 强的地方在于唤出输入框之后那一层：除了打开应用和文件，还能算算术、查词典、搜联系人、执行系统操作（锁屏、清废纸篓、休眠），也管理着剪贴板历史和常用文本片段。真正拉开差距的是 Workflows——把一串步骤串成自定义工作流，想做的事基本都能拼出来，社区现成的成品也很多。核心功能免费，进阶能力靠付费的 Powerpack 解锁。适合愿意花点时间配置、希望键盘解决大部分操作的人。｜Running with Crayons"
  date: 2026-09-24
  added: 2026-10-02
  image: app-004.jpg

- id: app-005
  title: "AdGuard"
  category: 软件
  tags: ["软件", "广告拦截", "隐私保护", "macOS", "Windows", "AdGuard"]
  quark_url: "https://pan.quark.cn/s/166c0e8f2f68"
  description: "AdGuard 是系统级的广告与跟踪拦截工具，Mac 与 Windows 都有版本。它不像浏览器插件那样只在网页层面动手，而是把广告过滤、跟踪器拦截、恶意站点防护做在网络层与浏览器两头：网页里的横幅和贴片消失，应用内部偷偷上报的统计脚本也一并被拦。可以自己订阅过滤列表、写自定义规则，也能通过 DNS 过滤把范围扩到整台设备的流量。看得见的好处是页面干净、加载更快、流量也省；看不见的好处是那些跟在身后收集行为的脚本少了一半。适合对隐私比较在意、或者单纯受不了满屏广告的人。｜AdGuard"
  date: 2026-10-04
  added: 2026-10-04
  image: app-005.jpg

- id: app-006
  title: "Adobe 大师版"
  category: 软件
  tags: ["软件", "Adobe", "设计", "全家桶", "macOS", "Adobe 大师版"]
  quark_url: "https://pan.quark.cn/s/bb38eda73d00"
  description: "这是 Adobe 桌面软件的合集版本，一套里包含 Photoshop、Illustrator、Premiere Pro、After Effects、Acrobat 等主力工具的对应版本。它的便利之处在于不必一个个单独下载安装，也不用逐个确认版本搭配是否一致，一次装完即可长期使用，Windows 与 macOS 双平台都有对应的包。适合需要修图、剪辑、做特效、画矢量这条完整链路的创作者，一次性把工作面铺好。安装前留意一下系统版本和磁盘空间——这类大合集的安装包体积相当可观。｜Adobe"
  date: 2026-10-04
  added: 2026-10-04
  image: app-006.jpg


- id: app-007
  title: "剪映 2025 国家版"
  category: 软件
  tags: ["软件", "视频剪辑", "剪映", "短视频", "剪映 2025 国家版"]
  quark_url: "https://pan.quark.cn/s/74165e1e6f1d"
  description: "剪映是抖音官方的视频剪辑工具，这一版是特别版本：会员素材、贴纸、字体、转场特效与高级导出直接可用，导出不带水印。它的强项是把短视频那一套流程做得极顺——语音自动转字幕并套现成样式、画面跟着音乐自动卡点、口播常用的降噪与美颜都在手边，还有成套的带货模板和图片成片，批量生产内容时不用来回折腾。Windows 平台可用，不需要剪辑基础，跟着模板就能出片。适合做口播、带货、需要稳定日更的创作者。提醒一句：这类特别版本建议自用学习，正式商用还是请走官方渠道付费支持。下载后按包内说明安装即可。｜剪映"
  date: 2026-10-04
  added: 2026-10-04
  image: app-007.jpg


- id: app-008
  title: "IDM 下载器（终身会员版）"
  category: 软件
  tags: ["软件", "下载工具", "断点续传", "Windows", "IDM 下载器"]
  quark_url: "https://pan.quark.cn/s/a66cf4ef766d"
  description: "IDM（Internet Download Manager）是 Windows 上老牌的多线程下载工具，这一版标注为终身会员版。它的看家本领是把单个文件切成多份并发下载，尽可能把带宽吃满，再配合断点续传——掉线或临时关闭之后不必从头再来。浏览器集成是被称赞最多的一点：接管下载后基本不用手工复制链接；批量排队、按规则过滤，以及对网页视频的嗅探抓取也都常用。适合经常下载大文件、网络不太稳定、或者习惯一次性拉一堆素材的人。Windows 平台，按包内说明安装配置即可长期使用。｜Tonec"
  date: 2026-10-04
  added: 2026-10-04
  image: app-008.jpg


- id: app-009
  title: "Obsidian"
  category: 软件
  tags: ["软件", "笔记", "知识管理", "Markdown", "Obsidian"]
  quark_url: "https://pan.quark.cn/s/bf87d215f3a7"
  description: "Obsidian 是一款基于本地 Markdown 文件的知识管理工具。它和多数笔记软件最大的区别是：笔记就是你磁盘上的 .md 文件，不锁进私有格式，随时能用别的编辑器打开、能被 Git 管起来。核心玩法是双向链接——A 引用 B，B 底部就自动出现反向链接，日积月累笔记之间织成一张网，关系图谱能直接看出结构。插件生态是它另一块强项：看板、日历、Dataview 查询、模板、发布都在社区里找得到，官方另有同步和发布服务。适合做长期笔记、写长稿、搭知识库的人。｜Obsidian"
  date: 2026-10-04
  added: 2026-10-04
  image: app-009.jpg


- id: app-010
  title: "OpenShot"
  category: 软件
  tags: ["软件", "macOS", "OpenShot"]
  quark_url: "https://pan.quark.cn/s/2a7a6ceaf2e0"
  description: "OpenShot 是一款跨平台的开源视频剪辑软件，Windows、macOS、Linux 都有版本。它主打易上手：拖素材进轨道、裁剪、加转场、叠标题字幕，这些基础操作不看教程也能自己摸出来，关键帧动画和水印叠加也一应俱全，博主视频、课件录屏、家庭影像这类需求一个软件就够。相比 Premiere 和 DaVinci Resolve，它的门槛低得多；相比 iMovie，它在跨平台和多轨控制上更灵活。适合不想为剪辑付费、又接受不了纯命令行工具的人。macOS 原生包，拖入「应用程序」即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-010.jpg


- id: app-011
  title: "Zettlr"
  category: 软件
  tags: ["软件", "macOS", "Zettlr"]
  quark_url: "https://pan.quark.cn/s/13f0687c73ca"
  description: "Zettlr 是一款面向写作、尤其是学术写作的开源 Markdown 编辑器。它不满足于当记事本，而是要把「资料—卡片—成稿」这条链路打通：内置与 Zotero 联动的书库，写的时候能直接拖文献引用；支持 LaTeX 公式、脚注、交叉引用和多种引文格式；成稿可一键导出成 Word、PDF、ODT 或 HTML。对写论文、读书笔记、长篇稿件的人来说，它的价值是把参考文献这类琐事自动化，让注意力留在内容上。Windows、macOS、Linux 都有版本，这是 macOS 原生包，拖入「应用程序」即可。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-011.jpg


- id: app-012
  title: "Zed"
  category: 软件
  tags: ["软件", "macOS", "Zed"]
  quark_url: "https://pan.quark.cn/s/8d336b50ada9"
  description: "Zed 是一款用 Rust 写的现代化代码编辑器，开发团队里有原 Atom 和 Tree-sitter 的核心成员，主打启动快、响应快、内存占用低。它内置语言服务器、语法高亮、多光标、跳转、终端和 Git 面板，最特别的是把多人实时协作直接做进编辑器，适合结对编程和远程调试。相比 VS Code 的插件生态它更轻量、开箱即用，相比 Vim 的上手成本低得多。如果你每天要在大仓库里翻代码、又受不了 Electron 编辑器的拖沓，这个 macOS 原生包值得一试，下载后拖入「应用程序」文件夹即可。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-012.jpg


- id: app-013
  title: "WWDCScholars"
  category: 软件
  tags: ["软件", "社交", "macOS", "WWDCScholars"]
  quark_url: "https://pan.quark.cn/s/0a433df1a8fc"
  description: "WWDCScholars 是围绕 WWDC 奖学金圈子做的一个社交 App，后来这项活动延续为 Swift Student Challenge，作者 Sam Eckert。它的用处集中在大会前后：可以翻看历届获奖者的名单、看看他们提交了什么样的 Swift Playground 作品，也能认识同期入围的人互相交流项目。它的价值几乎全在这个「校友圈」上，不在圈子里的人用不上；而且这是款比较早期（2019 年前后）的应用，官方活动形式早已变化，联网数据能否取到并不确定，建议先装上看看能不能用再当回事。支持 macOS。｜Sam Eckert"
  date: 2019-06-05
  added: 2026-10-04
  image: app-013.jpg


- id: app-014
  title: "ueli"
  category: 软件
  tags: ["软件", "macOS", "ueli"]
  quark_url: "https://pan.quark.cn/s/9bf8e4b94001"
  description: "ueli 是一款跨平台的键盘启动器。按下自定义热键唤出搜索框，敲几个字母就能启动应用、打开文件与文件夹、跑 shell 命令、做单位换算，或者把关键词直接丢给搜索引擎。它的扩展机制还能把一串动作打包成一个工作流，比如「打开项目」一次拉起编辑器、终端和几个固定网页。配置和扩展都落在本地文件里，方便跟着 dotfiles 备份。相比 Alfred、Raycast 这类明星产品它更朴素，但胜在 Windows、macOS、Linux 表现一致，也不用被付费墙分成两半。开源免费，主页 https://ueli.app。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-014.jpg


- id: app-015
  title: "WezTerm"
  category: 软件
  tags: ["软件", "macOS", "WezTerm"]
  quark_url: "https://pan.quark.cn/s/1d1d8d89b810"
  description: "WezTerm 是 @wez 用 Rust 写的跨平台终端，同样走 GPU 加速渲染。它和 Alacritty 的取舍正好相反：多路复用（类似 tmux 的分屏与会话管理）和 SSH 客户端直接做进了终端本身，标签页、切分面板、回溯搜索都是现成的，不必再叠一层工具。配置用 Lua 写，能细到「按当前目录自动换配色」「不同主机套不同外观」；字体连字与回退链的调整也很完备。适合想要一个「开箱就能用、又足够能改」终端的人，Windows、Linux、macOS 体验一致。开源免费，主页 https://wezterm.org/。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-015.jpg


- id: app-016
  title: "Transmission Hub"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Transmission Hub"]
  quark_url: "https://pan.quark.cn/s/90171efe5108"
  description: "Transmission Hub 是给 Mac 上常驻下载任务准备的管理客户端，后端支持 Transmission、qBittorrent 和 Aria2 三种。它把任务管理从网页界面搬到了菜单栏与原生窗口里：能看到每个任务的进度、速度、详细信息和文件列表，也能直接启停、重命名、移动存储位置、重新校验、删除，还能给单个文件设置优先级或者跳过不想下的部分（比如一堆视频里的样片）。如果 Mac 上长期挂着一个下载器，用它敲一眼比开浏览器省心得多。｜展威 李"
  date: 2023-05-07
  added: 2026-10-04
  image: app-016.jpg


- id: app-017
  title: "Tabby - Browser Tab Manager"
  category: 软件
  tags: ["软件", "效率", "macOS", "Tabby - Browser Tab Manager"]
  quark_url: "https://pan.quark.cn/s/a81b30432101"
  description: "Tabby 是给「标签页开得太多」这件事准备的管理器。它的思路是把标签从浏览器窗口里抽出来，按网站或项目分组保存，需要的时候整组恢复，不必逐个回忆昨天那十几个网页分别在哪。对同时推进好几个项目、浏览器常年挂着几十上百个标签的人来说，它能省下反复重建上下文的成本；研究、写作、查资料这类多线任务尤其明显。要注意它要求 macOS 14（Sonoma）及以上，装之前先确认系统版本。导入现有浏览器的标签也是它用起来最顺手的一步。｜Fischnet Solutions, Inc."
  date: 2022-07-08
  added: 2026-10-04
  image: app-017.jpg


- id: app-018
  title: "Tiny Wi-Fi Analyzer"
  category: 软件
  tags: ["软件", "macOS", "Tiny Wi-Fi Analyzer"]
  quark_url: "https://pan.quark.cn/s/81797bc93355"
  description: "Tiny Wi-Fi Analyzer 是一款小巧的 macOS 无线分析工具。它的用处很实际：把附近能搜到的所有网络按信道、信号强度和安全协议列出来并画成图，让你看清自家路由器是不是正和邻居挤在同一个信道上、2.4GHz 该不该换个信道、5GHz 哪一频段更干净。装完在菜单栏点开就能看，不联网、数据全在本地。家里 Wi-Fi 时快时慢、会议室经常掉线、或者刚搬完家想给路由器挑个位置时，对着图调一下信道往往比重启管用得多。这类排查工具平时用不上，需要的时候能省掉一整个下午。开源免费，主页 https://nolze.github.io/tiny-wifi-analyzer/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-018.jpg


- id: app-019
  title: "Pritunl"
  category: 软件
  tags: ["软件", "macOS", "Pritunl"]
  quark_url: "https://pan.quark.cn/s/6244279c21ad"
  description: "Pritunl 是面向团队的 VPN 方案，分服务端和客户端：服务端用来集中管理 VPN 服务、用户、群组权限与路由策略，这个 macOS 客户端负责最后那段接入。管理员把配置文件或邀请链接发过来，导入之后就能连上，日常的切换连接、查看状态都在图形界面里完成。它对准的是已经有 Pritunl 部署的公司或团队——远程办公、多地组网这类场景；个人用户如果只是想找个能翻墙的免费 VPN，这个完全不对路，别下错。开源免费，主页 https://forum.pritunl.com。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-019.jpg


- id: app-020
  title: "Selectedvendors"
  category: 软件
  tags: ["软件", "购物", "macOS", "Selectedvendors"]
  quark_url: "https://pan.quark.cn/s/fbf3316effc3"
  description: "SelectedVendors 是 LifeArt Cabinetry 给自家经销渠道做的采购工具：打开就能浏览产品清单、查看款式规格与价格、直接下单，并随时跟踪订单进展到哪一步。它的价值在于把采购这件事从邮件和电话里搬出来——在客户家里现场量尺选材、在展厅挑面板、工地临时补货，都能立刻确认价格并下单，不必回头翻报价单。另有 macOS 版本，可以在 Mac 上处理采购与管理事宜。要注意它面向的是该品牌自己的渠道伙伴，不是通用购物平台，普通人装上多半没有可用账号，也对应不上德语以外的客服支持。｜LifeArt Cabinetry Corp"
  date: 2019-07-31
  added: 2026-10-04
