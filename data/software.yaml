- id: app-082
  title: "Compress Videos: Handbrake"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Compress Videos: Handbrake"]
  quark_url: "https://pan.quark.cn/s/a5094f52799d"
  description: "用智能视频压缩为 iPhone 腾出空间：照片和视频可能占掉 iPhone 高达 90% 的存储，空间告急时，就该压缩视频、缩放超大文件而不牺牲画质了。Video Compressor Pro 是一款功能强大又易用的视频与文件压缩工具，借鉴 HandBrake 等工具的先进压缩技术，可将 300MB 的视频压到 30MB 并保持 Full HD 分辨率。支持几乎所有主流格式的压缩、转换与缩放，可用现成预设也可自定义分辨率、码率、压缩速度乃至目标文件大小；保存前能预览压缩后的体积，并提供高、普通、低三档画质。其他功能：把视频裁剪到任意长度；剪切后转换不额外损失画质；内置音频提取器，一键把视频转为 MP3；支持 MP4、MOV、AVI、MKV 等格式，压缩后可立即分享，为 iPhone 释放存储空间，Mac 上同样可用。｜Trang Nguyen Sy"
  date: 2021-02-16
  added: 2026-10-04
  image: app-082.jpg


- id: app-083
  title: "Freeter"
  category: 软件
  tags: ["软件", "macOS", "Freeter"]
  quark_url: "https://pan.quark.cn/s/76c09b69fe0f"
  description: "Freeter 想解决的是「每次开工都要先花十分钟摆桌面」这个问题。它的单位是工作区：一个项目往往牵着一堆文件夹、几个常用网页、特定软件和一批待办，Freeter 把这一整套打包成一个工作区，点一下全部就位，切走时当前这套自动收起来，下次回来还是原样。它也允许只用其中一部分——比如把常用文件夹钉在一个总是可见的面板上，或者当成一个随呼随到的暂存区。适合手上同时转着好几个项目、上下文来回切换的人，做设计、剪辑、策划这类素材散在各处的工种尤其省事。开源免费，主页 https://freeter.io/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-083.jpg


- id: app-084
