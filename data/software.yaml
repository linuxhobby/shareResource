- id: app-098
  title: "Corkulous - Your Ideas"
  category: 软件
  tags: ["软件", "效率", "macOS", "Corkulous - Your Ideas"]
  quark_url: "https://pan.quark.cn/s/eb65df485aa0"
  description: "Corkulous（Mac 与 iOS 版）是以自然方式收集、组织和分享创意的绝妙工具，Mac、iPhone 或 iPad 用户都值得拥有！它是一款多用途看板应用：可在看板上放置便签、标签、照片、联系人、形状、连线、PDF、链接预览与任务，还有强大的手绘工具，能用手势快速画出形状和线条。创意可以集中在一块看板上，也能分散到多块看板甚至嵌套的子看板，每块看板都有充足空间与分辨率。可用作软木板、流程图、创意墙、相册、提醒板、思维导图、目标管理、规划表、愿景板、待办清单、备考工具、课程规划等。功能：支持 PDF、视频、链接预览、Emoji、连线、便签、标签、照片、联系人、任务、索引卡、箭头文字与 40 多种形状；手绘工具支持形状与线条手势；可导出分享 PDF、PNG、文本与 Corkulous 文件；通过 iCloud 与 Dropbox 同步看板并可与其他用户共享；强大的搜索能力；完善的拖放支持；深色与浅色模式；iOS/Mac 多窗口；Markdown 文本格式；多档看板分辨率；自由平移与缩放；可把看板存为模板复用；支持嵌套看板；生物识别锁定内容；Mac 上支持触控栏与菜单快捷操作；iOS/Mac 均支持键盘快捷键。｜Corked Labs, LLC"
  date: 2017-02-14
  added: 2026-10-04
  image: app-098.jpg


- id: app-099
  title: "Hidden Bar"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Hidden Bar"]
  quark_url: "https://pan.quark.cn/s/66c23a8c264c"
  description: "Hidden 让你隐藏菜单栏图标，还 Mac 一个清爽的菜单栏。功能：登录时自动启动；5、10、15、30 或 60 秒后自动隐藏；用全局快捷键显示或隐藏；展开时占用完整菜单栏的模式（对 MacBook Air、13 英寸 MacBook Pro 等小屏用户尤其实用）；支持阿拉伯语等 RTL 语言。新版还优化了「始终隐藏」功能，不再需要重启应用，并附上使用教程；图标也更新为与最新 macOS 更协调的样式。如需更多信息或希望增加功能，欢迎联系 macos@d.foundation。｜Dwarves Foundation"
  date: 2019-02-19
  added: 2026-10-04
  image: app-099.jpg


- id: app-100
  title: "Gifski"
  category: 软件
  tags: ["软件", "摄影与视频", "macOS", "Gifski"]
  quark_url: "https://pan.quark.cn/s/5ea39d83b886"
  description: "把视频转换成高品质 GIF。Gifski 可将视频转成每帧数千色的动画 GIF，这得益于高效的跨帧调色板与时间抖动等精妙技术。请注意：Gifski 是转换器而非 GIF 创作工具，不会支持往 GIF 里添加文字或元素，这类需求更适合用剪辑软件完成。功能：视频裁剪与裁切；精确控制尺寸；控制循环与「溜溜球」往返播放；调节速度与循环延迟；转换前预览 GIF；复制、分享或直接拖出 GIF；提供分享扩展与系统服务；可选生成体积更小的低画质版本；自动保存到「下载」文件夹；最高生成 50fps 的 GIF；也可导出修改后的视频而不转成 GIF；支持「快捷指令」。转换方式：把视频拖到窗口或 Dock 图标；点击「打开」按钮选择视频；或在 Finder 中右键视频，用「打开方式」选择本应用。支持 macOS 支持的所有视频格式（H.264、HEVC、ProRes 等 .mp4/.mov），不支持 QuickTime Animation，建议改用 ProRes 4444 XQ。｜Sindre Sorhus"
  date: 2018-02-23
  added: 2026-10-04
  image: app-100.jpg


- id: app-101
  title: "Calendr"
  category: 软件
  tags: ["软件", "macOS", "Calendr"]
  quark_url: "https://pan.quark.cn/s/d288f8bedd86"
  description: "Calendr 是 macOS 菜单栏上小巧的日历，技术上采用 MVVM 架构，混合了 RxSwift、AppKit 与 SwiftUI。它的功能取向很克制：菜单栏里一眼能看到接下来的日程与提醒，点开则展开完整的月历视图，不必为了确认下一场会在哪开会专门打开日历应用占一个窗口。事件在天数上有标记，也能显示周数，整体观感与 macOS 原生贴合。适合不想让日历占着桌面空间、习惯把信息集中在菜单栏的人。开源免费，主页 https://github.com/pakerwreah/Calendr。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-101.jpg


- id: app-102
  title: "Barton & Gray Clubhouse"
  category: 软件
  tags: ["软件", "生活", "macOS", "Barton & Gray Clubhouse"]
  quark_url: "https://pan.quark.cn/s/9f2b6b82c58e"
  description: "Barton & Gray Mariners Club 是一家会员制游艇俱乐部，这款 App 是给会员和船员准备的：会员可以在手机上浏览自己的权益、联系俱乐部、管理日程与安排出海；船员一侧用来查看排班、提交船长报告；未加入的朋友也能通过它了解这家俱乐部具体做什么。它属于典型的私域应用——不是会员的话，装上也基本没有可以操作的空间。另有 macOS 版本，支持在 Mac 上查看日程与俱乐部信息。｜Barton & Gray Mariners Club"
  date: 2021-05-16
  added: 2026-10-04
