  quark_url: "https://pan.quark.cn/s/603d3bd28429"
  description: "Rectangles 是一款基于 Shikaku（数矩形）规则的益智游戏，气质安静：界面干净，通关后会给一幅可爱的像素小画作为奖励。规则并不复杂——棋盘上散布着数字，每个数字代表一个矩形的精确面积，你要把整个棋盘不重不漏地划分成若干矩形，让每个矩形恰好包含一个数字。听起来简单，网格一大就需要相当系统的推理。适合喜欢纯逻辑、愿意坐着慢慢推的人；单局时间不长，随手来一盘也不占神。支持 macOS。｜MoreThanThat"
