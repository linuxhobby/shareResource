- id: app-094
  title: "Clop"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Clop"]
  quark_url: "https://pan.quark.cn/s/8ff8e54ce269"
  description: "Clop 是一款地域性极强的小工具，唯一的任务是在法兰西岛（大巴黎地区）帮你找到最近的烟草店。在法国，香烟基本只能在挂 Buraliste 招牌的烟草店买到，这类店关门早，周日和深夜常常一店难求，所以「附近哪家还开着」是真实痛点。它会列出周边店铺位置，告诉你哪间还没打烊。要留意两点：覆盖范围只有大巴黎，人在别的城市或者法国之外基本没用；上架时间也早（2014 年前后），地图数据是否还更新建议先试再依赖。支持 macOS。｜DatsChill"
