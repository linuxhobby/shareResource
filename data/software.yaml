- id: app-051
  title: "Quicksilver - Galaxy Road to Arcade Adventures"
  category: 软件
  tags: ["软件", "游戏", "macOS", "Quicksilver - Galaxy Road to Arcade Adventures"]
  quark_url: "https://pan.quark.cn/s/ff4a7c5c8cfb"
  description: "《Quicksilver - Galaxy Road to Arcade Adventures》是一款休闲街机风的小游戏，2015 年上架。玩法围绕「与时间赛跑」：障碍和机会轮番涌来，你得在越来越快的节奏里不断做出反应，到后段基本靠肌肉记忆撑着。它的卖点是动感的电子配乐加上复古像素美术，两者咬合得很紧，听感和手感都带上那个年代街机的味道；成绩可以上传排行榜和全球玩家比一比。适合通勤路上、休息间隙来上几局，也适合本来就喜欢复古视觉和内容简洁的休闲玩家。支持 macOS。｜Daniel Reichert"
  date: 2015-11-21
  added: 2026-10-04
  image: app-051.jpg


- id: app-052
  title: "Pine Player"
  category: 软件
  tags: ["软件", "音乐", "macOS", "Pine Player"]
  quark_url: "https://pan.quark.cn/s/b450339128ee"
  description: "一款播放器同时搞定高品质视频与 Hi-Res 音频。Pine Player Pro 是 macOS 上的高级媒体播放器，支持从常见视频格式到 Hi-Res 音频、DSD、SACD ISO、MIDI 乃至 Tracker 音乐的广泛格式。MIDI 与 SoundBank 合成器：不止播放 MIDI，还能用多种乐器音色演绎同一段音乐、可视化监视并微调演奏，支持外部 MIDI 输出以连接软硬件设备。Tracker 音乐：原生支持 VGM、VGZ、Adlib(ROL)、MOD、XM、S3M、IT 等经典格式，直接调用内嵌的乐句、采样与乐器数据播放，无需转换。视频播放与转换：支持 MP4、MOV、MKV、AVI、WMV、WebM，借 Apple 硬件加速流畅解码，支持 SRT、SMI、SUB 等字幕，提供变速、缩放与 A-B 循环。音频：MP3、M4A、FLAC、AAC、WAV、AIFF、OGG、Opus、WMA、APE、TTA、WavPack，支持 DSD（DSF/DFF）播放、DoP 输出与 SACD ISO。｜Siseong Ahn"
  date: 2016-05-14
  added: 2026-10-04
  image: app-052.jpg


- id: app-053
  title: "Omnivore"
  category: 软件
  tags: ["软件", "macOS", "Omnivore"]
  quark_url: "https://pan.quark.cn/s/84e3d6f066c3"
  description: "Omnivore 是给重度阅读者做的开源「稍后读」方案。看到长文来不及读，先丢进来，它会把正文抓取下来重新排版，去掉广告、导航栏和花哨样式，改成适合长时间盯着读的版式，图片和代码块都保留。读的时候可以划重点、写批注，这些内容同步回个人 Library，也能导出到 Obsidian、Notion、Readwise 这类工具里接着加工。文章都能离线归档，配上高亮和自由标签，攒起来就是自己的资料库。适合每天要消化大量文章的人。开源免费，主页 https://github.com/omnivore-app/omnivore。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-053.jpg


- id: app-054
  title: "MarkEdit"
  category: 软件
  tags: ["软件", "macOS", "MarkEdit"]
  quark_url: "https://pan.quark.cn/s/0ecfeacbd2c0"
  description: "MarkEdit 的定位很清楚：像 Mac 自带的「文本编辑」那样轻，但只用来写 Markdown。它由开源社区用 Swift 写成，双击打开就能写，不需要配置工作区或导入项目。语法高亮、目录大纲、即时预览、字数统计都在，还支持 TeX 公式和一批批处理命令——给列表排序、大小写转换、按列编辑这类重复操作能一次搞定。原生带来的最大好处是启动几乎没有延迟，改几行 README、记一段笔记不必等主力编辑器缓缓打开。适合把 Markdown 当日常书写格式的人；如果要 Markdown 之外还要管版本、插件和发布流程，它则有意保持克制。开源免费，主页 http://tiny.cc/markedit。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-054.jpg


- id: app-055
  title: "MacSymbolicator"
  category: 软件
  tags: ["软件", "macOS", "MacSymbolicator"]
  quark_url: "https://pan.quark.cn/s/82e09197ea44"
  description: "MacSymbolicator 是给苹果平台开发者排查崩溃用的工具。线上崩溃日志捞下来时，里面往往只有一串内存地址，「符号化」就是把这些地址还原成可读的函数名、文件名和行号——这一步做得成做不成，直接决定你能不能看懂问题出在哪。手工做要拼 dSYM 路径、敲命令行，版本多了之后尤其容易搞混归档。MacSymbolicator 把这些做成图形界面：拖入崩溃日志，再给到对应的 dSYM 或 App 归档，它自己匹配符号表并输出可读结果。适合经常处理线上崩溃、需要翻旧版本归档的开发者，能省下不少查 Objective-C 符号的时间。开源免费，主页 https://github.com/inket/MacSymbolicator。macOS 原生包，拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-055.jpg


