  description: "Flameshot 是一站式截图工具，Linux 上尤其普及，Windows 和 macOS 也能用。它和系统自带截图的差别在于「截完立刻能改」：框选范围之后直接进入标注界面，箭头、方框、马赛克、模糊、高亮、序号、文字注释都摆在旁边，改完可以另存、复制到剪贴板，配好图床还能一键上传生成分享链接。选区会自动吸附窗口边界，也能按上一次的区域重复截图，批量做教程配图时省事不少。适合写文档、提缺陷单、给同事远程解释问题、或者做技术分享的人——截图这件小事一次做完，不用再打开第二个软件。开源免费，主页 https://flameshot.org。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
