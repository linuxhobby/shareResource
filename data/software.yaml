  description: "Script Manager 是一个给 shell 脚本准备的简单外壳，这里是源码版。它的定位介于「写完就丢的临时脚本」和「正式运维系统」之间：可以在应用里创建、导入、编辑脚本，然后一键执行，省掉每次开终端、找路径、加执行权限的步骤。适合手上攒了一堆日常维护脚本（清缓存、备份目录、拉镜像、重建索引）不想散在桌面各处的人。既然是源码版，也能按自己的习惯改一改再用。支持 macOS。开源免费，主页 https://github.com/SmartPack/ScriptManager。"
