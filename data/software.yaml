  tags: ["软件", "macOS", "LinearMouse"]
  quark_url: "https://pan.quark.cn/s/c8b45ad05fdd"
  description: "LinearMouse 是 Mac 上一款开源的鼠标与触控板增强工具。macOS 原生的滚动方向和加速度一直不太顺手，它把这些细节交回用户手上：可以反转滚轮方向、把加速曲线改成线性、逐键自定义功能，也能单独给某个应用设置规则，比如修图时让滚轮变成缩放。常驻菜单栏，占用极低。对每天有大量鼠标操作的人，这种细微的顺手感会累积成明显的舒适；外接办公鼠标、罗技 MX 系列的用户尤其能感觉到差别。开源免费，主页 https://linearmouse.app。"
