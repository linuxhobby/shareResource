  description: "用 Braver Search 提升 Safari 浏览体验：获得 Brave 出色的隐私搜索，同时保留 Safari 强大的生态功能，隐私与便利无需二选一。主要功能：iOS 与 macOS 一键设置；搜索请求即时重定向到 Brave Search；跨设备同步设置；内置支持 Brave 的 AI 摘要；简单开关随时切换。保留 Safari 生态优势：设备间接力（Handoff）、已存密码与自动填充数据、iCloud 钥匙串与验证码、你喜爱的 Safari 扩展，与 Apple 生态完整集成。隐私保护：搜索在抵达 Safari 默认引擎之前就被重定向，零数据存储、零追踪，搜索历史真正私密。iPhone、iPad 与 Mac 体验一致，设置自动同步。注：本应用并非 Brave Software 官方产品，与其无任何关联。｜Brenden Bishop"
