- id: app-096
  title: "Browserosaurus"
  category: 软件
  tags: ["软件", "macOS", "Browserosaurus"]
  quark_url: "https://pan.quark.cn/s/6fe751342a77"
  description: "Browserosaurus 解决的是一个很小却每天都遇到的麻烦：Mac 上点开链接只会用系统默认浏览器。把它装好并设为默认之后，每次点击链接都会弹出一个选择面板，本机装的 Safari、Chrome、Firefox、Edge 之类全在上面，方向键加回车就能挑。它还能按域名或 URL 规则记住偏好——公司内网固定走某浏览器，个人邮箱固定走另一个。对同时装着好几个浏览器、工作账号和个人账号必须严格分开的人，这一个环节能省下大量来回复制粘贴。它也支持把链接直接复制到剪贴板，方便临时存着。开源免费，主页 https://browserosaurus.com。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-096.jpg


