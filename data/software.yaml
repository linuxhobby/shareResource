- id: app-104
  title: "Flycut (Clipboard manager)"
  category: 软件
  tags: ["软件", "开发工具", "macOS", "Flycut (Clipboard manager)"]
  quark_url: "https://pan.quark.cn/s/14cfa8b2edb5"
  description: "Flycut 是一款简洁的面向开发者的剪贴板管理器，基于开源应用 Jumpcut 打造，自身同样开源（github.com/TermiT/flycut）。每次复制代码片段，Flycut 都会存入历史；之后即使当前剪贴板里是别的内容，也能用 Shift-Command-V 调出历史依次粘贴，热键与其他设置可在偏好中调整。由开发者、为开发者而做，是 macOS 上的剪贴板利器。｜General Arcade (Pte. Ltd.)"
  date: 2011-06-08
  added: 2026-10-04
  image: app-104.jpg


- id: app-105
  title: "Cronica"
  category: 软件
  tags: ["软件", "娱乐", "macOS", "Cronica"]
  quark_url: "https://pan.quark.cn/s/64d66e849dcb"
  description: "Cronica 是一款精致的极简影视观剧清单应用，覆盖 iPhone、iPad、Mac、Apple Watch、Apple TV 与 Apple Vision Pro：记录看过的片、不丢进度、随时准备下一部，无论你是刷剧狂魔还是休闲观众，都能把片库打理得井井有条。功能：看下一集，首页直达待看剧集，不必翻找上次看到哪；随手把电影与剧集标记为已看，进度与清单同步；当清单中的影片上映或有新剧集上线时收到提醒；片单、评分、笔记与偏好在设备间通过 iCloud 私密同步；支持 Siri 与「快捷指令」（最多 10 个 App 快捷指令），可语音添加片目、标记已看、查看待看、打开搜索；提供主屏幕小组件与控制中心组件；可从 IMDb、Letterboxd、TMDb、JustWatch 等通过分享表单或快捷指令添加片目，并分享能在应用或网页中打开的 cronica.watch 链接；可看预告片，浏览演员、季集与详情；基于 TMDb 的 JustWatch 数据查看各平台上线情况并按常用服务筛选；支持自定义列表、筛选排序、主题配色与首页定制；还可选择连接 SIMKL 或 TMDb 账号同步片库。｜Egger & Co"
  date: 2022-05-05
  added: 2026-10-04
  image: app-105.jpg


- id: app-106
  title: "Control Room Clock"
  category: 软件
  tags: ["软件", "摄影与视频", "macOS", "Control Room Clock"]
  quark_url: "https://pan.quark.cn/s/3469f157756e"
  description: "Control Room Clock 是专为广播工程师、制作人员与媒体专业人士打造的精密计时工具，追求准确与清晰。主要功能：常亮显示，悬浮时钟覆盖在所有应用与空间之上；点击穿透模式，锁定时钟位置，可在其下方正常工作；时间偏移，加减秒数以对齐演播室设备或不同时区；可自定义显示，尺寸、颜色、透明度与字体都能匹配你的控制室布置；12/24 小时制切换，可显示秒；七段数码字体，专业数字显示风格，可读性极佳；极简干净，没有多余干扰，需要时时间就在眼前。适用于广播控制室、电台与电视台演播室、直播现场、流媒体与录音棚，以及任何需要精确时间同步的工作环境，支持 macOS。｜Andrew Logan"
  date: 2025-11-26
  added: 2026-10-04
  image: app-106.jpg


- id: app-107
  title: "CalendarX"
  category: 软件
  tags: ["软件", "macOS", "CalendarX"]
  quark_url: "https://pan.quark.cn/s/8456b9dde9d0"
  description: "CalendarX 是放在 macOS 菜单栏里的一枚小日历。点开就能看到整月视图和当天日期，不必为了瞄一眼今天是几号去翻「日历」或者解锁手机。它的取舍很明确：不做账号同步、不做事件编辑，只负责把日期摆在你随时能看到的地方，和系统日历配合使用最合适。这种工具看着简单，实际能省掉不少细小打断——写周报排期、安排上线时间、随手确认下周三是不是节假日，都不用跳出当前的工作。适合习惯把信息集中在菜单栏、讨厌桌面上堆窗口的人。开源免费，主页 https://github.com/ZzzM/CalendarX。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-107.jpg


- id: app-108
  title: "BrightIntosh"
  category: 软件
  tags: ["软件", "macOS", "BrightIntosh"]
  quark_url: "https://pan.quark.cn/s/325df8c97bb9"
  description: "BrightIntosh 专门解决一件事：MacBook Pro 的 XDR 屏明明还能更亮，系统却在日常使用时把亮度按住了。它把这个上限去掉，让整块屏幕在非 HDR 内容下也能跑满 XDR 的高亮度，不需要外接显示器，也不用先播一段 HDR 视频。工具常驻菜单栏，点一下开启，随时切回系统默认。实际用处很直接——在窗边、户外或光线强的房间里工作时，屏幕不用再暗到看不清。要注意长期高亮度会更耗电、也可能更烫，建议按需开启而不是长期挂着。开源免费，主页 https://brightintosh.de。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-108.jpg


- id: app-109
  title: "Blurred"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Blurred"]
  quark_url: "https://pan.quark.cn/s/436c6cdbebc5"
  description: "Blurred 是一款帮你在 Mac 上集中注意力的小工具，做法很直接：把非活动窗口调暗，让眼睛自然落在正在工作的那一个上，减少余光里的干扰。它有两种模式——「单屏」只聚焦主屏幕最前方的窗口，「并行」则同时聚焦所有屏幕上最前方的窗口，外接多显示器时各有各的适用场景。支持登录时自动启动，也能自定义全局快捷键随时开关。新版还可以在菜单栏图标上滚动快速调整模糊程度，并新增了中文界面。适合屏幕大、习惯同时铺开好几个窗口的人。｜Dwarves Foundation"
  date: 2020-02-20
  added: 2026-10-04
  image: app-109.jpg


- id: app-110
  title: "BatteryBoi"
  category: 软件
  tags: ["软件", "macOS", "BatteryBoi"]
  quark_url: "https://pan.quark.cn/s/bacfe01bce7e"
  description: "BatteryBoi 是 macOS 上一款开源的电池菜单栏工具。系统自带的电量显示只有几个粗线条状态，它把信息做细：剩余电量、充满还剩多久、当前功耗、电池健康状态都能直接看到，也能按自己的习惯设置充电提醒和阈值通知。对长期插电使用、或常带着笔记本外出办公的人，这些数据能帮着判断什么时候该拔电源、电池是不是开始老化。工具本身轻量，常驻菜单栏几乎不占感知资源，界面也干净。开源免费，主页 https://batteryboi.ovatar.io/。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-110.jpg


- id: app-111
  title: "Auto Mute :Screen Lock & Sleep"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Auto Mute :Screen Lock & Sleep"]
  quark_url: "https://pan.quark.cn/s/541c25b43c64"
  description: "Auto Mute 解决一个很具体的尴尬：你离开座位时，别人在 Mac 上随手按了播放，就知道你刚才在看什么、听什么。装上之后，锁屏或 Mac 进入休眠的瞬间音频自动静音，等你回来解锁，音量又恢复到离开前的样子——不用多余操作，也不用提醒任何人。新版还加了「耳机断开自动静音」：任何耳机、耳塞、蓝牙或外接音频设备断开时，内置扬声器立刻静音，避免声音突然外放。常驻后台几乎无感，适合在开放工位、公共场合用 Mac 的人。｜khalid altariqi"
  date: 2026-08-19
  added: 2026-10-04
  image: app-111.jpg


- id: app-112
  title: "Background Music: DJ Radios"
  category: 软件
  tags: ["软件", "音乐", "macOS", "Background Music: DJ Radios"]
  quark_url: "https://pan.quark.cn/s/46950ed71d32"
  description: "面向商业场所的专业背景音乐：DJ Radios 提供 DJ 精选的未发行音乐，专为咖啡馆、餐厅、零售店等商业场所打造。曲目不受表演版权组织（PRO）管理，可作为传统音乐授权的合法替代或补充。为什么选 DJ Radios：只放未发行音乐，所有内容由独立 DJ、制作人、艺人与厂牌直接提供并授权商业播放；PRO 合规更简单，可生成记录订阅周期的官方证明，向检查人员出示，覆盖 ASCAP、BMI、SESAC（美国）、PRS for Music（英国）、SOCAN（加拿大）、APRA AMCOS（澳新）等全球主要组织，一键证明你的音乐不在 PRO 曲库内；一份订阅在 iPhone、iPad、Mac 与 Apple TV 通用；全天候不间断直播 DJ Set，为公共空间量身打造，不重复、不中断。免费档提供 1 小时试用与全品质收听；周订阅含 7 天免费试用，可随时取消；年订阅比周订阅省 50% 以上；另可一次性购买终身访问，终身会员支持离线下载。｜SAS Corvaisier"
