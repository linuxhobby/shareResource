  tags: ["软件", "效率", "macOS", "Maccy"]
  quark_url: "https://pan.quark.cn/s/38c43e66883d"
  description: "Maccy 是一款只专注一件事的剪贴板管理器：让复制历史触手可及，仅此而已。快如闪电：不到一秒即可打开并搜索全部剪贴板历史，不打断你的专注。键盘优先：直接输入想找的内容回车即可，双手不必离开键盘。原生极简设计：没有花哨界面和冗余功能，就像系统自带的剪贴板管理器。安全私密：密码管理器中的内容不会被记录，所有数据只存在你的 Mac 上、绝不上传。可定制可扩展：偏好设置覆盖每个细节，还能用「快捷指令」自动化复杂场景。开源：源码以 MIT 许可发布于 GitHub，App Store 版本用于支持开发。｜Antonina Ivanova"
  date: 2020-10-16
  added: 2026-10-04
  image: app-060.jpg


- id: app-061
  title: "MiniSim"
  category: 软件
  tags: ["软件", "macOS", "MiniSim"]
  quark_url: "https://pan.quark.cn/s/d52d91b9730f"
  description: "MiniSim 是给移动端开发者准备的菜单栏小工具。Xcode 的设备面板层级深、Android Studio 启动又慢，而日常开发中「把模拟器拉起来看一眼」这件事频率极高——它把这个动作压缩到菜单栏一点：列出本机已创建的 iOS 模拟器与 Android 虚拟设备，点一下就启动，也支持一键关机，还能按运行状态筛选、自定义设备显示名。对 Flutter、React Native 或者原生双端开发的人是日常刚需；偶尔需要截个图验证适配、或者只是想在 iPhone 模拟器里翻一翻的人，也省得先等 Xcode 转圈。开源免费，主页 https://www.minisim.app/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-061.jpg


- id: app-062
  title: "Karabiner-Elements"
  category: 软件
  tags: ["软件", "macOS", "Karabiner-Elements"]
  quark_url: "https://pan.quark.cn/s/4dca82c98051"
  description: "Karabiner-Elements 是 macOS 上改键能力的天花板。它的玩法从简单到离谱：把 Caps Lock 改成「单按是 Esc、组合按是 Control」，把闲置的Fn 键变成 Hyper 超键；也能给外接键盘单独配一套方案，笔记本自带键盘保持原样。再往上可以手写 JSON 规则，实现「左右 Shift 单按分别输出左右括号」这类复合修改，规则还能从社区分享的仓库里一键导入。对 HHKB、60% 键盘和 Vim 用户几乎是必备品。要注意它工作在驱动层面，macOS 大版本升级之后有时要等新版兼容。开源免费，主页 https://karabiner-elements.pqrs.org/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-062.jpg


- id: app-063
  title: "iTerm2 Buddy"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "iTerm2 Buddy"]
  quark_url: "https://pan.quark.cn/s/243cd6a063bd"
  description: "iTerm2 Buddy 把你的 iPhone 或 iPad 与 Mac 上的终端 iTerm2 连起来。完成配对之后就不必坐回电脑前——窝在沙发上或在外面奔波，都能随时看看终端里正在发生什么：编译有没有跑完、某个长任务还在不在继续、日志是不是仍在刷，必要时也能直接执行操作。要注意它是配套性质的工具：必须在 Mac 上装好 iTerm2、完成配对并安装免费配套组件之后才能工作，单独装手机侧没有意义。作者是 iTerm2 的作者 GEORGE NACHMAN。｜GEORGE NACHMAN"
  date: 2026-09-08
  added: 2026-10-04
  image: app-063.jpg


- id: app-064
  title: "Keka"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "Keka"]
  quark_url: "https://pan.quark.cn/s/41bea86fb87a"
  description: "Keka 是 macOS 上的压缩解压工具，作者 Jorge Garcia Armero。它处理的事情很集中：把文件压成 zip、7z、tar、rar 这类常见格式，反过来也都能解开，分卷压缩和密码保护这些稍微专业一点的需求同样支持。最顺手的用法体现出它的 macOS 血统——直接把文件拖到 Dock 上的图标，或者在访达里右键选择，不必先打开一个窗口再层层设置。适合日常要打包交付、或者时不时收到各种压缩格式的同事文件的人。官方站在 Mac App Store 之外提供免费下载，付费是自愿性质。｜Jorge Garcia Armero"
  date: 2011-10-27
  added: 2026-10-04
  image: app-064.jpg


- id: app-065
  title: "MacBox"
  category: 软件
  tags: ["软件", "macOS", "MacBox"]
  quark_url: "https://pan.quark.cn/s/77d078b85a67"
  description: "MacBox 是 86Box 的 macOS 图形界面封装。86Box 本身是历史悠久的老式 PC 模拟器，能忠实还原 386、486、Pentium 那一代机器，用来跑 DOS 和 Windows 9x 时代的软件，代价是配置文件和启动参数相当繁琐。MacBox 把这些搬到图形界面里管理：选机型、定 CPU 和内存、挂载软盘硬盘镜像、挑显卡声卡，统统变成点选，不用再手搓配置。适合想让一台老 PC 复活、跑早期软件，或者对旧硬件有研究兴趣的人。开源免费，主页 https://github.com/Moonif/MacBox。macOS 原生包，拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-065.jpg


- id: app-066
  title: "Mac Mouse Fix"
  category: 软件
  tags: ["软件", "macOS", "Mac Mouse Fix"]
  quark_url: "https://pan.quark.cn/s/01bcfdfbdac8"
  description: "Mac Mouse Fix 是把普通鼠标拉到 Magic Mouse 手感的那一块拼图。苹果自家的鼠标滚轮体验做得很顺，但换成几十块的第三方鼠标之后，滚动方向反了、加速曲线飘忽、侧键完全没用——它把这些全部接管：滚动方向可与触控板保持一致，加速度可以换成线性，还能给中键、侧键分别指派 Mission Control、前进后退、粘贴等动作。另外它有惯性滚动，习惯了触控板的人换回鼠标不会觉得割裂。适合主力用鼠标、又受不了 macOS 默认那套鼠标体验的人，游戏办公两头跑的场景尤其明显。开源免费，主页 https://macmousefix.com/。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-066.jpg


- id: app-067
  title: "KeePassXC"
  category: 软件
  tags: ["软件", "macOS", "KeePassXC"]
  quark_url: "https://pan.quark.cn/s/1d188dd46a9c"
  description: "KeePassXC 是一款开源密码管理器，源自 Windows 上的 KeePass Password Safe，由社区移植到 Windows、macOS、Linux 三平台。它的特点是密码库就是本地的一个加密文件，不依赖任何厂商的云服务：文件放在哪、用什么方式同步，全由你自己决定。库内支持分组、标签、自定义字段与附件，内置的生成器能产出高强度随机密码，浏览器扩展负责自动填充，也兼容 TOTP 二次验证码。适合信不过把密码交给第三方云、又希望多个系统用同一套方案的人。开源免费，主页 https://keepassxc.org/。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-067.jpg


- id: app-068
  title: "Itsycal"
  category: 软件
  tags: ["软件", "macOS", "Itsycal"]
  quark_url: "https://pan.quark.cn/s/af01f6acf4c3"
  description: "Itsycal 是 Mac 菜单栏上一枚小巧的月历。定位很清楚：不接管日程、不做同步，只在点开时给你一个月的视图，顺便列出当天或未来几天的事件，不必为了确认今天几号专门打开一个窗口。系统日历等账户的事件都能显示，点某一天还能直接新建事件。它最讨喜的地方是够小——菜单栏空间金贵，它只占日期那点宽度，也不抢注意力。适合已经把系统日历用起来、只想要一个常驻入口的人。官网 http://www.mowglii.com/itsycal。开源免费，主页 https://github.com/sfsam/Itsycal。macOS 原生包，拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-068.jpg


- id: app-069
  title: "Lulucat Flow: Screen Recorder"
  category: 软件
  tags: ["软件", "摄影与视频", "macOS", "Lulucat Flow: Screen Recorder"]
  quark_url: "https://pan.quark.cn/s/83ebeeb41551"
  description: "Lulucat Flow 可同时录制多个信号源，并把每一路写入独立文件：选好需要的显示器、摄像头、麦克风和系统声音，按下录制，所有源同步开始。每个源一个文件：两机位加双麦克风的一次录制会生成四个文件，而不是一个混合视频：不做合成、不做混音，文件可直接导入 Final Cut Pro、DaVinci Resolve、Premiere Pro 等任何支持标准 QuickTime 与 AAC 的剪辑软件。信号源：所有连接的显示器（经 ScreenCaptureKit，最高 60fps，可含或不含光标）、所有摄像头（含连续互通相机与 USB 设备，以相机支持的最高格式录制）、每个麦克风与音频接口输入（各为独立音轨）、Mac 播放的系统声音（可录整机或指定应用）。暂停与恢复：暂停时关闭当前文件但保持预览，恢复后在同一个项目中开启新的一组文件；每段录制按启动时刻单独成文件夹，同一文件夹内的文件共享时间轴，可直接并行对齐轨道。工程目录内附 project.json（完整轨道清单）与 AGENTS.md（文件夹结构与文件命名规则说明），文件名不含空格，脚本与编码代理可直接读取处理，`*.WA.mov` 这类通配符即可挑出所有带音轨的视频。录制时可查看每路的实时画面、音量表与分辨率、帧率、编码、文件大小、写入速度，页脚显示剩余磁盘空间与当前码率下的可录时长。｜GOODWRITE LIMITED"
  date: 2026-08-04
  added: 2026-10-04
  image: app-069.jpg


- id: app-070
  title: "Kap"
  category: 软件
  tags: ["软件", "macOS", "Kap"]
  quark_url: "https://pan.quark.cn/s/a8071c3ed1c9"
  description: "Kap 是开源的屏幕录制工具，基于 Web 技术构建，主打把「录下来到发出去」这一段做顺：框选区域或全屏录制，支持麦克风录入（配合音频插件还能录到系统声音），录完自带轻量编辑器，可以裁剪片头片尾、调整分辨率，然后导出 GIF、MP4、WebM，配好账号还能一键上传生成短链接。对 Mac 用户来说最实在的一点是 GIF 这条链路终于不用绕：写文档、提缺陷单、录操作演示、录 bug 复现，几步就能做出可以直接贴走的动图。适合开发者、产品经理和做教学内容的创作者。开源免费，主页 https://getkap.co。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-070.jpg


- id: app-071
  title: "Jan"
  category: 软件
  tags: ["软件", "macOS", "Jan"]
  quark_url: "https://pan.quark.cn/s/eb72d9555f21"
  description: "Jan 是一个把大模型搬到本机运行的开源桌面应用。界面和操作习惯接近 ChatGPT，区别在于所有对话、模型和配置都留在自己的电脑上：不用注册账号，断网照样能聊，数据不外传。它通过 llama.cpp 加载 GGUF 格式的开源模型，也能按需接入云端大模型作为备选，本地跑不通的任务可以临时切过去。对在意隐私、想在飞机或无网环境里写草稿、或者只是好奇心重想试试本地模型的人都很合适。需要注意的是本地推理速度取决于内存和芯片，选模型时留意标注的体积和最低配置，别一上来就拉七十亿参数的大模型。开源免费，主页 https://jan.ai/。macOS 原生包，拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-071.jpg


- id: app-072
  title: "KeyCastr"
  category: 软件
  tags: ["软件", "macOS", "KeyCastr"]
  quark_url: "https://pan.quark.cn/s/20cbbc7b2d01"
  description: "KeyCastr 是按键可视化工具：你敲什么，屏幕上就同步显示什么。录屏教程、直播、产品演示、讲课时观众看不见你的手，多这样一层显示，别人就能跟上操作节奏。它会把修饰键渲染成 ⌘、⇧、⌥ 这类符号，也能显示连击序列，显示时长、位置、字体、配色和背景都可以调，另有「只显示修饰键」的简洁模式。可视化插件还能自己写，想做得更贴合自己的录屏风格也不难。适合做教学内容、内部培训、开源项目演示的人，录完 Export 出来直接就是成品。开源免费，主页 https://github.com/keycastr/keycastr。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-072.jpg


- id: app-073
  title: "InsomniaZ - Never Sleep"
  category: 软件
  tags: ["软件", "实用工具", "macOS", "InsomniaZ - Never Sleep"]
  quark_url: "https://pan.quark.cn/s/bec6beae6ea5"
  description: "你最需要 Mac 保持清醒时它却睡着了？InsomniaZ 来解决：合上盖子、起身离开、开始下载，无论怎样都能让 Mac 保持唤醒。无需复杂设置，菜单栏点一下即用，开启后就可以忘了它。适用场景：合上 MacBook 带去开会却中断了下载；离开工位喝咖啡被 Teams 标记为「离开」；接上外接显示器合盖后屏幕全黑。功能：合盖防睡眠（有无外接显示器、插电或电池供电皆可）；合盖状态下插拔电源仍持续生效；定时会话，设为 15 分钟、1 小时或 8 小时，到点自动关闭，不必惦记；无限模式整夜保持唤醒；全局快捷键在任何应用中即时切换；高级模式可避免办公软件把你判定为空闲。仅驻留菜单栏，同心圆图标一眼看出状态（启用时上色、关闭时低调），无 Dock 图标、无窗口管理负担。底层采用多层防睡眠机制互相备份，任何一层失效都有其他层兜底，被强制休眠后也会自动恢复保护。完全不收集数据：无分析、无追踪、无网络请求，一切本地完成。｜Pawan Dixit"
  date: 2018-12-21
  added: 2026-10-04
  image: app-073.jpg


- id: app-074
  title: "Ice Cubes for Mastodon"
  category: 软件
  tags: ["软件", "社交", "macOS", "Ice Cubes for Mastodon"]
  quark_url: "https://pan.quark.cn/s/d5f4b4139e38"
  description: "Ice Cubes 是一款快速、可靠且美观的 Mastodon 客户端，可连接任意 Mastodon 实例并使用其丰富功能。浏览主页、跨站（联邦）与本地时间线；推送通知；时间线同步；对任意嘟文收藏、加书签、转发、分享乃至引用，引用功能还会把其他嘟文链接嵌入内容中，方便直接阅读。出色的 iPad 支持，含专门的通知栏；可用列表整理时间线，随时增删成员、新建列表，并按列表、关注的话题标签等筛选。接入 Mastodon 强大的流式 API，时间线实时刷新不错过任何内容；还能置顶其他实例的本地时间线，用一个账号跟进多个社区。支持标签分组（用多个标签拼出专属时间线）、探索与搜索、私信专属标签页、在应用内直接编辑个人资料、多账号快速切换，以及大量个性化选项。内置 AI 工具：撰写嘟文时可帮你纠错甚至缩短文字，还能自动生成图片描述。全部开源，源码见 github.com/Dimillian/IceCubesApp，Mac 上同样可用。｜Thomas Ricouard"
  date: 2023-01-19
  added: 2026-10-04
  image: app-074.jpg


- id: app-075
  title: "IINA"
  category: 软件
  tags: ["软件", "macOS", "IINA"]
  quark_url: "https://pan.quark.cn/s/a3710e68737c"
  description: "IINA 是 macOS 上的现代视频播放器，底层用 mpv。它的价值在于把 mpv 几乎通吃的解码能力和地道的 Mac 界面合到一处：原生窗口、深色模式、触控栏控制、画中画、Force Touch 快进都贴合 Mac 的使用习惯，在线字幕搜索和逐帧截图这些细节也做得很到位。相比 VLC 它更符合 macOS 的审美，相比 QuickTime 它能吃下的格式多得多——mkv、HEVC、外挂字幕都不在话下。适合当作 Mac 的默认播放器。开源免费，主页 https://iina.io。macOS 原生包，拖入「应用程序」文件夹即可使用。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-075.jpg


- id: app-076
  title: "HostsX"
  category: 软件
  tags: ["软件", "macOS", "HostsX"]
  quark_url: "https://pan.quark.cn/s/6390303c2481"
  description: "HostsX 是 macOS 上的 hosts 文件管理工具。改 hosts 最常见的场景是本地开发与调试：让某个域名临时指向测试机、把线上地址拦回本机做联调、或者验证 DNS 改动的效果。手工改 /etc/hosts 要开终端、敲 sudo，改完还得记得改回来，HostsX 把这些变成图形界面里的几套配置方案：事先存好几组，用的时候一键切换启用哪一套，不用每次手敲。适合需要频繁在本地、测试、线上环境之间来回切换的开发者，做前后端联调时也省事。开源免费，主页 https://github.com/jiannaiwei/HostsX。"
  date: 2026-10-04
  added: 2026-10-04
  image: app-076.jpg


- id: app-077
  title: "Hyper: VTuber Avatar Studio"
  category: 软件
  tags: ["软件", "摄影与视频", "macOS", "Hyper: VTuber Avatar Studio"]
  quark_url: "https://pan.quark.cn/s/cb144fa700dc"
  description: "面向新手与资深 VTuber 的专业虚拟形象创作工具，支持 Hyper Avatars 与 VRM 文件。创建专属 Hyper Avatar：为 VTubing 定制精美的 3D 形象，所有模型均由自家艺术家制作，全部预绑定骨骼、开箱即用，可从上百科素材中挑选。导入现有模型：已有 VRoid 3D 形象、.VRM 文件或绑定好的 VRChat 角色都能导入 Hyper Studio，在 Studio 里制作 TikTok、Twitch、Twitter 内容或与朋友分享。内置面部与手部动作捕捉：仅用摄像头即可开播，手部捕捉等更多能力持续更新。虚拟摄像头：把 Hyper Avatar 接入 Twitch、YouTube、Zoom 等任意支持摄像头输入的应用，兼容 OBS、StreamLabs，可用绿幕背景将形象叠加到直播、游戏或视频中；进入 Zoom、Discord、Google Meet、Microsoft Teams 会议也不在话下。内置上百种表情与姿势，让形象唱歌、跳舞、打斗。多模型、多角色、多套服装可在同一处统一管理。订阅 Hyper Pro 解锁完整工具，Mac 上可直接开播。｜Hyper Online, Inc."
