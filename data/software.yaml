  quark_url: "https://pan.quark.cn/s/906631a0f47a"
  description: "Bruno Reels Casino 是一款以赌场风格老虎机为主题的休闲娱乐游戏：收录了多种主题的老虎机盘面，转轮的手感与动画做得比较顺滑，符号配色鲜艳，完成任务和限时活动可以拿到奖励。玩法上没有技巧成分——押注、旋转、看有没有连成线，本质上是运气和手感。需要提醒的是这类游戏带明显的博彩性质，内部设有投入与奖励机制，建议只当作消遣，注意控制时间和投入金额，未成年人不宜体验。支持 macOS。｜EverPrime Futures Inc."
