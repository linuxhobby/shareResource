  description: "全新布鲁克林篮网官方应用重磅回归，为新老球迷而建！数秒内购票、管理并将球票加入电子钱包；实时比赛数据含详细逐回合播报与升级版球员资料；动态比赛视觉：焦点图块与脉冲指示器标出比赛正酣的时刻；简洁日历视图一眼浏览后续对阵；解锁 My Brooklyn Rewards 专属奖励，季票会员使用更便捷；个性化内容卡片、定向促销与及时的推送提醒让你随时掌握动态；加载更快、更稳定，数据分析更丰富。无论坐在场边还是路上刷比分，官方应用都能让你紧跟每一次扣篮、三分与压哨绝杀，支持 macOS。｜Brooklyn Nets"
