  category: 软件
  tags: ["软件", "macOS", "Hammerspoon"]
  quark_url: "https://pan.quark.cn/s/84306791d1f7"
  description: "Hammerspoon 是 macOS 上的桌面自动化框架，用 Lua 书写。它把窗口布局、应用切换、快捷键重绑定、剪贴板历史、菜单栏自定义、Wi-Fi 与电源状态监听这些系统接口统一暴露出来，几十行 Lua 就能拼出自己想要的行为：一个按键把窗口摆到左半屏并顺手呼出终端、连上公司网络自动开勿扰并调低音量、给常用长句绑个全局快捷键。它是当年 Mjolnir 的延续，配置即代码，改完重载即刻生效。适合愿意折腾、希望电脑完全按自己习惯运转的人；只想点几下鼠标就配置好的话，它的门槛偏高。开源免费，主页 http://www.hammerspoon.org。macOS 原生包，下载后拖入「应用程序」文件夹即可使用。"
