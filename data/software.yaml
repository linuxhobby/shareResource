  quark_url: "https://pan.quark.cn/s/c3920e5b5e64"
  description: "Cyberduck 是一款文件浏览器，支持 FTP、SFTP、WebDAV、Amazon S3、OpenStack Swift、Backblaze B2、Microsoft Azure 与 OneDrive、Google Drive 和 Dropbox，可向虚拟主机服务商传输文件，也能以同样顺手的界面和随手可取的标签连接 Rackspace Cloud Files、Google Storage、Amazon S3 等云存储账户。支持拖放下载、上传、移动与复制文件，树状视图便于高效浏览大型目录结构；传输管理轻松，可与本地目录双向同步。修改文件时能与任意外部编辑器无缝联动，快速改动内容。还可配置 Amazon CloudFront 与 Akamai CDN，从边缘节点向全球分发文件，Mac 上开箱即用。｜David Kocher"
