- id: app-103
  title: "Free Ruler"
  category: 软件
  tags: ["软件", "开发工具", "macOS", "Free Ruler"]
  quark_url: "https://pan.quark.cn/s/f12c1dab66ae"
  description: "Free Ruler 在屏幕上提供横竖标尺：颜色随意选，单位可在像素、毫米、英寸之间循环切换（按 U），标尺可悬浮在其他应用之上（按 F），窗口可独立移动或成组移动（按 G），可显示或隐藏标尺阴影（按 S），可把标尺原点对齐到鼠标位置（按 O），按 Command-R 重置标尺位置。新版改进了成组标尺的体验：可将成组标尺合并为单一窗口，并能在不成组的情况下单独隐藏或显示横向、纵向标尺臂，是 macOS 上的屏幕标尺工具。｜Pascal Balthrop"
