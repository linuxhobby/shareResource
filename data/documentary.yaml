- id: dc-075
  title: "鸟瞰地球"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/17a42cecd966"
  description: "由英国广播公司（BBC）精心打造、全高清钜制的大自然生态纪录片《万里傲翔》。拍摄时间超过三年，跨越地球六大洲，包括南美洲、北美洲、非洲、欧洲、亚洲及澳洲，超过四十个国家。摄制队采用了尖端的摄影器材，糅合新颖的拍摄手法，甚至把轻型摄录机挂在候鸟颈项上拍摄，由候鸟们亲自领航，带大家翱翔万里，横跨海洋和陆洲，进入候鸟与大自然的奇妙世界 。节目更被英国《泰晤士报》赞誉为「令人惊艳」之作。｜TMDB 7.0"
  date: 2011-12-29
  added: 2026-05-02
  image: dc-075.jpg

- id: dc-074
  title: "骇客如何改变世界"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/8a6b301b90c4"
  description: "讲的互联网上那一批被称作黑客的人：动机各不相同——有的为了抗议，有的纯属恶作剧，有的只是想证明自己进得去。片子把从早期电话飞客到匿名者那条线梳理了一遍，真正讨论的问题是：当一群没有组织的人能够在网上采取一致行动，这究竟是一种新的抗议形式，还是单纯的破坏。适合对网络亚文化、匿名组织和信息自由议题感兴趣的观众；想看技术细节的会失望，它的重心在人和社会。立场并不中立，看的时候留个心眼反而更有意思。受访双方几乎都说得通，这一点挺妙的。"
  date: 2013-07-01
  added: 2026-05-02
  image: dc-074.jpg

- id: dc-073
  title: "非洲的动物上班族"
  category: 纪录片
  tags: ["纪录片", "动画", "非洲"]
  quark_url: "https://pan.quark.cn/s/74e746f66b03"
  description: "这是一部把动物拟人成上班族的日本喜剧动画：狮子、巨嘴鸟和蜥蜴三人同在非洲的一家大公司做事，迎面撞上各种荒唐的职场日常——毫无理由的项目、不容辩驳的降薪、说不通的上司。它们的每一天都被粗暴的言语和奇怪的举动填满，看得出来作者把社畜那一肚子怨念全塞了进去，热带草原和食物链什么的早就忘到一边。适合正在上班、想看点吐槽式解压短动画的观众，每集都很短。节奏很快，笑点基本是靠吐槽一句句堆起来的。｜TMDB 5.8"
  date: 2019-10-07
  added: 2026-05-02
  image: dc-073.jpg

- id: dc-072
  title: "铭记历史"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/ab856a4c13e1"
  description: "这部纪录片脱胎于 BBC 在上世纪五十年代的同名系列——那一版记录的其实还是当时人记忆犹新的二十世纪前半叶。新版接着往下讲，用大量当年的新闻影像把那半个世纪的政治、社会与文化变迁串起来：战争、抗议、流行文化、厨房里的变化都在其中。它的独特之处在于让当事人对着当年的画面亲述，而不是后来者的总结陈词。适合喜欢二十世纪历史影像资料的观众；期待紧凑叙事的话会觉得结构偏散。素材自带的年代感是别的历史节目给不了的东西。"
  date: 2010-09-27
  added: 2026-05-02
  image: dc-072.jpg

- id: dc-071
  title: "铁路漫步"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/be6babd046d6"
  description: "这是一档以铁路为线索的行脚节目：主持人茱莉亚沿着英国各地的线路一段段走，在车站和沿线小镇落脚，顺路拜访当地的名人异士，听他们讲这条线当年带来了什么。片子同时把铁路对英国工业革命的推动交代清楚——货运、通勤、度假潮如何被铁轨改写，沿途的历史掌故与风土人情也顺手带出来。节奏舒缓，适合随手打开慢慢看。适合喜欢英国乡村、铁道文化和旅行人文纪录片的观众。沿途那些小镇车站本身就是英国的另外一面。｜TMDB 6.7"
  date: 2008-10-02
  added: 2026-05-02
  image: dc-071.jpg

- id: dc-070
  title: "野性南美洲"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/f5d1f9993bb7"
  description: "一连六集，探索南美洲大陆上繁杂独特、惊险刺激的野生生态。从赤道几乎伸展至南极，广袤的南美大陆地貌悬殊，既有热带海洋，也有冰冠雪山。地球上最大的河系、最长的山系、最大的雨林和最乾的沙漠，都在南美洲。 摄影队运用红外线夜视摄影机和最先进的摄影技术，把鲜为人知的动物呈现在我们眼前。而空中摄影师则飞跃大陆，以全新角度记录南美洲那变化多端的地貌。 这六集特辑带我们深入亚马逊盆地，登上安第斯山脉的雪峰，横穿大草原，穿梭生气勃勃的雨林，最后饱览南美洲那壮观的海岸线--这旅程终身难忘。｜TMDB 9.0"
  date: 2000-11-06
  added: 2026-05-02
  image: dc-070.jpg

- id: dc-069
  title: "里克·斯坦的墨西哥美食之旅"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/68adee5ec199"
  description: "1968 年，年轻的里克·斯坦沿着太平洋海岸公路一路开到墨西哥边境，那趟旅行让他记了一辈子。五十年后他重走这条路：从旧金山出发回到墨西哥，一路吃过去——路边摊、家庭厨房、当地主厨的招牌菜，边吃边听这些人讲自己和食物之间的关系。里克的路数一贯随和，不做夸张的挑战，重点放在食材为什么这样处理、这道菜为什么长这样。适合喜欢美食旅行节目、或者打算沿这条路自驾的人；指望刺激环节的话会失望。｜TMDB 7.3"
  date: 2017-11-07
  added: 2026-05-02
  image: dc-069.jpg

- id: dc-068
  title: "谁在引导我们消费"
  category: 纪录片
  tags: ["纪录片", "纪录", "无节制消费的元凶"]
  quark_url: "https://pan.quark.cn/s/62d55a75670f"
  description: "我们为什么要买东西？谁让这个世界变成了无节制消费的样子？调查记者雅克·佩雷蒂一路追查这个问题，最后给出的答案有点反直觉：元凶并不是人们习惯归咎的广告人和营销人员。片子从耐用产品的刻意短命、到把消费包装成身份认同，一层层把制造欲望的机制拆开来看。看完之后你走进任何一家商场的感觉都会不一样。适合愿意被泼冷水、想知道自己钱包为什么总是空的观众，评分在同类题材里相当高。看完再走进商场，感觉会不太一样。｜TMDB 8.0"
  date: 2014-07-12
  added: 2026-05-02
  image: dc-068.jpg
- id: dc-067
  title: "恋爱小行星"
  category: 纪录片
  tags: ["纪录片", "动画", "喜剧", "行星"]
  quark_url: "https://pan.quark.cn/s/7c64c28bfa35"
  description: "这是一部把天文爱好拍得很可爱的日本动画：高中生木之幡米拉小时候参加野外露营，认识了一位名叫苍的少年（后来才发现认错了性别）。两人仰望星空时得知，天上有一颗和米拉同名的星星——刍藁增二（Mira），却没有一颗属于苍。于是他们约定，将来一定要找到一颗小行星，把它命名为「苍星」。故事就从这个约定开始，讲的是社团里几个人一点点走近天文的过程。适合喜欢天文题材与治愈系动画的观众。社团日常和天文知识配得相当自然，不生硬。｜TMDB 6.4"
  date: 2020-01-03
  added: 2026-05-02
  image: dc-067.jpg

- id: dc-066
  title: "蓝色星球 2"
  category: 纪录片
  tags: ["纪录片", "纪录", "家庭", "蓝色星球"]
  quark_url: "https://pan.quark.cn/s/780acf3f1e07"
  description: "自然界里没有哪里比大海更让人神往：既狂野得令人敬畏，又因为未知而格外迷人。这部系列从冰雪覆盖的极地海域，一路拍到颜色变幻无穷的珊瑚礁；从风暴不断的大西洋，到伸手不见五指、布满奇特生物的深海海底，把人类至今仍知之甚少的那部分海洋摊开给观众看。它是《蓝色星球》的续作，设备与技术比当年强了不止一代，因此记录到许多从未见过的画面与行为。适合没有任何门槛的海洋题材入门观众。老搭档的解说一如既往地不抢戏，把舞台留给画面。｜TMDB 8.6"
  date: 2017-10-29
  added: 2026-05-02
  image: dc-066.jpg

- id: dc-065
  title: "荒野间谍"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/df15818c148e"
  description: "BBC 的「动物卧底」系列在 2017 年推出的这部新作，延续了那套思路：做一批外形逼真的假动物（所谓的「间谍」），把摄像机藏进去，混进野生动物群之中贴近拍摄。这一季的机器河马、猴子、树懒做得更是精细，连表情都会动，也因此拍到了不少此前难以记录的互动画面。幕后的制作过程也占了不小篇幅。适合喜欢自然纪录片、顺带想知道这些画面究竟怎么拍出来的观众，带孩子看也很合适。假动物的面部表情精细到让人分不清真假。｜TMDB 7.0"
  date: 2017-01-12
  added: 2026-05-02
  image: dc-065.jpg

- id: dc-064
  title: "英雄列传"
  category: 纪录片
  tags: ["纪录片", "纪录", "剧情"]
  quark_url: "https://pan.quark.cn/s/9c8475a8dbe3"
  description: "《勇士》全系列共分六集，每集将透过历史上一起重大事件，揭开青史留名的著名将领的复杂性格，其中包括领导英明却优柔寡断的斯巴达克斯，集天才与精神变态于一身的匈奴王阿提拉，引爆内战动摇阿兹特克帝国的西班牙探险家赫曼·考梯斯，除此之外，也将重现历史上的知名战役，包括史上最大型的武士战争，十六万名士兵为了日本的前途而战；还有狮心理查率领各地基督徒组成的军队，从海上突袭雅法港，痛击库德战士萨拉丁。 这些英勇善战、充满魅力的人物各自在历史上赢得了一席之地，这是因为他们不惜为信仰而死--无论是为了上帝或黄金、追求权力或自由，或是追寻崇高的理想。这些人有军事将领、政治权谋家、残酷暴君、侠义骑士，也有艰困年代的生…｜TMDB 7.0"
  date: 2007-11-11
  added: 2026-05-02
  image: dc-064.jpg

- id: dc-063
  title: "苏格兰海战"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/4dc1fe962901"
  description: "这部片子讲的是第一次世界大战里规模最大的那场海战——日德兰海战，也是英德两国舰队唯一一次正面碰面。英国的战略是封锁德国贸易线，于是把大舰队挪到苏格兰，北海的控制权就此成为焦点；德国若不打破封锁就得认输，这一仗躲不掉。片子把作战经过讲得很清楚，尤其点出当时还依赖落后的旗语沟通，导致关键时刻指挥相当混乱。适合想弄懂一战海战、又不想啃专业著作的观众。海图和战术板都讲得清楚，不需要任何军事背景。｜TMDB 10.0"
  date: 2015-04-07
  added: 2026-05-02
  image: dc-063.jpg

- id: dc-062
  title: "脑力大挑战"
  category: 纪录片
  tags: ["纪录片", "纪录", "喜剧", "真人秀"]
  quark_url: "https://pan.quark.cn/s/72aa60bba078"
  description: "准备好让你的脑子打架——这部系列用互动实验、错觉和一点点花招，展示大脑是怎么给你制造出一整套「无缝现实」的幻觉：填不上的记忆、靠不住的感官、自以为集中实则漏掉大片的注意力。每个实验都很简单，看完反倒有点不安。风格偏轻松，带点综艺味和喜剧感。适合对心理学有兴趣的普通观众；如果你确信自己记的每件事都准确无误，这片大概会让你改主意。看完之后再看「眼见为实」这句话，会多留几分保留。多数实验看完可以自己在家试着做一遍。｜TMDB 7.6"
  date: 2011-10-09
  added: 2026-05-02
  image: dc-062.jpg

- id: dc-061
  title: "老虎失落之地"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/d16ff0ad6562"
  description: "一个原本以为已经灭绝的老虎种群，在不丹的喜马拉雅山区重新出现并成功繁衍——这条消息由 BBC 自然史摄制组拍到的画面证实。让专家们意外的是，这些虎出现在此前从未被记录过的海拔高度上，适应能力比人们以为的更强。片子由此延伸到保护议题：如果在这片区域的周边建立保护区，有望把亚洲现存的零散虎群连成一片，从而阻止这种世界最大猫科动物走向灭绝。适合关心野生虎与自然影像的观众。海拔这一点最让研究者意外，值得留意画面对比。｜TMDB 8.3"
  date: 2010-09-21
  added: 2026-05-02
  image: dc-061.jpg

- id: dc-060
  title: "翩翩蝴蝶：英国式迷恋"
  category: 纪录片
  tags: ["纪录片", "纪录", "翩翩蝴蝶.英国式迷恋"]
  quark_url: "https://pan.quark.cn/s/ff01d11342b7"
  description: "英国人对蝴蝶的痴迷是出了名的，这部片子就从这份执着讲起：维多利亚时代那些拎着捕虫网到处跑的采集者、学校和乡村里的蝴蝶舞、如今依旧认真的业余爱好者。它同时把不那么浪漫的一面也摆出来——全球变暖给某些物种带来的机会、密集农业造成的坏消息，以及看护林地的人和一个自己养虫放生的人的日常。适合喜欢自然题材、对英国文化有兴趣的观众，看完会想再去野外认一认身边的蝶。片中那位自己养虫放生的普通人，那段让人印象很深。"
  date: 2010-12-17
  added: 2026-05-02
  image: dc-060.jpg

- id: dc-059
  title: "纳粹国防军"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/33639689d068"
  description: "德国国防军究竟是一群执行命令的人，还是一群手上沾血的暴徒？这个争论持续了几十年。BBC 这部五集纪录片找到了一个新入口：英国情报部门公开了一批窃听记录——关押在特伦特公园山庄的德军高级将领以为没人听见，在闲聊里说出了真话。把这些对话与战场记录对照，将军们在战争的不同阶段究竟怎么想，就有了相当可靠的材料。适合二战史爱好者，尤其适合想跳出教科书结论、直接看一手证据的观众。窃听记录里那些原话读起来格外刺骨。｜TMDB 8.0"
  date: 2007-11-13
  added: 2026-05-02
  image: dc-059.jpg

- id: dc-058
  title: "植物之歌"
  category: 纪录片
  tags: ["纪录片", "纪录", "种出个地球"]
  quark_url: "https://pan.quark.cn/s/fa1728ae44d3"
  description: "我们习惯把人类看成地球上最强大的生物，但真正推动历史的是植物：所有动物都靠植物为生，它们让两栖动物摆脱了水源的束缚，见证过恐龙的兴衰，也依次把昆虫、哺乳动物、鸟类乃至人类推上台前。这部系列用一个全新的视角重讲地球史，从植物的起源讲到它们的各种生命策略。适合喜欢宏大叙事、愿意换掉「以动物为中心」视角的观众；看完再去看路边的草木，感觉会不太一样。这种视角转换看过多年之后再想，依然很难忘。｜TMDB 8.3"
  date: 2012-02-07
  added: 2026-05-02
  image: dc-058.jpg

- id: dc-057
  title: "神秘的玛雅"
  category: 纪录片
  tags: ["纪录片", "纪录", "历史"]
  quark_url: "https://pan.quark.cn/s/0816352118c3"
  description: "这是一部拍摄给 IMAX 银幕的片子：一个住在玛雅废墟附近的小男孩，认识了一位考古学家，缠着她讲自己的祖先到底过着什么样的生活。摄制组顺着这条线走访了墨西哥和危地马拉的十几处遗址，包括图卢姆和奇琴伊察这样的大名字。巨幕的价值在这里体现得很充分——那些被丛林吞掉的石阶和金字塔，在银幕上几乎是压到人眼前。适合对玛雅文明与中美洲考古感兴趣的观众，也适合带孩子做一次入门。巨幕的优势在丛林遗址那几段最明显。｜TMDB 4.8"
  date: 1995-01-01
  added: 2026-05-02
  image: dc-057.jpg

- id: dc-056
  title: "大自然：爱登保罗爷爷带你看绝妙的蛙"
  category: 纪录片
  tags: ["纪录片", "纪录", "神奇的青蛙"]
  quark_url: "https://pan.quark.cn/s/68199857edd7"
  description: "现存的蛙类和蟾蜍超过五千种，形状、颜色和体型差别之大常常让人意外。爱登堡爵士在这部片里配合当时最新的超高清摄影设备，用特殊的角度和拍摄手法把这些小动物拍得很近：蜕皮、抱对、产卵、照顾幼体的细节全都看得清清楚楚。看点是货真价实的影像本身，以及这位老先生一如既往的讲解节奏。适合两栖动物爱好者、自然纪录片观众，也适合带孩子一起认识这些常被忽略的小东西。讲解节奏一如既往地稳，不催也不赶。｜TMDB 8.3"
  date: 2014-06-25
  added: 2026-05-02
  image: dc-056.jpg

- id: dc-055
  title: "生命循环：奇异的腐烂科学"
  category: 纪录片
  tags: ["纪录片", "纪录", "生命循环 奇异的腐烂科学"]
  quark_url: "https://pan.quark.cn/s/6dbda8c3fb78"
  description: "人们熟悉的说法是生命始于出生、终于死亡，但这部片子想讲的是另一套：生命不是一个点而是一个环，没有起点也没有终点，只有循环。腐烂从来不是生命的反面——没有分解就没有新生，正是那些形形色色的分解者在维持着整个系统的运转。它把通常让人反感的腐败过程认认真真拍给你看，看完会改观。适合好奇心重、肠胃也比较结实的观众，是那种看完会重新审视「脏」这个概念的片子。拍摄过程相当费工夫，幕后的投入值得一提。｜TMDB 5.2"
  date: 2011-12-06
  added: 2026-05-02
  image: dc-055.jpg

- id: dc-054
  title: "生命博物馆"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/0106211cf269"
  description: "主持人吉米·多尔蒂走进英国自然历史博物馆的幕后，带观众看这个庞大机构究竟怎么运转：为什么要保存七千万件之多的标本？如果只是堆在仓库里，这些藏品还有什么用？片子和馆里的研究人员近距离聊，把他们的工作与当下的现实连起来——保护生物多样性、预防热带传染病、追踪物种的长期变化，全都依赖这些看似尘封的抽屉。适合对博物馆、标本馆和科研幕后好奇的观众，看完下次去博物馆的感受会不一样。七千万这个数字看一遍就很难忘掉。｜TMDB 0.0"
  date: 2010-03-18
  added: 2026-05-02
  image: dc-054.jpg

- id: dc-053
  title: "寄生兽：生命的准则"
  category: 纪录片
  tags: ["纪录片", "动画", "剧情", "动作冒险", "生命"]
  quark_url: "https://pan.quark.cn/s/e49f763cdd0c"
  description: "由于残忍的分尸杀人事件频发，世界各地人民陷入一片惶恐不安之中，然而元凶却是人类未曾意料到的“寄生兽”。这些寄生生物的幼虫侵入人类或动物身体后，以寄生脑部为目标，寄生完成后与脑部细胞同化，管理这个“死掉的身体”。它们能任意变形，能够迅速吸收掌握人类知识，而它们的食物便是寄生体相同的物种。 普通高中生泉新一（岛崎信长 配音）某天被一只奇怪的虫子侵入身体并吞噬了右手，自此他不得不与寄生生物“右”共存。本性正直善良的泉新一不敢将这一变故告诉家人和朋友，然而他喜欢的人村野里美（花泽香菜 配音）似乎留意到他身体的变化。为了被寄生生物杀死的亲友以及所有人类的未来，泉新一决心与其他完全体寄生兽进行殊死搏斗。｜TMDB 8.3"
  date: 2014-10-09
  added: 2026-05-02
  image: dc-053.jpg

- id: dc-052
  title: "弗朗西斯科玩转意大利"
  category: 纪录片
  tags: ["纪录片", "纪录", "玩转意大利"]
  quark_url: "https://pan.quark.cn/s/fff962418333"
  description: "弗朗西斯科玩转意大利是英国BBC电视2台2006年6月到7月连续播出的系列旅游节目，播出后得到广泛的欢迎，BBC2在2007年5月再次重播。本节目中，弗朗西斯科先生驾驶他的Alfa Romeo Duetto Spider敞蓬车来了个意大利全境浪漫之旅途，从北到南玩转了整个意大利，他寻觅古老的建筑，探询古老的地中海文化，品位着意大利境内形形色色的人文风俗。该片是走进意大利的文化旅游类佳片。｜TMDB 6.5"
  date: 2006-06-11
  added: 2026-05-02
  image: dc-052.jpg

- id: dc-051
  title: "都铎王朝"
  category: 纪录片
  tags: ["纪录片", "剧情", "爱情", "王朝"]
  quark_url: "https://pan.quark.cn/s/79ecc41078d3"
  description: "16世纪中叶，英国驻法国大使遭到暗杀，而且死者正是年轻的英国国王亨利八世的叔叔。这让国王极为愤怒，立刻召集大臣，准备兵发法兰西。不过，红衣主教沃尔金权衡各方利益，并不赞成英法交战。因此，他想方设法，让英王、法王通过协商解决了此事。由于王后凯瑟琳只为亨利八世生下了一个女儿，这让她逐渐失宠。亨利八世一直对此耿耿于怀，并在宫廷之内寻欢作乐。不过，真正令亨利八世动心的却是一名叫安·博林的女侍官，后者美艳动人，丰满妖娆，使得他几近疯狂。为了能够明媒正娶，亨利八世跟主教沃尔金密谋，要与王后离婚，此举顿时牵涉到外交、宗教等多方利益。期间，热死病蔓延，引起全国恐慌，一场宫廷震荡也随之而来……｜TMDB 7.8"
  date: 2007-04-01
  added: 2026-05-02
  image: dc-051.jpg

- id: dc-050
  title: "狂野天气探秘"
  category: 纪录片
  tags: ["纪录片", "纪录", "真人秀", "Wild Weather with Richard Hammond"]
  quark_url: "https://pan.quark.cn/s/2b71d2b41b15"
  description: "《最高档》的主持人之一理查德·哈蒙德在这部片里四处跑，专门去找那些最反常的天气现象：掀起龙卷风的雷暴、能把汽车掀翻的阵风、毫无征兆就把整条街淹掉的暴雨。他的办法是一路跑现场，用假人、模型和小实验把「为什么会这样」演示出来，语言通俗，不需要任何气象学底子。整体风格热闹、偏爱大场面。适合带着孩子一起看的家庭观众，或者单纯对极端天气好奇的人；期待严肃科学纪录片的会嫌它综艺味太重。每集只挑一个天气现象讲，篇幅很短。｜TMDB 7.3"
  date: 2014-12-01
  added: 2026-05-02
  image: dc-050.jpg
- id: dc-049
  title: "灌丛下的生命"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/7c641d5f5187"
  description: "这个节目是英国有名的自然节目主持人大卫·爱登堡爵士刚完成的新系列：灌丛下的生命，专门介绍地球上的无脊椎动物的。欢迎来到怪异、凶猛但出奇美丽的无脊椎昆虫世界！与大卫艾登堡禄爵士一起进行开创性的探索，瞭解一个壮观、不受重视但却充斥人类周遭的迷你宇宙。这裡不只有昆虫与甲虫，还有奇特的蝉、会发出萤光的蠕虫、吐丝技巧复杂的蜘蛛，以及专吃蝙蝠的蜈蚣，更别说是其他各种奇妙的生物与私密惊人的行为。多亏了照明、光学与电脑化机械操控的科技革新，我们终於能以这些奇妙生物的观点出发，瞭解这个热闹的超级有机体世界。这些生物或许渺小，但牠们的生活机制却惊人地庞大！｜TMDB 8.3"
  date: 2005-11-23
  added: 2026-05-02
  image: dc-049.jpg

- id: dc-048
  title: "寂静之战"
  category: 纪录片
  tags: ["纪录片", "纪录", "潜艇舱内的战争与生活"]
  quark_url: "https://pan.quark.cn/s/a6afd12e4c1b"
  description: "这部纪录片讲的是冷战时期水面之下的那场战争：美国、英国与苏联的潜艇在大洋深处互相搜寻、跟踪，偶尔也真的撞在一起，胜负却从不对外公开。片子把两条线拧在一起讲——一边是技术层面的猫鼠游戏，声呐、静音技术与情报比拼；一边是潜艇兵的真实处境，在密闭的铁管里待上几个月，噪音、气味、无所事事与随时可能到来的危险并存。不少细节来自当事人的回忆。适合对军事史、尤其冷战海战和潜艇题材感兴趣的观众；冲着作战大场面来的话，它的重点其实在「等」这件事上。｜TMDB 6.0"
  date: 2013-12-05
  added: 2026-05-02
  image: dc-048.jpg

- id: dc-047
  title: "深蓝"
  category: 纪录片
  tags: ["纪录片", "动作冒险", "剧情"]
  quark_url: "https://pan.quark.cn/s/f0cdd1f71c66"
  description: "《深蓝》是 BBC 自然历史组在电视系列《蓝色星球》之后推出的海洋纪录电影，由 Alastair Fotherfill 与 Andy Byatt 联合执导。摄制组下潜到水下五千米，在全球两百多个海域取景：抹香鲸的洄游、鲨鱼捕食、虎鲸逐浪、北极熊涉冰，最后把七千小时素材剪成约九十分钟的银幕版本，配乐里混进了真实的海洋声响。它不是素材汇编式的科教片，而是为影院大银幕拍的观赏作品，画面与配乐的完成度至今仍是同类纪录片的标杆，也适合作为孩子第一部自然纪录片。｜TMDB 6.9"
  date: 2009-07-15
  added: 2026-05-02
  image: dc-047.jpg

- id: dc-046
  title: "追踪海洋巨兽"
  category: 纪录片
  tags: ["纪录片", "纪录", "海洋巨兽"]
  quark_url: "https://pan.quark.cn/s/b4641a1643d2"
  description: "抹香鲸的智慧、黄鳍金枪鱼的速度、座头鲸的诡异叫声、罕见的「蝠鲼龙卷风」——面对海洋，人类的认知其实相当有限。海洋探险家帕特里克·戴克斯特拉专挑地球上人迹罕至的角落跑，去追踪那些被称为怪兽的生物和流传已久的传说。每一集跟着他深入气候恶劣的海域，一边看让人屏息的画面，一边厘清传说背后到底有没有真东西。适合喜欢海洋题材与探险纪录片的观众，对传奇生物有好奇心的人尤其合适。拍摄地点的偏远程度本身就是值得一看的部分。｜TMDB 0.0"
  date: 2020-11-12
  added: 2026-05-02
  image: dc-046.jpg

- id: dc-045
  title: "法国花园"
  category: 纪录片
  tags: ["纪录片", "纪录", "法国花园之旅"]
  quark_url: "https://pan.quark.cn/s/078067d74ca0"
  description: "从讲究对称与传统的古典花园，到各地每家每户那方既好吃又好看的菜园，再到出自大艺术家之手的现代园林——蒙提·唐一路说着流利的法语走访法国各地，看这个国家的人怎么理解「园子」这件事。片子不着急，顺着季节和地域慢慢走，与其说是园艺教程，不如说是通过花园去看法国人的生活方式。适合喜欢园艺、慢旅行和法式生活内容的观众；想在里面学具体种植技巧的话，篇幅有限。主持人一路说法语的样子本身就是看点之一。｜TMDB 7.0"
  date: 2013-02-01
  added: 2026-05-02
  image: dc-045.jpg

- id: dc-044
  title: "沉没城市"
  category: 纪录片
  tags: ["纪录片"]
  quark_url: "https://pan.quark.cn/s/78487dd8faa1"
  description: "这部纪录片对准的是沿海超级城市的防洪工程：威尼斯的水闸、荷兰三角洲的引水槽、日本的海啸堤坝、新泽西州的风暴防御系统——每一处都是人类为不让海水吞掉城市而砸下重金的巨型项目。片子既有工程本身的奇观，看巨大的闸门怎么立起来、水坝如何合龙，也在追问这些钱是否真的买到了安全，以及几十年后怎么办。适合喜欢工程类纪录片、关心气候变化与海平面上升话题的观众。每处工程的造价都相当惊人，留意数字的位数就明白了。几个大型方案横向对比着看，差别很有意思。"
  added: 2026-05-02
  image: dc-044.jpg

- id: dc-043
  title: "森林田野和天空：师法自然的艺术"
  category: 纪录片
  tags: ["纪录片", "纪录", "森林田野和天空"]
  quark_url: "https://pan.quark.cn/s/f7899a670c70"
  description: "艺术史学家 James Fox 走访英国六处景观，提出一个有意思的问题：英国的艺术为什么长成这个样子。他的答案埋在脚下的土地里——沼地、白垩丘陵、潮汐河口塑造了画家观看世界的方式。片子把康斯特勃、透纳、赫普沃思这些名字放回他们站过的山坡和田野里讲，画面本身就是一趟旅行。适合准备去英国旅行、或者想入门英国艺术史的观众；期待逐幅解析作品的会失望，它讲的是人和土地的关系。出镜的六处风景本身就值得安排一趟旅程。｜TMDB 7.0"
  date: 2016-05-03
  added: 2026-05-02
  image: dc-043.jpg

- id: dc-042
  title: "不成功毋宁死：郎朗的故事"
  category: 纪录片
  tags: ["纪录片", "音乐", "纪录", "电视电影", "朗朗的钢琴奋斗之路"]
  quark_url: "https://pan.quark.cn/s/c24c0cfa2226"
  description: "这部 BBC 纪录片属于 Imagine 系列，试图回答一个问题：郎朗是怎么变成郎朗的。片子从童年讲起——父亲近乎孤注一掷的投入、从沈阳到北京的苦练、以及那种把「必须成功」当成唯一选项的家庭气氛，再回头看这套方式到底付出了什么代价；镜头同时也跟着他今天的巡演生活跑，前后的对比相当鲜明。适合琴童家长与古典乐爱好者；如果只想安安静静听演奏，这部讲的其实是成名背后的那一部分。受访的父母那一段说得相当坦率。"
  date: 2012-11-12
  added: 2026-05-02
  image: dc-042.jpg

- id: dc-041
  title: "新西兰：神话之岛"
  category: 纪录片
  tags: ["纪录片", "纪录", "新西兰.神话之岛"]
  quark_url: "https://pan.quark.cn/s/17a33c2813ac"
  description: "新西兰自恐龙时代起就和世界其他地方隔开，八千万年里，这里的野生动物只能在自己的路子上演化，结果相当出人意料：缺少哺乳动物的环境里，鸟类演化出一整套属于它们的身形与角色，连习惯了飞行的蝙蝠都学会了在地面上爬行。这部由演员山姆·尼尔讲述的三集系列，带着观众走遍这片充满异国色彩的岛链，看这些动物如何在没有天敌的世界里活下来。适合喜欢岛屿生态与演化题材的观众，画面本身也值得一看。解说的语气松弛，听起来相当舒服。｜TMDB 8.9"
  date: 2016-07-19
  added: 2026-05-02
  image: dc-041.jpg

- id: dc-040
  title: "探究班诺克本之战"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/7d32db8030b8"
  description: "1314 年的班诺克本战役是苏格兰与英格兰之间最著名的一场冲突，罗伯特·布鲁斯率领的苏格兰军队取胜，局面就此改写。七百年后，尼尔·奥利弗与考古学者托尼·波拉德回到那片战场，试图把传说和史实分开：当年兵力究竟多大、战场具体在哪一侧、那些被反复传颂的细节又有几分真。他们挖探沟、测金属残件、比对文献，也毫不客气地指出哪些记述经不起推敲。适合喜欢中世纪史、苏格兰题材，享受这种「挖出来的证据 vs 写出来的故事」对照过程的观众。"
  date: 2014-06-02
  added: 2026-05-02
  image: dc-040.jpg

- id: dc-039
  title: "猎捕行动"
