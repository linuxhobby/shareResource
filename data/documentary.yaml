  quark_url: "https://pan.quark.cn/s/5f24f346b255"
  description: "这是一部面向孩子的动画喜剧，主角崔希把聪明全用在偷懒上：为了不用自己写作业和做家务，她先造了一台机器人代劳；为了让好朋友歇墨斯建立自信、顺利当上班长，又发明了机器人助教。每一集基本围绕一个新发明展开，笑料热闹，底下讲的则是「耍小聪明往往把事情搞得更复杂」这个道理。适合给学龄孩子看的家庭动画，篇幅短、节奏快，家长陪看也不费劲。篇幅短，陪孩子看也不会占去太多时间。每一台新机器人都自带笑点，造型一个比一个滑稽。｜TMDB 8.2"
