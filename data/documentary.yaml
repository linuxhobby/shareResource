  quark_url: "https://pan.quark.cn/s/183f0514e588"
  description: "主持人丹·克鲁克山克周游世界，遍访各式建筑，展示这些建筑是如何体现我们人类的意愿、天赋和信念。在每期节目中，世界各地的建筑物被戏剧性的罗列在一起，观众将发现，尽管建筑风格迥异，它们之间竟有着意想不到的联系。从俄罗斯西北边陲的基日岛的木结构教堂，到埃及西奈的圣凯瑟琳修道院，本系列是一段汇聚了众多不朽建筑、具有里程碑意义的旅程。《漫游世界建筑群》不仅能丰富观众的建筑学知识，更为观众讲述了世界建筑的动人故事。｜TMDB 6.0"
  date: 2008-04-02
  added: 2026-05-02
  image: dc-013.jpg

- id: dc-012
  title: "冰河巨兽"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/13518d673ac9"
  description: "两百五十万年前，地球上的生灵迎来了新时代-冰河时期。如今我们能通过化石去亲眼见证这些在冰河世纪漫步地球的生物。在这座失落的伊甸园里，有着高过任何大象的猛犸象，齿长将近十八公分的猫科动物，还有某些迄今出现过最奇特的野兽。利用最新的科学技术，我们得以揭露它们的生存和灭亡。 爱丽斯·罗伯茨教授带领大家走上去往4万年以前的冰河时期并探索生活在那时的巨型野兽之旅。通过最新的科学探查工作以及丰富的图像资料，爱丽斯教授把那些冰河巨兽再次活生生地呈现在大家面前。｜TMDB 7.3"
  date: 2013-05-19
  added: 2026-05-02
  image: dc-012.jpg

