- id: dc-019
  title: "地球上最热的地方"
  category: 纪录片
  tags: ["纪录片", "纪录", "地球热极"]
  quark_url: "https://pan.quark.cn/s/0ff7d4f861ca"
  description: "在非洲东非大裂谷的北端，有一块地球上独一无二的地方：那就是埃塞俄比(Ethiopia)的达纳基尔(Danakil)沙漠。或许那里是已知的最不适宜人类居住的地方了，火山和地震的轮番袭击，喷出火山岩浆和有害气体，持续撕裂着地表。这是被证实承认的地球上最热的地方，任何人都能在这居住的想法有够荒唐？！但是还真有人在这生活着，已经居住了千年。一个传说中的勇猛游牧部落 叫做阿法尔(Afar)的部落！一支科学家团队进行这段难以置信的旅程，希望能够发现人在这种极端环境下的生存之道，他们的生活，甚至是他们的生理，是如何被周围的环境塑造的？我们想探索这块神奇土地的地表之下是什么？想要解开她的秘密。｜TMDB 10.0"
  date: 2009-01-01
  added: 2026-05-02
  image: dc-019.jpg

- id: dc-018
  title: "弗朗西斯科的地中海之旅"
