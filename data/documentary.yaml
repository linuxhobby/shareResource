  description: "在这个新系列中，安德鲁·格雷厄姆-迪克森回到欧洲，带领我们踏上了一场充满魅力的低地国家艺术之旅。这个由荷兰和比利时组成的一小片地区孕育了一些最负盛名的艺术家：范·艾克、博世、伦勃朗、鲁本斯、维梅尔、梵高、蒙德里安和马格里特。 在乘船和自行车旅行的过程中，安德鲁揭示了低地国家在西方文化发展的关键时刻中有多么重要——从中世纪晚期的油画诞生，到荷兰黄金时代的胜利，再到超现实主义和抽象主义这些极端现代艺术运动的兴起。 这不仅仅是一个国家的故事，而是关于不断变化的流动边界和在一个政治上一直备受争议的地区寻找身份认同的故事。｜TMDB 0.0"
