- id: dc-035
  title: "恐龙星球"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/ed77e398e5a8"
  description: "带你走遍世界各地，回到几千万年以前，《恐龙行星》运用独一无二的高科技绘图技术，让有史以来最酷最奇妙的生物复活。过去十年几乎发现了所有恐龙外形特色，导致有关史前时期的书籍需要进行改写。古生物学家现下知道恐龙遍布地球每个地方，进化的模式相当古怪，可怕和奇特，霸王龙跟他们比起来看着相当驯服。《恐龙行星》是一次完全仿真的视觉体验，充满着奇妙的真相和迷人怪兽们的惊人活动。本系列呈现了一种对史前纪元的全新全球视角，透过分析它们的骨头以重新塑造这种生物，居所和生活模式，知晓它们如何战斗到最后一刻。｜TMDB 7.9"
  date: 2011-09-14
  added: 2026-05-02
  image: dc-035.jpg

- id: dc-034
  title: "徒步尼罗河"
