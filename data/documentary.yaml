  quark_url: "https://pan.quark.cn/s/9df81c4924c2"
  description: "由世界著名指挥家安东尼奥·帕帕诺带路，这部纪录片讲的是意大利歌剧这门艺术是怎么长出来的：它的历史脉络、各时期的风格差别、站到台前的那些作曲家与歌手，以及戏院后台那套不为观众所知的规矩。片子刻意把音乐放回意大利的日常生活里去讲——方言、地方剧院、教堂和节日，看过之后不仅能认得出几段著名咏叹调，也能明白这个国家为什么会把歌剧当成自家的东西。适合刚开始接触歌剧、想找个清晰入口的观众。穿插的现场演唱挑得恰到好处。"
  date: 2010-05-24
  added: 2026-05-02
