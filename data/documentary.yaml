  quark_url: "https://pan.quark.cn/s/c58d7f9584d9"
  description: "《南美遗失的帝国》由考古学者 Jago Cooper 主讲，他走访南美洲，想弄清那些已经消逝的古代文明究竟留下了什么：安第斯的城邦、亚马逊边缘的聚落、海岸线上的祭祀遗址，以及它们为什么会在相近的时间段里衰落。影片的价值在于把考古过程本身摆给你看——怎么读地层、怎样判断一处堆积是人工作用还是自然形成、结论又如何被新的证据推翻。它和猎奇式的「失落文明」节目不同，更接近一份讲清推理过程的研究记录，适合对考古和前哥伦布时期美洲历史感兴趣的观众。｜TMDB 9.0"
  date: 2013-01-14
  added: 2026-05-02
  image: dc-016.jpg

