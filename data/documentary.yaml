  quark_url: "https://pan.quark.cn/s/7db3b24e5fbe"
  description: "大堡礁(英文：The Great Barrier Reef)，是世界最大最长的珊瑚礁群，位于南半球，它纵贯于澳洲的东北沿海，北从托雷斯海峡，南到南回归线以南，绵延伸展共有2011公里，最宽处161公里。有2900个大小珊瑚礁岛，自然景观非常特殊。 大堡礁的南端离海岸最远有241公里，北端较靠近，最近处离海岸仅16公里。在落潮时，部分的珊瑚礁露出水面形成珊瑚岛。 在礁群与海岸之间是一条极方便的交通海路。风平浪静时，游船在此间通过，船下连绵不断的多彩、多形的珊瑚景色，就成为吸引世界各地游客来猎奇观赏的最佳海底奇观。 1981年列入世界自然遗产名录。在60年后，爱登堡爵爷再次到访，利用最新科技的深水…｜TMDB 7.4"
  date: 2015-12-30
  added: 2026-05-02
