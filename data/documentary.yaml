  description: "加拉帕格斯群岛（又名科隆群岛）隶属厄瓜多尔，以其保持原始风貌的独特生物物种而闻名于世，素有“生物进化活博物馆”之称，1979年被列入世界遗产名录。 群岛总面积7882平方公里，由长达130公里的第一大岛伊莎贝拉岛、四个稍小一点的岛、以及总面积1平方公里多的14个小岛组成，才外还有许多岩礁和小礁。群岛最高处是伊莎贝拉岛上的沃尔夫火山，海拔1707米。 加拉帕格斯群岛是由四五百万年前巨大的海底火山喷发形成的，在一百多万年前浮出海面。直到现在，岛上的火山喷发还时有发生，群岛最西边的伊莎贝拉岛和费尔南迪岛上的火山一直没有消停，最近的两次喷发是在1995年和1998年。这里的火山不高，但面积很大，一座海…｜TMDB 7.5"
