  tags: ["纪录片", "纪录", "夜色中的地球"]
  quark_url: "https://pan.quark.cn/s/8369360738e5"
  description: "这一系列由汤姆·希德勒斯顿担任旁白，摄制组跨越六大洲，用专门为此研发的夜视摄影设备拍摄动物在夜里的真实生活。它最不一样的地方在于画面是全彩的——以往这类题材只能呈现一片模糊的黑白，现在能看清夜色里的羽毛、鳞片和皮毛细节，不少行为因此第一次被记录下来。解说偏温和，节奏舒缓，每集跟着几种动物各走一晚。适合喜欢《地球脉动》那种自然纪录片、想看点从未见过画面的观众。旁白的嗓音本身就特别适合这种夜色里的题材。｜TMDB 8.2"
  date: 2020-12-04
  added: 2026-05-02
  image: dc-024.jpg

- id: dc-023
  title: "伟大的苏格兰人：那些塑造了一个民族的作家"
  category: 纪录片
  tags: ["纪录片", "纪录", "塑造苏格兰的作家"]
  quark_url: "https://pan.quark.cn/s/ca58bf803ba7"
  description: "2014年9月苏格兰举行独立公投，这导致了苏格兰人的自我反省以及关于苏格兰人和英国人分别意味着什么的普遍争论。那么，我们是怎么到达今天这一步的呢？安德鲁·马尔认为，如果你真的想知道这场关于苏格兰在英国的地位之争的关键，你必须了解几位来自北部边界的伟大作家：詹姆斯·博斯韦尔、沃尔特·斯科特爵士和。这些作家跨越了三个动荡的世纪，塑造了世界对苏格兰的看法——这些看法有好有坏——安德鲁也得以了解这些塑造了苏格兰性格的作家的生活。《伟大的苏格兰人：那些塑造了一个民族的作家》回顾了这些创造性天才，回答了一个关键性问题，那就是：这一次，苏格兰将为自己选择一幅怎样的形象呢？｜TMDB 9.0"
  date: 2014-08-16
  added: 2026-05-02
  image: dc-023.jpg

- id: dc-022
  title: "地球脉动"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/7558f7f6fba8"
  description: "从南极到北极，从赤道到寒带，从非洲草原到热带雨林，再从荒凉峰顶到深邃大海，难以数计的生物以极其绝美的身姿呈现在世人面前。我们看到了Okavango洪水的涨落及其周边赖以生存的动物们的生存状态，看到了罕见的雪豹在漫天大雪中猎食的珍贵画面；看到了冰原上企鹅、北极熊、海豹等生物相互依存的严苛情景，也见识了生活在大洋深处火山口高温环境下的惊奇生物。当然还有地球各地的壮观美景与奇特地貌，无私地将其最为光艳的一面展现出来。｜TMDB 8.6"
  date: 2006-03-05
  added: 2026-05-02
  image: dc-022.jpg

- id: dc-021
  title: "地球的夜晚"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/72f77ff0031b"
  description: "太阳一落山，另一个地球才真正开始运转。这部纪录片用专门为此开发的低照度摄影设备，拍下夜晚里那些从来没被认真记录过的画面：深色中的捕猎、求偶、迁徙，以及城市灯光之外动物们怎么打发这十几个小时。技术上的进步是它最值得看的地方——以前这类题材只能拍成模糊的黑白，现在能看到全彩的细节，因此有不少行为是头一回被记录下来。适合喜欢自然纪录片、想看点新鲜影像的观众。昆虫夜间活动的那段影像常被拿来举例。｜TMDB 7.4"
  date: 2020-01-29
  added: 2026-05-02
  image: dc-021.jpg

- id: dc-020
  title: "地球生灵"
  category: 纪录片
  tags: ["纪录片", "纪录", "家庭"]
  quark_url: "https://pan.quark.cn/s/d066b71fe98a"
  description: "《地球生灵》（又名《原野中的一生》）由 BBC Earth 与 Magic Light 联合制作，讲的是所有生物都要走完的那趟路：从出生的第一刻，到长大、求偶、争夺、养育，最后把后代送出去。片子挑了一批非常有代表性的动物，用接近故事片的方式把它们的一生剪在一起，因此节奏明显带着剧情起伏——有危险、有失去、也有温情。适合想带孩子认识生命周期的家庭观众，情绪起伏比一般自然纪录片更强，小朋友看得懂，大人也不至于枯燥。｜TMDB 7.5"
  date: 2011-07-19
  added: 2026-05-02
  image: dc-020.jpg

- id: dc-019
  title: "地球上最热的地方"
  category: 纪录片
  tags: ["纪录片", "纪录", "地球热极"]
  quark_url: "https://pan.quark.cn/s/0ff7d4f861ca"
  description: "在非洲东非大裂谷的北端，有一块地球上独一无二的地方：那就是埃塞俄比(Ethiopia)的达纳基尔(Danakil)沙漠。或许那里是已知的最不适宜人类居住的地方了，火山和地震的轮番袭击，喷出火山岩浆和有害气体，持续撕裂着地表。这是被证实承认的地球上最热的地方，任何人都能在这居住的想法有够荒唐？！但是还真有人在这生活着，已经居住了千年。一个传说中的勇猛游牧部落 叫做阿法尔(Afar)的部落！一支科学家团队进行这段难以置信的旅程，希望能够发现人在这种极端环境下的生存之道，他们的生活，甚至是他们的生理，是如何被周围的环境塑造的？我们想探索这块神奇土地的地表之下是什么？想要解开她的秘密。｜TMDB 10.0"
  date: 2009-01-01
  added: 2026-05-02
  image: dc-019.jpg

- id: dc-018
  title: "弗朗西斯科的地中海之旅"
  category: 纪录片
  tags: ["纪录片", "纪录", "地中海深度探访"]
  quark_url: "https://pan.quark.cn/s/7562263f3289"
  description: "《地中海深度行》出身自威尼斯望族达莫斯托家族的弗朗西斯科，将重踏先祖的航海足迹，带领我们从水都威尼斯出发，航向丰饶的地中海，途经浪漫的爱琴海以及文明古国希腊，最后到达东西交汇的伊斯坦布尔。沿途探访南欧壮观的文化遗迹，感受地中海的阳光所散发的热情，尽览大自然与人类文明编织的美妙景观。弗朗西斯科将向你导览多处欧洲、亚洲与非洲的交汇点，让你见识沿地中海土地的历史传奇及独特文化。 1.再见，威尼斯 2.蔚蓝的地中海 3.希望之岛 4.平静恶水 5.浪漫希腊 6.漫游科林斯湾 7.狂野希腊 8.神奇之岛——白色群岛 9.罗马古都——克里特岛 10.多德卡尼斯岛 11.达达尼尔海峡 12 神秘伊斯坦布尔｜TMDB 7.0"
  date: 2008-07-08
  added: 2026-05-02
  image: dc-018.jpg

- id: dc-017
  title: "喜马拉雅壮丽之旅"
  category: 纪录片
  tags: ["纪录片", "纪录", "喜马拉雅之旅"]
  quark_url: "https://pan.quark.cn/s/7fe1cf21486e"
  description: "继BBC撒哈拉沙漠之旅后，英国名喜剧演员Micheal Palin展开了另一次不可思议的喜玛拉雅山之旅，途经印度、尼泊尔、巴基斯坦，甚至中国，路程长达二千里。凭着妙趣横生手法，将各地独特而神秘的风土人情将一一呈现在观众目前。 米高柏林这次的冒险，会到繁忙和活力十足的城市，亦会到美丽的郊区和壮观的山峰、冰河、雪地，还有特别的小村落。由最高一万八千呎的地方，到低地孟加拉国湾，景色尽入眼帘。但最吸引的还是沿途的风土人情。 我们走进亚洲，一个非凡雄伟的地方－喜玛拉雅山。旅程会穿过阿富汗、横过印度到埃佛勒斯峰基地营，再到不丹首都，最后到孟加拉国湾。｜TMDB 8.2"
  date: 2004-10-03
  added: 2026-05-02
  image: dc-017.jpg

- id: dc-016
  title: "南美遗失的帝国"
  category: 纪录片
  tags: ["纪录片", "纪录", "南美失落王国"]
  quark_url: "https://pan.quark.cn/s/c58d7f9584d9"
  description: "《南美遗失的帝国》由考古学者 Jago Cooper 主讲，他走访南美洲，想弄清那些已经消逝的古代文明究竟留下了什么：安第斯的城邦、亚马逊边缘的聚落、海岸线上的祭祀遗址，以及它们为什么会在相近的时间段里衰落。影片的价值在于把考古过程本身摆给你看——怎么读地层、怎样判断一处堆积是人工作用还是自然形成、结论又如何被新的证据推翻。它和猎奇式的「失落文明」节目不同，更接近一份讲清推理过程的研究记录，适合对考古和前哥伦布时期美洲历史感兴趣的观众。｜TMDB 9.0"
  date: 2013-01-14
  added: 2026-05-02
  image: dc-016.jpg

- id: dc-015
  title: "低地国家的高雅艺术"
  category: 纪录片
  tags: ["纪录片", "纪录", "北欧艺术游"]
  quark_url: "https://pan.quark.cn/s/d40b463efe73"
  description: "在这个新系列中，安德鲁·格雷厄姆-迪克森回到欧洲，带领我们踏上了一场充满魅力的低地国家艺术之旅。这个由荷兰和比利时组成的一小片地区孕育了一些最负盛名的艺术家：范·艾克、博世、伦勃朗、鲁本斯、维梅尔、梵高、蒙德里安和马格里特。 在乘船和自行车旅行的过程中，安德鲁揭示了低地国家在西方文化发展的关键时刻中有多么重要——从中世纪晚期的油画诞生，到荷兰黄金时代的胜利，再到超现实主义和抽象主义这些极端现代艺术运动的兴起。 这不仅仅是一个国家的故事，而是关于不断变化的流动边界和在一个政治上一直备受争议的地区寻找身份认同的故事。｜TMDB 0.0"
  date: 2013-04-04
  added: 2026-05-02
  image: dc-015.jpg

- id: dc-014
  title: "加拉帕戈斯群岛"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/f08a149bf386"
  description: "加拉帕格斯群岛（又名科隆群岛）隶属厄瓜多尔，以其保持原始风貌的独特生物物种而闻名于世，素有“生物进化活博物馆”之称，1979年被列入世界遗产名录。 群岛总面积7882平方公里，由长达130公里的第一大岛伊莎贝拉岛、四个稍小一点的岛、以及总面积1平方公里多的14个小岛组成，才外还有许多岩礁和小礁。群岛最高处是伊莎贝拉岛上的沃尔夫火山，海拔1707米。 加拉帕格斯群岛是由四五百万年前巨大的海底火山喷发形成的，在一百多万年前浮出海面。直到现在，岛上的火山喷发还时有发生，群岛最西边的伊莎贝拉岛和费尔南迪岛上的火山一直没有消停，最近的两次喷发是在1995年和1998年。这里的火山不高，但面积很大，一座海…｜TMDB 7.5"
  date: 2006-09-29
  added: 2026-05-02
  image: dc-014.jpg

- id: dc-013
  title: "漫游世界建筑群"
  category: 纪录片
  tags: ["纪录片", "纪录", "划时代建筑"]
  quark_url: "https://pan.quark.cn/s/183f0514e588"
  description: "主持人丹·克鲁克山克周游世界，遍访各式建筑，展示这些建筑是如何体现我们人类的意愿、天赋和信念。在每期节目中，世界各地的建筑物被戏剧性的罗列在一起，观众将发现，尽管建筑风格迥异，它们之间竟有着意想不到的联系。从俄罗斯西北边陲的基日岛的木结构教堂，到埃及西奈的圣凯瑟琳修道院，本系列是一段汇聚了众多不朽建筑、具有里程碑意义的旅程。《漫游世界建筑群》不仅能丰富观众的建筑学知识，更为观众讲述了世界建筑的动人故事。｜TMDB 6.0"
  date: 2008-04-02
  added: 2026-05-02
  image: dc-013.jpg

- id: dc-012
  title: "冰河巨兽"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/13518d673ac9"
  description: "两百五十万年前，地球上的生灵迎来了新时代-冰河时期。如今我们能通过化石去亲眼见证这些在冰河世纪漫步地球的生物。在这座失落的伊甸园里，有着高过任何大象的猛犸象，齿长将近十八公分的猫科动物，还有某些迄今出现过最奇特的野兽。利用最新的科学技术，我们得以揭露它们的生存和灭亡。 爱丽斯·罗伯茨教授带领大家走上去往4万年以前的冰河时期并探索生活在那时的巨型野兽之旅。通过最新的科学探查工作以及丰富的图像资料，爱丽斯教授把那些冰河巨兽再次活生生地呈现在大家面前。｜TMDB 7.3"
  date: 2013-05-19
  added: 2026-05-02
  image: dc-012.jpg

- id: dc-011
  title: "冰冻星球 2"
  category: 纪录片
  tags: ["纪录片", "纪录", "家庭", "冰冻星球"]
  quark_url: "https://pan.quark.cn/s/7a091f5ce006"
  description: "南北两极、白雪覆盖的森林、北方的平原和遥远的山脉——这些地方看上去尚未被人类活动直接触及，因此各自保有一套奇妙而多样的生态系统。摄制组在雪原上跟拍顶级猎手狼群围猎巨大野牛，记录虎鲸代代相传的独门捕猎技巧，也拍到了行踪诡秘的东北虎悄然走过雪地。片子一边展示这些动物的隐秘生活，一边把迫在眉睫的剧变摆上台面。适合自然纪录片爱好者，看过第一部的老观众更会有对照的乐趣。片尾对环境变化的处理相当克制，留白反而更重。｜TMDB 8.4"
  date: 2022-09-11
  added: 2026-05-02
  image: dc-011.jpg

- id: dc-010
  title: "光的故事"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/5880ee142798"
  description: "这部系列穿越两千多年，讲的是人类怎么一点点搞懂「光」这件事：科学实验、哲学争论与技术进步串在一起，每一集挑一个切面——绘画里的光、肤色、上帝、红外线、电力、万花筒、光合作用、量子理论、X 光都被放了进来。它的写法是把物理学讲成一条故事线，不堆公式，靠演示和画面说话。适合对科学史有兴趣、又受不了纯讲理论的观众；每一集相对独立，随手从中间看起也没问题。每集相对独立，从中间开始看也不影响理解。每集只挑一个切面讲，彼此不牵扯。"
  date: 2004-08-17
  added: 2026-05-02
  image: dc-010.jpg

- id: dc-009
  title: "你最想知道的科学"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/0ed69fbd1f61"
  description: "很多事就发生在我们身边，我们却从没停下来问一句为什么。这部系列挑的就是那些被人当成理所当然、其实背后另有道理的日常现象：为什么会有这样的巧合、身体为什么会这样反应、眼前的「常识」可能是脑子骗了你。每一段都用实验和现场演示把原理拆开讲，篇幅短、节奏快，看下来不需要任何理科底子。适合带了好奇心但不想啃专业书的观众，也很适合和孩子一起看，随手挑一集看都能看得下去。每段十几分钟，随手挑一集看也不累。｜TMDB 7.5"
  date: 2011-06-20
  added: 2026-05-02
  image: dc-009.jpg

- id: dc-008
  title: "企鹅之岛"
  category: 纪录片
  tags: ["纪录片", "纪录", "剧情"]
  quark_url: "https://pan.quark.cn/s/a983fd19ee61"
  description: "澳大利亚南部海域上有座又神奇又严酷的小岛，住着世界上体型最小的企鹅——神仙企鹅（小蓝企鹅）。这里是它们最大的一处栖息地，每天傍晚，成百上千只企鹅从海里爬上岸，摇摇晃晃穿过沙滩回到各自的洞里；与此同时，游客也像潮水一样涌来，就为了看这一幕。片子拍的就是这两拨人挤在同一片沙滩上的日常，以及企鹅在这种环境下怎么活下去。适合喜欢动物题材、看不了太沉重内容的观众。企鹅傍晚归巢这一幕每天都在上演。｜TMDB 6.0"
  date: 2010-07-14
  added: 2026-05-02
  image: dc-008.jpg

- id: dc-007
  title: "政府怎样花你的钱"
  category: 纪录片
  tags: ["纪录片", "他们怎样花掉你的钱"]
  quark_url: "https://pan.quark.cn/s/f5e85bfd3a60"
  description: "‎尼克·罗宾逊（Nick Robinson）研究了政府如何收集和使用公共资金。在一个由两部分组成的系列文章的第一部分中，他揭示了政客们无休止的压力，要求他们花更多的钱，以及他们发现要抵制的压力有多大。他观察谁得到了什么 - 以及为什么 - 并展示了浪费金钱是多么容易。‎‎该节目以对威斯敏斯特大野兽的坦率采访以及与英国各地选民的会面为特色，为导致当前金融环境的原因以及政府平衡账簿的棘手程度提供了新的见解。‎｜TMDB 0.0"
  date: 2011-11-23
  added: 2026-05-02
  image: dc-007.jpg

- id: dc-006
  title: "从太空看地球"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/70c8ae331312"
  description: "这是我们共同的家园，却从来没有人真的见过它全貌。绕地飞行的卫星让镜头第一次有机会俯视整个地球：冰川的纹路、洋流、农田的形状、城市夜里的灯光网络，每一帧信息量都极大。它的视角所带来的震撼很直接——很多地貌和人类活动的规模，站在地面上是完全感受不到的。配上音效和解说，观感相当接近大银幕。适合想换一个高度重新认识地球的观众，几乎不需要任何背景知识门槛。解说克制，把大部分空间留给了画面本身。｜TMDB 8.4"
  date: 2019-04-17
  added: 2026-05-02
  image: dc-006.jpg

- id: dc-005
  title: "人类宇宙"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/d3d37150ce45"
  description: "继《太阳系的奇迹》《宇宙的奇迹》《生命的奇迹》之后，布莱恩·考克斯教授带来这部转而看向人类自身的系列：宇宙里最珍贵、最神奇的，其实是我们。他从语言、工具、农业一路讲到望远镜与火箭，不断追问同一个问题——人是怎么一点点看清自己在宇宙中所处位置的。讲解一如既往地平实，画面投入却相当舍得。适合追过考克斯早期作品的观众，以及任何想从头理解「人类是怎么走到今天」的人。各种推演都做得直观，靠画面就能跟下来。｜TMDB 8.1"
  date: 2014-10-07
  added: 2026-05-02
  image: dc-005.jpg

- id: dc-004
  title: "人体奥秘"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/b677ae247c28"
  description: "精心制作的人体奥秘动画，带孩子走进灵敏而丰富的感官世界，感受骨骼的灵活、血液循环的奇妙、消化和呼吸系统的忙碌，全面获取身体知识。以孩子喜爱的探险题材来表现，把身体各个部位比作不同的探险目的地，有很强的吸引力，引导孩子主动探索。保证内容严谨的同时，剔除人体学晦涩难懂的风格，语言生动有趣，确保是孩子能够听懂并理解的。每一节设有健康小讲堂，将认知和行为联系在一起，让孩子从中得到启发，知道要培养怎样的生活习惯，更好的保护自己。｜TMDB 8.0"
  date: 2011-05-05
  added: 2026-05-02
  image: dc-004.jpg

- id: dc-003
  title: "二战坦克王牌"
  category: 纪录片
  tags: ["纪录片", "纪录", "二战英军坦克英雄"]
  quark_url: "https://pan.quark.cn/s/9bb5e32c0a86"
  description: "《二战坦克王牌》把镜头交给英国皇家第五坦克团的六名老兵，由他们亲口讲述自己在第二次世界大战中的经历。影片没有宏大的战略复盘，而是回到个人视角：坦克舱内的狭窄与闷热、遭遇德军装甲时那几秒钟的决策、战友伤亡后的沉默。因为全是当事人出镜口述，细节质感远胜事后重演，那种平静语气底下压着的东西是编年史里读不到的。适合对二战装甲战、诺曼底之后西欧推进感兴趣的观众，尤其适合看完大制作战争片、想听真实声音的人补一课。｜TMDB 10.0"
  date: 2013-01-06
  added: 2026-05-02
  image: dc-003.jpg

- id: dc-002
  title: "七个世界，一个星球"
  category: 纪录片
  tags: ["纪录片", "纪录", "家庭", "七个世界 一个星球"]
  quark_url: "https://pan.quark.cn/s/f7f0d8c33a50"
  description: "数百万年前，不可思议的神奇力量将地壳撕扯得支离破碎，由此创造出七个蔚为壮观的大陆。时光荏苒，每个大陆都孕育了别具特色的野生动物。从郁郁葱葱的南美洲丛林深处到冰雪覆盖的亚洲山峦之巅，从欧洲熙熙攘攘的都市到非洲的广袤平原，《七个世界，一个星球》将开启一次七大洲之旅，呈现匪夷所思的动物行为，讲述鲜为人知的动物故事。我们将探索在这七个世界，丰富多样的生命如何在地球上生长繁衍，同时揭示在人类主导的世界，动物们所面临的不同挑战。｜TMDB 8.5"
  date: 2019-10-27
  added: 2026-05-02
  image: dc-002.jpg

- id: dc-001
  title: "一千零一夜的秘密"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/894225d0658a"
  description: "《一千零一夜的秘密》是一部讲《一千零一夜》从哪来的纪录片。它不打算把那些故事再讲一遍，也不假装能给出所谓深度研究，力气全花在溯源上：印度、波斯、阿拉伯世界的多重来源，民间说书人的口传传统，以及它在欧洲被翻译、改写、再创作之后的面貌。导演的态度相当清醒，承认这题材庞大到不可能在一部片里讲透，于是恰当地点到为止，能把前生今世梳理清楚已经难得。适合对世界文学源流、翻译史或阿拉伯文化感兴趣的观众，看之前不需要任何准备。"
  date: 2010-01-02
  added: 2026-05-02
  image: dc-001.jpg
