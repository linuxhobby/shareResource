  category: 纪录片
  tags: ["纪录片", "纪录", "家庭", "冰冻星球"]
  quark_url: "https://pan.quark.cn/s/7a091f5ce006"
  description: "南北两极、白雪覆盖的森林和北方的平原、遥远的山脉，这些地方有着奇妙而多样化的生态系统，似乎尚未受到人类活动的直接影响。在与世隔绝的地方，神秘的顶级猎手狼群在广阔的雪原上狩猎巨大的野牛，虎鲸将追踪猎物的独门秘籍代代相传，行踪诡秘的东北虎在洁白的雪地上悄然走过。该纪录片记录下了这些神奇动物的隐秘生活，也揭示了迫在眉睫的剧变。｜TMDB 8.4"
  date: 2022-09-11
  added: 2026-05-02
  image: dc-011.jpg

