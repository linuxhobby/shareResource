  quark_url: "https://pan.quark.cn/s/756ec345c362"
  description: "探险家 Levison Wood 干了一件听起来不太可能的事：沿着尼罗河把它走完，前后花了九个月。一路穿过雨林、沙漠、城市，也穿过正处在动荡中的地带，途中遇到形形色色的人和动物，顺手把「当下的非洲到底是什么样」记录下来。它不是那种追求极限节奏的探险片，更多是耐心地走、看、问，也因此能看到许多旅行团绝不会经过的地方。适合喜欢长距离徒步旅行纪录片、对非洲感兴趣的观众。沿途遇上的普通人占了不小的比重。｜TMDB 6.6"
  date: 2015-01-04
  added: 2026-05-02
  image: dc-034.jpg

- id: dc-033
  title: "巴塔哥尼亚：地球秘密乐园"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/93e6b380295c"
  description: "巴塔哥尼亚地区几乎包括阿根廷本土南部的所有土地，面积约673,000平方公里，由广阔的草原和沙漠组成，从南纬37°伸展到南纬51°。其边界大约西抵巴塔哥尼亚安地斯山脉，北滨科罗拉多河，东临大西洋，南濒麦哲伦海峡；海峡南面的火地岛分别隶属于阿根廷和智利，通常也划入巴塔哥尼亚的范围内。 1519年，随麦哲伦环球旅行到达今天里瓦达维亚海军准将城附近的意大利学者安东尼奥·皮加费塔，看到当地土著居民－－巴塔哥恩族人脚着胖大笨重的兽皮鞋子，在海滩上留下巨大的脚印，便把这里命名为巴塔哥尼亚。出身于葡萄牙骑士家庭的麦哲伦，以骑士名字Patagon（Patagon是16世纪时一部著名骑士小说的主角）命名之，而“…｜TMDB 7.2"
  date: 2015-09-25
  added: 2026-05-02
  image: dc-033.jpg

- id: dc-032
  title: "宠物：内心狂野"
  category: 纪录片
  tags: ["纪录片", "纪录", "宠物的天性"]
  quark_url: "https://pan.quark.cn/s/d11fe99d9541"
  description: "以隐藏拍摄的方式展示萌宠调皮行为背后的秘密，探索我们可爱宠物狂野的一面。展示某些动物的撕逼大战。不止有萌萌的喵星人和汪星人，仓鼠为何爱跑轮子、狗狗如何学会群居、猫咪怎样成为孤独的猎手。有跳水的狗、当保姆的猫、身手了得的仓鼠、被猎物戏耍的猫，相思鹦鹉为何说话、猫如何用特殊的爪子在墙上直上直下、仓鼠为什么把吃不下的东西塞一脸、和兔子究竟为啥跳。后面还介绍了秘鲁“放养的宠物狗”、挖洞打洞的宠物兔、日本猫岛上的野猫等等。｜TMDB 8.0"
  date: 2015-01-21
  added: 2026-05-02
  image: dc-032.jpg

- id: dc-031
  title: "完美星球"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/c3ab40f8ef27"
  description: "地球是一颗完美的星球。大小、日地距离、自转公转、倾斜角度以及卫星等地球的方方面面都非常适合人类生存，其澎湃的自然力量完美地孕育了多彩的生命。全球气候系统的水循环将淡水输送到各个角落；洋流搅动了海底最深处的营养物质；阳光为世间万物带来温度和能量；剧烈的火山喷发形成了肥沃的土壤。因此，在我们的星球上，生命无处不在。从印度雨季潮湿的土地到夏威夷火山炽热的山坡；从巴哈马的潮汐岛屿到冰天雪地的埃尔斯米尔岛；从冬夜郊外嚎叫的北极狼群到春季结冰的身体慢慢融化的木蛙，从加拉帕戈斯群岛以吸食海鸟鲜血解渴的吸血地雀，到每年成群结队聚集在火山湖中繁殖的非洲小红鹳。《完美星球》将带领我们踏上一场无与伦比的视觉之旅，我…｜TMDB 8.7"
  date: 2021-01-03
  added: 2026-05-02
  image: dc-031.jpg

- id: dc-030
  title: "宇宙的奇迹"
  category: 纪录片
  tags: ["纪录片", "纪录"]
  quark_url: "https://pan.quark.cn/s/c7c0228a6e15"
  description: "茫茫宇宙，人类从何而来？宇宙又将走向何处？带着万千的疑问，我们跟随Brian Cox教授一起感受地球上罕见的景观，在这些壮丽的景观背后，隐藏着宇宙的秘密……让我们在欣赏美景的同时，深入了解物理学，逐渐揭开宇宙各种奇迹的神秘面纱，明了了人类与宇宙的深邃联系。 阳光帅哥Brian Cox是一位粒子物理学家，曼彻斯特大学高能物理学教授，英国皇家学会会员，也是瑞士欧洲核物理研究组织(CERN)之大型强子对撞器(LHC)的六大实验参与者之一。但他的成名却是由于近年来常常出现在是BBC科普节目中。BBC曾播出他主持的科教节目的Wonders of the Solar System（《太阳系的奇迹》）。｜TMDB 8.1"
  date: 2011-03-06
  added: 2026-05-02
  image: dc-030.jpg

- id: dc-029
  title: "孟买的铁路"
  category: 纪录片
  tags: ["纪录片", "纪录", "孟买铁路"]
  quark_url: "https://pan.quark.cn/s/eee3608f0b93"
  description: "《孟买的铁路》把镜头交给孟买庞大的市郊铁路网——这座城市每天靠通勤列车运送数百万人，是全球最繁忙的通勤系统之一。影片跟着乘客、司乘、站台上的小贩与维修工人，记下他们从清晨到深夜的往复：挤到无法转身的车厢、站台边自成秩序的生活，以及这套殖民时代留下的老化系统如何硬撑着整个城市的运转。它属于英式的社会观察纪录片，节奏克制、画面扎实，比旅游宣传片更像一份写给这座城市的日常报告。关心城市与公共交通题材的人会看得很有味道。｜TMDB 1.0"
  date: 2007-07-18
  added: 2026-05-02
  image: dc-029.jpg

- id: dc-028
  title: "奥斯维辛集中营"
  category: 纪录片
  tags: ["纪录片", "纪录", "犯罪", "悬疑"]
  quark_url: "https://pan.quark.cn/s/0ba35a57fa11"
  description: "BBC的《奥斯维辛集中营》电视剧于2005年拍摄并公映，该纪录片共6集，采用了现代影视技术演示集中营的设施，使其易于观瞻。奥斯威辛集中营是大屠杀的代名词，但它在地图上也是一个在二战前有着令人惊讶历史的地方。奥斯维辛集中营中的囚犯，包括犹太人和非犹太人，都拥有一个序列号，先是在胸前，后是在左臂。据估计，40万个数字被打在奥斯威辛营地的囚犯身上，现只有几千名幸存者。事实上，本片的主角是数字编号本身，随着时间的流逝，从1940年到今天，它已然是一种个人和集体的象征。这部纪录短片由梅丽尔·斯特里普 （Meryl Streep） 讲述，讲述了奥斯威辛集中营从建造到臭名昭著的故事。｜TMDB 0.0"
  date: 2013-11-15
  added: 2026-05-02
  image: dc-028.jpg

