  tags: ["纪录片", "剧情", "犯罪", "捕猎"]
  quark_url: "https://pan.quark.cn/s/c89565f82904"
  description: "一座位置秘密的监狱发生爆炸，关在里面的全国最凶残的连环杀手趁机越狱。被迫回到这场游戏中的是一位已经退出的前侧写师——她必须与一支由士兵、间谍和特工拼起来的队伍合作，在这些人再次动手之前把他们一个个找回来。片子归类在纪录片，实际是剧情化的纪实叙事，节奏紧凑，追捕场面不少。适合喜欢犯罪题材、享受那种一场追一场节奏的观众。主线是一场接一场的追捕，几乎不给喘息的机会。侧写师这条人物线的比重，其实比追捕更大。｜TMDB 7.1"
  date: 2025-01-19
  added: 2026-05-02
  image: dc-039.jpg

- id: dc-038
  title: "挑战珠穆朗玛峰"
  category: 纪录片
  tags: ["纪录片", "纪录", "挺进珠峰"]
  quark_url: "https://pan.quark.cn/s/32504f4a0d37"
  description: "《挑战珠穆朗玛峰》把镜头对准三支各自为战的探险队：一支乘热气球升上珠峰空域，一支用独木舟与徒步结合的方式接近山脚，还有一支坚持无氧攀登。三条路线、三套完全不同的准备与风险，对照出来的却是同一种执念。影片的重点放在筹备与过程——装备、天气窗口、队员之间的决策冲突——而不是单纯的冲顶瞬间，所以看得到这项运动真正艰难的地方。适合喜欢登山、极限运动与探险题材的观众，也是对商业登顶话题有兴趣时可以补的一手资料。"
  date: 2013-12-28
  added: 2026-05-02
  image: dc-038.jpg

- id: dc-037
  title: "打破边界：我们星球的科学"
  category: 纪录片
  tags: ["纪录片", "纪录", "打破边界.我们星球的科学"]
  quark_url: "https://pan.quark.cn/s/69321dcd9257"
  description: "由大卫·艾登堡爵士解说、Silverback Films 制作——这支团队之前拍过《我们的星球》系列，这部片子要解释的正是那些节目画面背后的科学原理：数据是怎么测出来的、结论怎么推导出来、哪些现象已经逼近临界点。它既是一次科学普及，也是对自己作品的注解。适合看过《我们的星球》、想知道「这些说法从哪来」的观众；对环保议题已有关注的人会觉得它把零散的印象理成了框架。时长不长，一口气看完刚刚好。｜TMDB 7.5"
  date: 2021-06-03
  added: 2026-05-02
  image: dc-037.jpg

- id: dc-036
  title: "意大利歌剧"
