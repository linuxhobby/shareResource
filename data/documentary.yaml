  description: "植物既能与动物互利共生，也可以像任何生物那样充满攻击性、竞争性与戏剧性。为了争夺光照、空间、养分，以及为家族开枝散叶的机会，它们与竞争对手、动物和自然环境进行着看不见硝烟却同样致命的斗争。这部片子汇集了二十多年来的新发现，靠专业摄影设备把人眼原本看不到的过程拍出来，让观众第一次真正从植物的角度看了地球一遍。适合喜欢《地球脉动》那类作品的观众。植物题材里，很少有人把竞争写得这样像一场战争。｜TMDB 8.8"
