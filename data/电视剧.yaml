- id: tv-087
  title: "看不见影子的少年"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "犯罪"]
  quark_url: "https://pan.quark.cn/s/e6aa10891dba"
  description: "【第 1 季 · 共 16 集】上世纪九十年代，一个雷电交加的夜晚，一个叫照阳的小县城里，少年被神秘追杀，生死不明。与他一起失踪的另外两名少年也同样人间蒸发。三年后，其中一个少年突然变身“小扒手”，佯装失忆回归家庭。认亲成功的背后真相是破镜重圆还是将错就错？看似再次团聚的家庭背后竟还隐藏着秘密和杀机？老警察暗中调查，一场猫鼠追逐之后，另外两名失踪少年的下落也出现端倪，多起失踪案拐卖人口案、误杀、谋杀案件的真相逐渐浮出水面。谜底揭开之际，老警察和“失踪少年”也实现了双向救赎，成就这个包裹在悬疑外衣之下的亲情故事。｜TMDB 6.7"
  date: 2024-06-06
  added: 2026-10-05
  image: tv-087.jpg


- id: tv-088
  title: "目之所及"
  category: 电视剧
  tags: ["电视剧", "悬疑"]
  quark_url: "https://pan.quark.cn/s/f57d746d5920"
  description: "【第 1 季 · 共 16 集】世纪之交，因为水利工程的蓄水要求，一座江边小城即将被淹没，人们如火如荼地进行着新城的建设和人口的迁徙。2002年夏的东江市，暴雨如注。一桩离奇的杀人案闯入了警方的视野，死去的情人、消失又复生的丈夫，他们是“凶手”亦是“死者”。终于在警方锲而不舍的追查下，揭秘出一段尘封多年的往事。人性的复杂让许多人蒙蔽了双眼，但真相永远不会被淹没，目之所及皆是阳光。｜TMDB 7.5"
  date: 2025-08-28
  added: 2026-10-05
  image: tv-088.jpg


- id: tv-089
  title: "再见，那一天"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪", "再见，那一天 再见那一天"]
  quark_url: "https://pan.quark.cn/s/2e96f1064deb"
  description: "【第 1 季 · 共 6 集】上世纪90年代，热血不羁的“钢厂大院才子”胡广来，跟刚调来的社区民警老公安全党愿，惺惺相惜情同弟兄。因姐姐胡芳被流氓强暴，胡广来激愤下失手杀死对方被判死缓，彻底绝望。全党愿毅然担负起了胡广来与这个世界的纽带，在他不断地坚持和感化下，胡广来认真改造减刑，重拾了生活的尊严和希望。就在刑期将满前，胡广来惊闻全党愿被一个叫“史瑞克”的人打死的噩耗……去世前，癌症晚期的全党愿，把胡广来托付给了干女儿梅湘。在梅湘帮助下胡广来学会了自食其力。同时胡广来也开始和梅湘一起秉承全党愿的遗志，帮助那些刑满回乡人员，重新开始生活。｜TMDB 0"
  date: 2021-09-21
  added: 2026-10-05
  image: tv-089.jpg


- id: tv-090
  title: "有罪之身"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪"]
  quark_url: "https://pan.quark.cn/s/f227783713c3"
  description: "【第 1 季 · 共 14 集】1999年，政法大学学生陆鸣（魏大勋 饰）、夏雪（孙千 饰）与发小林华（高至霆 饰）回到家乡楠平市。暑假期间，船厂老板马德荣（吴刚 饰）之子马科（扈天翼 饰）纠缠夏雪未果，竟在情人峰对夏雪实施侵害。陆鸣与林华赶到后与马科发生冲突，混乱中夏雪失手将马科打死。三人惊慌埋尸之际，山下的船厂突发爆炸，夏雪父亲夏钢（石文中 饰）在事故中丧生，而爆炸产生的无名尸体恰好被误认为马科，命案暂时得以掩盖。然而，记录杀人过程的摄像机落入马科手下手中，三人从此被勒索、威胁，人生轨迹彻底偏离。\n　　十八年间，陆鸣为守护夏雪放弃前程，在灰色地带游走；夏雪为换取二人安全，被迫与马德荣达成交易，嫁给秘书侯军（王龙正 饰），隐忍抚养女儿；林华则自我囚禁于海边灯塔，守护着当年的秘密。2010年，夏雪女儿侯珊珊（卢雅熙 饰）遭人绑架，尘封旧案重新浮出水面。随着警方调查深入，矿难黑幕、权力庇护、人性挣扎层层剥开——原来当年的爆炸案背后另有真凶，而所有人都在这场跨越十八年的罪与罚中，成为无法逃脱的“有罪之身”。｜TMDB 8"
  date: 2026-01-27
  added: 2026-10-05
  image: tv-090.jpg


- id: tv-091
  title: "借命而生"
  category: 电视剧
  tags: ["电视剧", "犯罪", "剧情"]
  quark_url: "https://pan.quark.cn/s/2c17713da62e"
  description: "【第 1 季 · 共 13 集】二十世纪九十年代初，心怀刑警理想却被困守看守所的杜湘东（秦昊 饰），意外发现关押的犯人徐文国（韩庚 饰）与姚斌彬（史彭元 饰）学识非凡、精通机械制造，颇为欣赏。然而随着调查深入，两人秘密研制枪械并涉嫌杀害车间主任李超（梁天 饰）的案件浮出水面。转运途中发生变故，两人趁机脱逃，杜湘东竭力将姚斌彬抓捕归案，而徐文国则遁入茫茫人海。\n　　此后二十余年，杜湘东对徐文国展开了一场漫长的追捕，这场追逐逐渐渗透进他们亲人朋友的生活，甚至改变了两人命运的底色。时代洪流中，一个困守看守所的警校高材生和一个隐姓埋名奋力求生的逃犯，在漫长的岁月里彼此追逐、相互成就。｜TMDB 7.1"
  date: 2025-04-18
  added: 2026-10-05
  image: tv-091.jpg


