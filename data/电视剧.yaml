  description: "【第 1 季 · 共 12 集】一桩20年未破解的少女谋杀谜案在20年后同样案件再度发生，它唤起了似乎已经平静的小城人们的记忆，曾经年少的山峰（宋洋饰演）成长为警察回到小城。因无法抹去的痛苦记忆让山峰再度追凶，在他寻求真相的过程中发现不仅仅自己，所有当年牵涉其中的人都因这桩20年前的谜案产生了翻天覆地的变化。江边小城夜色如水，雾气弥漫的追凶路上，一次次人性的拷问，一场场预想不到的危机与答案。｜TMDB 6.8"
