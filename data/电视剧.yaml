- id: tv-083
  title: "三大队"
  category: 电视剧
  tags: ["电视剧", "剧情", "悬疑", "犯罪", "动作冒险"]
  quark_url: "https://pan.quark.cn/s/9071bfb8a91a"
  description: "【第 1 季 · 共 24 集】讲述一次审讯意外，三大队刑警程兵（秦昊 饰）入狱服刑，队友受牵连脱警、降职，曾经的三大队分崩离析。十年牢狱，程兵重获自由，信仰崩塌，热血化为沉默，他失去一切，而案件的犯罪嫌疑人王大勇依旧在逃……\n穿一天警服，终身是正义。三大队需要交代，不甘化作执着，利刃再次出鞘，程兵和三大队的兄弟重新集结踏上追凶之路，在孤独和漫长的旅途中配合警方千里追凶，也在这苦行僧一样的历程中重新找到人生的坐标和生命的意义。｜TMDB 8.1"
  date: 2023-12-21
  added: 2026-10-05
  image: tv-083.jpg


- id: tv-084
  title: "错位"
  category: 电视剧
  tags: ["电视剧", "犯罪", "悬疑", "剧情"]
  quark_url: "https://pan.quark.cn/s/2a2fe01036d3"
  description: "【第 1 季 · 共 15 集】故事以一桩“雨夜悬案”拉开序幕。刑警姜光明（马伊琍 饰）和新人警察石落（高至霆 饰）在调查一起独居女性被害案时，意外发现知名作家顾己鸣（佟大为 饰）的最新小说《黑雨》中所描绘的犯罪现场，与他们正在调查的案发现场惊人地重合。虚构与现实的交错，为警方的调查打开了新的突破口，但也将他们引向了更深的迷局。 随着调查的深入，一个关乎“案中案”的真相被层层揭开。表面上光鲜亮丽的作家顾己鸣，其背后却隐藏着一段不为人知的黑暗过往。为了成名，他不惜利用前女友江娜（郑水晶 饰）的感情与帮助，窃取作家唐寻（王劲松 饰）的手稿作为创作灵感。当他发现江娜可能成为其飞黄腾达的障碍时，竟痛下杀手，背上人命。而在这一连串的事件背后，刑警姜光明也因丈夫的背叛，陷入了婚姻与事业的双重危机。 最终，在警方的缜密调查下，顾己鸣的罪行昭然若揭，在婚礼上被绳之以法。而姜光明也在经历这一切后，选择勇敢面对生活，开启新的人生。｜TMDB 7.4"
  date: 2024-07-11
  added: 2026-10-05
  image: tv-084.jpg


- id: tv-085
  title: "暗潮缉凶"
  category: 电视剧
  tags: ["电视剧", "剧情", "犯罪"]
  quark_url: "https://pan.quark.cn/s/eaf77b3e1fec"
  description: "【第 1 季 · 共 19 集】曾经朝气蓬勃的国营大厂旭日厂内，一具断足女尸在废弃污水池中被意外发现，死者是厂职工子女、品学兼优的大学生沈小舟（杨肸子 饰）。外丧内热的中年刑警连海平（陈建斌 饰）与毛躁热血的“菜鸟”警察石强锋（陈若轩 饰）意外成为搭档，虽互有嫌隙但须联手寻找真凶。\n随着一个个嫌疑人进入调查视野，二人发现，在外表白衣胜雪的大学生受害者背后，竟触及到了违规排污、整容贷骗局、网络暴力等诸多出人意料的社会层面。与此同时，一桩与两人牵绊至深的陈年旧案也逐渐浮出水面——石强锋怀疑连海平当年抛弃了其母亲，二人的关系因“一桩旧案”“一段往事”变得扑朔迷离。\n案件悬而未决之际，断足女尸案接连发生，给往日充满了烟火气的旭日厂蒙上了一层阴影。连海平也警觉地发现有一股势力在刻意引导着警方的调查方向。迷雾似见光明，暗潮早已涌动……｜TMDB 6"
  date: 2025-07-31
  added: 2026-10-05
  image: tv-085.jpg


- id: tv-086
  title: "十日游戏"
