  description: "【第 1 季 · 共 6 集】《暗潮之下》把舞台放在纽芬兰的一个海边小镇：当一只神秘的海洋生物开始威胁这座以渔业为生的社区，一位坚韧的渔夫带着他的家人，不得不想办法守住这个彼此知根知底的地方。小镇题材的好处在于人物关系天然就密——谁家跟谁家有旧账、谁在关键时刻会站在哪一边，都不需要额外交代。影片把怪物元素压在背景里，真正着力的是这个社区面对未知时的反应：恐惧、迷信、各自盘算，以及最后那点还没散掉的团结。适合喜欢海洋题材、或者看重群像而非单纯惊吓的观众。节奏偏稳，气氛是靠海雾与空间慢慢堆起来的。｜TMDB 7.3"
