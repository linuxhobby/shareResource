  description: "【第 1 季 · 共 18 集】当老民警冉曦（廖凡 饰）遇上公安大赵赶鹅（尹昉 饰），从“互不顺眼”到携手并肩。横跨18年的胡同悬案为何让师徒二人从联手破案到“反目成仇”？井底下的红色高跟鞋、抓不住的胡同杀手……小片警碰上大案子，他们能否成功破局？｜TMDB 7.3"
