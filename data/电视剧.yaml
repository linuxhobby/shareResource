  quark_url: "https://pan.quark.cn/s/07c688647fa9"
  description: "【第 1 季 · 共 12 集】中国绿藤市，游戏工作室老板于海（朱亚文 饰）突遭投资人沈辉（刘奕君 饰）撤资，沈辉的冷酷令于海不服。于海意外遇见沈辉私生女路婕（金晨 饰），两人合谋了一场“绑架”意图报复沈辉，在这个过程中两人却陷入爱情。多日之后，路婕被发现死亡。警察吴宇柯（耿乐 饰）和女警苗佳（徐棵二 饰）负责侦破此案，在缜密的破案过程中逐渐揭露这一切背后更大的危险。主角们步步为营，继续着这场命运游戏。｜TMDB 8.4"
