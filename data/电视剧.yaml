- id: tv-107
  title: "漂白"
  category: 电视剧
  tags: ["电视剧", "悬疑", "犯罪"]
  quark_url: "https://pan.quark.cn/s/7c57c34e5493"
  description: "【第 1 季 · 共 14 集】2002年冬，雪城刑警队长彭兆林接报案，该城一栋居民楼中发生杀人案。警方在搜查犯罪现场后，掌握了以邓立钢为首的四名疑犯的身份信息，而他们已经流窜到外省，警方辗转数省追踪，犯罪团伙却突然销声匿迹。2004年初，彭兆林接到了女高中生甄珍被绑架的报案。甄珍在与母亲吵架后离家出走，来到南方城市滦城，其间遭到绑架。令彭兆林意外的是，绑架甄珍的竟然就是藏匿已久的邓立钢团伙。雪城公安立即赶往滦城，成功解救甄珍，但邓立钢团伙又一次狡猾逃脱。2011年冬，彭兆林发现邓立钢弟弟曾在雪城就医的线索，他顺藤摸瓜，通过排查发现邓立钢等人已改名换姓，躲藏在西北小城绥鹿市。雪城公安在当地警方的协助下，严密布控，将邓立钢及其团伙绳之以法。｜TMDB 6.9"
