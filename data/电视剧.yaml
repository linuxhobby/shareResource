  description: "【第 1 季 · 共 47 集】大学士府长孙女沈嘉兰（谭松韵 饰）与吏部尚书林昭祥（侯长荣 饰）的长孙林锦岐（刘学义 饰）订下婚约，然而朝堂风云突变，祖父沈大学士沈其翰（章申 饰）被判谋逆之罪，沈家惨遭灭门。林家为自保与沈家退婚，另与御前新贵赵家结亲。沈嘉兰母亲崔氏（柯蓝 饰）曾接济过的林家家奴许万全（陈创 饰）、薛桂花（郭柯宇 饰）夫妇用刚病亡的女儿许兰香替下嘉兰。嘉兰从此顶着许兰香的身份，成为林府的一名三等丫鬟。 在艰难的境遇中，兰香没有向命运低头，始终为自己和家人的幸福生活努力着，反抗一切不公与压迫。最终，兰香凭借自己的善良与聪慧，突破阶级身份的束缚，赢得林锦岐倾心的同时也获得了林家上下的信服与尊重，成为林家的当家人，将命运牢牢掌控在自己的手中，为沈家洗刷冤屈、讨回公道。｜TMDB 7.2"
