  description: "《不再陌生》把镜头对准波兰摇滚乐队 Lady Pank 的主唱扬·博里塞维奇：舞台上是影响了几代人的摇滚嗓音，台下却是一连串接踵而至的家庭悲剧。影片沿着他的歌与他的生活两条线交替推进，看这些伤痛如何被写进旋律，又如何反过来支撑他继续站上舞台。它不只是歌手的传记，更像一份关于波兰社会变迁的侧写——那些传唱度极高的歌背后，是一整个时代的情绪。适合喜欢音乐传记片、或者对东欧摇滚有兴趣的观众；也可以当成 Lady Pank 的入门。叙事偏稳，情绪主要靠歌曲段落推。｜TMDB 0.0"
