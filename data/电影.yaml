  description: "《不再陌生》是一部波兰音乐传记片，主角是波兰摇滚史上绕不开的名字——Lady Pank 乐队的主唱兼吉他手扬·博里塞维奇。影片不按「从出道到成名」的标准套路走，而是把镜头对准他的人生暗面：一连串家庭变故接连而至，亲人离世的打击几乎把他压垮，而他把所有这些情绪都写进了歌里。片子有意思的地方在于它的双向视角——一边是他在舞台上用音乐影响了一代波兰年轻人的公共形象，另一边是私底下被命运反复碾压的那个普通人，两条线彼此撕扯。乐队的成名曲目在片中被重新编排演出，现场段落拍得有情绪，不熟悉这支乐队的观众也能靠旋律接住情感。叙事节奏偏慢，中段有几段闪回稍显细碎，对不了解波兰摇滚史的人来说，人物关系的代入可能要多花一点时间。整体上它更像一部关于「如何用音乐扛住生活」的作品，而非单纯的明星传记。推荐给对东欧摇滚、八十年代音乐场景感兴趣，或本身就喜欢《波西米亚狂想曲》那类「音乐的重量」式传记片的观众。｜TMDB 0.0"
