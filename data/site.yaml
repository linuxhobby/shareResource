contact:
  twitter: "@joyxu1010"
  telegram: "https://t.me/wodewangpantop"
# 备案号（可选，留空则不显示）
icp: ""
# 首页 / 分类页首屏渲染条数，其余由「加载更多」渲染（宫格建议 12 的倍数）
pageSize: 35
