  description: "《席德·梅尔的文明VI》由 Firaxis Games 制作，2016 年发行。玩法其实一句话说得清：从公元前经营到近未来，探图、占城、拉奇观、搞科技、议外交，最后从文化、科技、宗教、统治中选一种取得胜利。这一代新加的「区域」系统把各功能的建筑从市中心挪到了城市外围街区，于是版图规划变得像在下棋，每一块地怎么用都要提前盘算。节奏偏慢，一局往往要好几晚才能打完。适合喜欢深谋远虑、享受一步步铺开的玩家。｜Steam 2016"
  date: 2016-10-20
  added: 2026-10-02
