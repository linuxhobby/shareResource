- id: game-002
  title: "文明7"
  category: 游戏
  tags: ["游戏", "策略", "模拟", "macOS", "文明7 Civilization VII"]
  quark_url: "https://pan.quark.cn/s/03deff44f4c2"
  description: "《席德·梅尔的文明VII》是 Firaxis Games 推出的系列新作，玩法跟以往一样：从一处定居点起步，探地图、建城市、拉奇观、搞科技、谈外交，把一座城、一个帝国、一种文明一路经营到现代。这一代的调整主要在「时代」上——文明会随着时代推进而演进或延续，每一次更替都要重新决定这个国家往哪走，因此中盘的取舍比前作更难。它依然是那种一局就能吃掉一整个周末的策略游戏。适合愿意花点时间上手、享受慢慢铺开的玩家。｜Steam 2025"
  date: 2025-02-10
  added: 2026-10-02
  image: game-002.jpg
