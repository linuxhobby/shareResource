- id: app-100
  title: "Gifski"
  category: 软件
  tags: ["软件", "摄影与视频", "macOS", "Gifski"]
  quark_url: "https://pan.quark.cn/s/5ea39d83b886"
  description: "把视频转换成高品质 GIF。Gifski 可将视频转成每帧数千色的动画 GIF，这得益于高效的跨帧调色板与时间抖动等精妙技术。请注意：Gifski 是转换器而非 GIF 创作工具，不会支持往 GIF 里添加文字或元素，这类需求更适合用剪辑软件完成。功能：视频裁剪与裁切；精确控制尺寸；控制循环与「溜溜球」往返播放；调节速度与循环延迟；转换前预览 GIF；复制、分享或直接拖出 GIF；提供分享扩展与系统服务；可选生成体积更小的低画质版本；自动保存到「下载」文件夹；最高生成 50fps 的 GIF；也可导出修改后的视频而不转成 GIF；支持「快捷指令」。转换方式：把视频拖到窗口或 Dock 图标；点击「打开」按钮选择视频；或在 Finder 中右键视频，用「打开方式」选择本应用。支持 macOS 支持的所有视频格式（H.264、HEVC、ProRes 等 .mp4/.mov），不支持 QuickTime Animation，建议改用 ProRes 4444 XQ。｜Sindre Sorhus"
