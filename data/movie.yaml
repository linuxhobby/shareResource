  description: "美国缉毒局探员约翰（卢克·伊万斯 Luke Evans 饰），不仅是超强工作狂，更会牺牲一切、不择手段，只为顺利完成案件。不巧，在命运的捉弄下，他与思维敏捷又难以追捕的顶级“车手”乔伊（桂纶镁 饰）坠入爱河，最后却卷入犯罪阴谋当中，迫使两人分开。没想到15年过去，约翰为了缉捕贩毒集团首脑关（姜成镐 饰）来到台北，原本预计停留一个周末的时间，但仿佛命运再度出手搅和，让他与乔伊奇迹般地重逢，更发现她已经有个儿子雷蒙（杨明伟 饰）。此时，关的威胁伴随而来，让三人不得不携手迎战！｜TMDB 6.5"
