  tags: ["电影", "历史", "剧情", "喜剧", "飞黄腾达 The Apprentice"]
  quark_url: "https://pan.quark.cn/s/edd0aec9815e"
  description: "《飞黄腾达》把镜头对准上世纪七八十年代的纽约，看年轻的唐纳德·特朗普怎么在这座城市的房地产圈里起家。真正撑起影片的是他与律师罗伊·科恩的关系——后者教给他的几条准则，简单、冷酷，也确实好用。影片拍成了一段师徒故事：一个渴望被看见的年轻人，遇上一个不择手段的老手，学到本事的同时也慢慢变成了对方的样子。适合对美国商业史、或者人物传记题材有兴趣的观众。两位主演的表演是最大看点，尤其是科恩那条线。立场鲜明，观感会因人而异。｜TMDB 6.8"
  date: 2024-10-09
