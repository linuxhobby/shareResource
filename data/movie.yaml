  description: "1944年，诺曼底登陆进入最后72小时，盟军大规模登陆部队已经集结完毕，一切准备就绪，唯独难以预测的天气成为决定行动成败的关键。气象学家詹姆斯·斯塔格上校根据自己的判断预警风暴即将来临，但推迟行动同样可能导致盟军部署暴露。面对来自盟军高层的巨大压力，斯塔格必须坚持自己的气象判断，而最终决定权则掌握在盟军最高司令德怀特·艾森豪威尔手中。数十万将士的安危与诺曼底登陆的成败，都悬于这场与时间和天气的艰难博弈之中……｜TMDB 7.7"
