  quark_url: "https://pan.quark.cn/s/7974a4637e53"
  description: "1979年，韩国政局动荡。中央情报部部长金规泙身处权力核心，一直被视为朴总统最重要的亲信之一。此时，流亡美国的前中央情报部部长朴龙阁公开揭露政权内部的秘密，引发巨大风波。奉命处理此事的金规泙逐渐卷入更加复杂的政治角力，而总统警卫室室长郭相天的强硬作风也令他与朴总统之间的信任不断动摇。随着各方势力围绕总统展开激烈争斗，曾经位高权重的金规泙也一步步走向一个足以改变韩国历史的重大抉择……｜TMDB 7.1"
  date: 2020-01-22
  added: 2026-09-30
