  description: "《四十七浪人之刃》是《47 Ronin》系列的第二部，时间推到元禄赤穗事件之后三百年。现代社会照常运转，而那些武士家族仍在暗中存续，守着外人不知道的规矩与仇恨。故事重新集结散落各地的浪人后裔，对抗一股同样来自阴影里的旧势力，这一部的动作设计更偏奇幻，剑与咒术并存。它在「武士血脉如何在现代延续」这个设定上比前作走得更远。建议先看 2013 年的《47 Ronin》再接这部，人物和背景会更顺。适合喜欢武士与奇幻混搭题材的观众。｜TMDB 6.4"
