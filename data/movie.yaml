  description: "《飞机陷落》讲的是飞行员布罗迪·托伦斯驾驶民航客机从新加坡经东京飞往檀香山，途中飞机被风暴打坏，他硬是把这架飞机迫降在一片敌对地区。麻烦才刚开始：机上乘客很快成了当地武装海盗的人质，而全世界还在找这架失踪的飞机。在救援赶到之前，他必须想办法保住这些人。影片是一部相当规矩的灾难动作片——迫降那场戏拍得扎实，之后的对抗段落靠紧张感撑。杰拉德·巴特勒很适合这类硬撑到底的角色。适合只想看点紧张、不用动脑的动作片观众。｜TMDB 6.9"
