  quark_url: "https://pan.quark.cn/s/7d3da276e697"
  description: "《侏罗纪世界3》事件五年后，地球环境已经不再适合大多数恐龙生存，残存的史前生物主要聚集在少数热带地区。此时，几种巨型史前生物体内的特殊基因被认为可能为人类医学带来重大突破。行动专家佐拉·贝内特因此受雇率领一支小队，与古生物学家亨利·卢米斯和邓肯·金凯德等人深入一处与世隔绝的危险区域，尝试取得所需的生物样本。行动途中，他们意外遇见一个在海上遭遇恐龙袭击的平民家庭，并最终一同流落到一座早已被遗弃的岛屿。随着众人深入岛上，他们也逐渐发现，这里的史前生物远比预想中更加危险……｜TMDB 6.3"
  date: 2025-06-23
  added: 2026-09-30
  image: mv-020.jpg


- id: mv-021
  title: "不汗党"
  category: 电影
  tags: ["电影", "动作", "犯罪", "悬疑", "不汗党 불한당: 나쁜 놈들의 세상"]
  quark_url: "https://pan.quark.cn/s/3089fb9c62f1"
  description: "《不汗党》里的「不汗党」就是痞子、流氓的意思。在浩（薛耿求 饰）是犯罪组织的头目，入狱后照样是狱中的大佬，在那里结识了初生牛犊的贤洙（任时完 饰）。而贤洙其实是警察——被组长千仁淑（全慧珍 饰）派进监狱卧底，目的就是接近在浩。两个人越是相处越惺惺相惜，兄弟情分慢慢生了出来，这份感情也因此变得复杂又耐人寻味。影片的看点全在两个男人之间那点说不清的东西，动作场面只是点缀。适合喜欢韩国黑色犯罪片、看重人物关系的观众。结尾的取舍值得慢慢回味。｜TMDB 7.2"
  date: 2017-05-17
  added: 2026-09-30
