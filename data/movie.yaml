  quark_url: "https://pan.quark.cn/s/35944f29b7a2"
  description: "《黑道中人》讲的是 1957 年纽约黑帮那场内讧：维托·热那亚斯与弗兰克·科斯特洛，两个意裔家族的老大，曾经是同一条船上的人，最终却走到你死我活的地步。热那亚斯策划的刺杀没能杀死科斯特洛，但后者带伤退位，把家族老大的位置让了出去。罗伯特·德尼罗一人分饰两角，等于自己和自己对戏，演技上的分量是这部片子最大的看点。适合喜欢黑帮片、尤其是《好家伙》那类纽约故事的观众。叙事节奏偏缓，重点在人物关系而非枪战，想看热闹场面的可能会觉得闷。｜TMDB 6.2"
