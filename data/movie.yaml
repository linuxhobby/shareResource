  quark_url: "https://pan.quark.cn/s/039ab2b7bbe8"
  description: "《猛攻》的开局是一个军事基地里跑出了某种危险的东西，一支雇佣兵队伍被派去追捕。而在追捕的另一头，是一位曾经当过兵、如今因为某些原因住在拖车里的母亲——为了保护自己所在乎的人，她不得不把当年那些本事重新拿出来。设定并不复杂，看点是主角在绝境里的反击，以及追捕双方最后谁也没占到便宜。适合喜欢「别惹错了人」这一类型动作惊悚片的观众。节奏不拖，开场不久就进入正题。母女关系是这部动作片少有的情感支点。｜TMDB 5.8"
