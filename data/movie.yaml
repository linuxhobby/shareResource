  tags: ["电影", "科幻", "冒险", "动作", "变形金刚：超能勇士崛起 Transformers: Rise of the Beasts"]
  quark_url: "https://pan.quark.cn/s/42ba7abd392d"
  description: "《变形金刚：超能勇士崛起》把系列的时间推到九十年代：终极反派宇宙大帝从天而降，驱使以天灾为首的恐惧兽危害地球；绝境中，蛰伏许久的巨无霸族群终于苏醒，与汽车人联手发动反击。这一部的重点是巨无霸——那些以动物形态登场的变形金刚——以及它们和汽车人之间从互不信任到并肩作战的过程。特效场面一如既往地舍得砸钱。适合本来就吃这一系列视觉奇观的观众。动物形态的巨无霸登场，是这一部最好看的地方。｜TMDB 7.2"
