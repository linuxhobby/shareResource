  added: 2026-09-30
  image: mv-211.jpg


- id: mv-212
  title: "Making All Quiet on the Western Front"
  category: 电影
  tags: ["电影", "纪录", "Making All Quiet on the Western Front Making All Quiet on the Western Front"]
  quark_url: "https://pan.quark.cn/s/43c0eea32bb8"
  description: "《西线无战事》制作特辑是 Netflix 为 2022 年那部德语反战电影配的幕后纪录短片，导演 Ingo Becker。爱德华·贝尔格、主演丹尼尔·布吕尔与作曲者等人陆续出镜，讲他们怎么在泥地里搭起一战战壕、怎么用实拍和灯光把战场的压迫感做出来，以及配乐与音效如何把士兵的恐惧推到观众面前。片子只有半小时左右，建议先看正片、再补这支特辑，会很清楚地看到一个镜头背后有多少工种在协同。对电影工业和军事题材还原有兴趣的人会觉得值。｜TMDB 6.1"
  date: 2022-11-16
  added: 2026-09-30
  image: mv-212.jpg


- id: mv-213
  title: "伸冤人3"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "伸冤人3 The Equalizer 3"]
  quark_url: "https://pan.quark.cn/s/6ce9d9d435d2"
  description: "《伸冤人 3》里，退休特工罗伯特·麦考尔已经放下了为政府做事的那段生涯，一边替被压迫的人出头，一边试着与过去那些可怕的事和解。这回他来到意大利南部，发现新交的朋友被当地犯罪头目控制，事情很快升级到致命的程度，他只能再一次与黑手党正面交手。丹泽尔·华盛顿把那种不动声色的压迫感演得很足——他的暴力从来不是为了泄愤，而是精确到刚好够用。适合喜欢这个系列、享受「一个人收拾一整片烂摊子」这类设定的观众。小镇的慢节奏与清算时的干脆形成反差。｜TMDB 7.3"
  date: 2023-08-30
  added: 2026-09-30
  image: mv-213.jpg


- id: mv-214
  title: "面包超人 恰彭的英雄！"
  category: 电影
  tags: ["电影", "动画", "面包超人 恰彭的英雄！ それいけ！アンパンマン チャポンのヒーロー！"]
  quark_url: "https://pan.quark.cn/s/9aa5b6e36208"
  description: "为了什么而诞生，又该做些什么去生存？一如往常执行巡逻任务的面包超人，在天空中偶遇了神秘坠落的男孩恰彭。始终不知道自己来自何方的恰彭，在与面包超人共同生活的日子里，逐渐领悟了帮助他人绽放笑容的喜悦，许下“我要成为英雄！”的心愿，并将面包超人视为兄长般敬仰。然而细菌人突然出现揭露了恰彭的身世秘密，令人震撼的真相随之浮现。面对泪如雨下的恰彭，面包超人用温暖的怀抱安慰他。“生命的意义由自己决定！” 为了守护大家的笑容，恰彭与面包超人并肩向细菌人发起挑战。｜TMDB 0.0"
