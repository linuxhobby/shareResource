- id: mv-010
  title: "柏林谍变"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪"]
  quark_url: "https://pan.quark.cn/s/c0b4799cd7ec"
  description: "德国首都柏林，一起失败的军火交易使朝韩各方势力的对抗趋近白热化。朝鲜大使李学秀（李庆荣 饰）及间谍表宗盛（河正宇 饰）发现来自祖国的另一名冷血间谍董明秀（柳承范 饰）现身柏林，政权更迭让多年漂泊海外的他们心中充满不祥预感。在此期间，宗盛不得不遵照党的指示监视妻子——大使贴身翻译莲贞熙（全智贤 饰）的行踪。另一方面，在追查军火交易行动中遭受挫折的韩国情报机构负责人姜部长（韩石圭 饰）不甘失败，持续追查宗盛的踪迹。 在大使叛逃计划失败后，宗盛得知董明秀来到柏林的真正目的。为了避免成为权力斗争的牺牲品和肃清对象，他只得带着妻子绝路逃亡……｜TMDB 6.7"
  date: 2013-01-30
  added: 2026-09-21
  image: mv-010.jpg

- id: mv-009
  title: "俄罗斯方块"
  category: 电影
  tags: ["电影", "惊悚", "历史", "剧情"]
  quark_url: "https://pan.quark.cn/s/6d72a8fef768"
  description: "《俄罗斯方块》讲的是这款全世界都见过的游戏，当年是怎么从苏联实验室一路走到 Game Boy 上的。荷兰游戏设计师 Henk Rogers 看中了它，并执着地要把版权谈下来；而在 1980 年代的冷战背景下，一纸合同牵动的是苏联官僚体系、西方发行商和层层中间人。影片把一段看似枯燥的版权谈判拍成了谍战片式的角力，节奏相当紧凑。适合喜欢真实事件改编、或者对游戏史有兴趣的观众；哪怕从没认真想过这游戏是谁做的，看完也会觉得有意思。塔伦·埃哲顿的表演撑住了主角的一根筋。｜TMDB 7.8"
  date: 2023-03-15
  added: 2026-09-07
  image: mv-009.jpg

