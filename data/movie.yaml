  quark_url: "https://pan.quark.cn/s/922975695282"
  description: "《生死时限》的开场十分日常：伦敦律师玛雅·马滕正在晨跑，一通电话让生活瞬间崩塌——她的儿子被绑架了。绑匪的要求简单又冷酷：她必须一直跑，按指令去一个又一个地点，中途不能停、不能求助，也不能信任任何人。整部片子几乎就跟着她的脚步推进，时间被压成一条线，每一秒都在考验这位母亲愿意为孩子做到哪一步。设定极简，执行得也干脆，紧张感主要来自「不能停」这个规则。适合喜欢限时类惊悚片、享受一气呵成节奏的观众。城市被当成跑道来拍，观感相当新鲜。｜TMDB 6.8"
