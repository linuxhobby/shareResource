  quark_url: "https://pan.quark.cn/s/c4ea6199dbdf"
  description: "《月球叛军：火之女》的舞台是银河系边陲的一处和平村落：残暴统治者的军队压境，村民想活下去，只能把希望寄托在一个神秘的陌生女子柯拉身上。她受托招募训练有素的战士，并肩对抗母星，打一场以小博大的仗。柯拉麾下这群人里有边缘人、叛军、农民与战火孤雏，出身各异，却同样复仇心切、渴望救赎。当帝国阴影笼罩最意想不到的卫星，一支崭新的英雄团队就此诞生。扎克·施奈德的视觉风格一如既往地浓烈，慢镜与大场面都不缺。适合喜欢太空歌剧、看重画面的观众。｜TMDB 6.2"
