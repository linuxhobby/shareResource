  description: "《布吕歇尔号巡洋舰》讲的是 1940 年 4 月 9 日这天：六十四岁的比尔格·埃里克森上校镇守奥斯卡堡要塞，这是所有船只开往奥斯陆的必经检查站。当德军的舰队沿着峡湾开进来，这位老上校必须独自判断要不要开火、开火之后整个国家会付出什么代价。影片把挪威历史上这个决定性的清晨拍得很扎实，人物关系和军事细节都铺得认真。适合对二战北欧战场有兴趣的战争片观众。挪威战时题材本来就少见，这部拍得相当认真。｜TMDB 6.8"
