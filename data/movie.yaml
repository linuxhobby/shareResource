  quark_url: "https://pan.quark.cn/s/b390d793e104"
  description: "《恶魔士兵》借一名二战士兵的眼睛去看战争的恐怖：萨姆·伯恩是怀俄明州来的农场男孩，被征召入伍后进入第一特种部队。他并不想杀人，但战场很快让他明白，这里只有杀人与被杀两种选择，而他必须选择前者才能保住身边的战友。影片的重点不在战役本身，而在一个普通人被战争改造的过程——从抗拒到麻木，每一步都拍得很具体。适合喜欢二战题材、偏爱士兵视角而非将帅视角的观众。制作规模不大，但那种压迫感相当实在，结尾的处理也相当克制。｜TMDB 5.2"
