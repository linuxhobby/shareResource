  quark_url: "https://pan.quark.cn/s/434449909906"
  description: "《夺宝奇兵 5：命运转盘》是印第安纳·琼斯这位老考古学家的收官一战：哈里森·福特最后一次戴上那顶帽子，和老搭档加上新伙伴一起，追一件他追了一辈子的东西。这一部在时间线上横跨几十年，开头那段年轻版的琼斯是用特效减龄处理的，观感见仁见智；后半程的冒险段落则回到了系列熟悉的节奏。适合从小看这一系列长大的观众，作为一场告别仪式很到位。前半段的开画和中段的追车都保持了系列的手作感，结尾的处理也相当温柔。｜TMDB 6.5"
