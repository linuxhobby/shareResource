  description: "《明日之战》的设定是这样的：2022 年，地球收到来自三十年后的求救——未来的人类正被一种未知物种逼到灭种边缘。为了拯救地球，丹被征召入伍，穿越到未来支援人类的最后一战。等他亲眼见到对手，才发现那是种以人为食的残暴怪兽。影片把穿越、科幻与家庭关系绑在一起，前半段是准备与适应，后半段是正面开战。克里斯·帕拉特的主演让整部片子保持了轻松的调子。适合喜欢科幻动作片、想看点痛快场面的观众。父女那条线是它比同类爆米花片多一点的地方。｜TMDB 7.5"
