  quark_url: "https://pan.quark.cn/s/911712bbfa8b"
  description: "《黑手党战争》讲的是一名前科犯提前获释，还没喘口气就被强行编进一个六人卧底小组。首日行动就出了事——其他五人全部遇害，只剩他一个。他不得不继续去面对那些他奉命监视的人，而最要命的是，他不知道对方是否已经识破了自己的身份。这类卧底片的核心永远是「身份什么时候暴露」，本片的设定把这个问题推到了最前面，剩下的就是一轮轮试探。适合喜欢紧张卧底题材的观众。身份要不要被揭穿的拉扯，是它全部的主线。｜TMDB 5.4"
