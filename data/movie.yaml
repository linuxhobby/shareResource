  quark_url: "https://pan.quark.cn/s/d829d9e8f115"
  description: "《冷血动物》从一桩地产经纪被残忍杀害的案子开始：负责调查的侦探一层层往里走，发现这张网比想象中要密——涉案的人各自藏着一点东西，每解开一层就出现新的欺骗。它属于那种慢节奏的犯罪悬疑片，靠细节堆积氛围，而不是靠追车和枪战推进；喜欢把线索自己拼起来的观众会觉得耐看。适合喜欢《十二宫》《真探》气质作品的观众；想快节奏破案的话会觉得它慢。留白不少，结局常被拿来讨论那种开放感。本尼西奥·德尔·托罗的表演撑住了全片。｜TMDB 6.7"
