  quark_url: "https://pan.quark.cn/s/1f8a7a4ce1c2"
  description: "《功夫女足》讲的是「至尊无敌杯」开赛在即，一支把功夫带上球场的女足球队，开局就抽到了地狱难度的签——对手个个身怀绝技，外界层层施压，赛场上的诡计一环套一环。她们能不能靠真功夫在绿茵场上逆风翻盘，是整部片子最直接的悬念。影片走的是喜剧加动作的路子，比赛场面拍得相当夸张，笑点也基本埋在这些夸张的招式里。适合想看点轻松热闹、不用动脑的体育喜剧观众。球队成员各有绝活，群像的部分比主线更好看。比赛本身的胜负悬念留到了最后一刻。｜TMDB 6.2"
