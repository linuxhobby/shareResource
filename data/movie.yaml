  description: "《老千 3：独眼杰克》接着系列的世界往下讲：独眼杰克（柳承范 饰）被卷进一场赌博诈骗，于是重新组队，找来传奇老千单耳的儿子日出（朴正民 饰）、嘎其（李光洙 饰）、英美（林智妍 饰）和权院长（权海孝 饰），在一场赌上性命的扑克局里试图翻身。赌桌上的心理战和五花八门的骗术是它最值得看的部分，节奏也不拖，出千的手法拍得相当具体。适合喜欢韩国犯罪片、尤其是赌题材的观众。人物关系在前作基础上又向前推了一步，结尾的反转值得留到最后看。｜TMDB 6.0"
