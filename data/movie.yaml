- id: mv-032
  title: "极限审判"
  category: 电影
  tags: ["电影", "科幻", "惊悚", "犯罪", "极限审判 Mercy"]
  quark_url: "https://pan.quark.cn/s/13c8d17e89c0"
  description: "2029年的洛杉矶，暴力犯罪不断攀升，一套由人工智能主导的司法系统应运而生：被告只有90分钟时间利用系统提供的数据证明自己无罪，否则便可能被当庭处决。曾大力支持并参与推动这套AI法庭的警探雷文，某天醒来却发现自己坐上了审判席，被指控谋杀妻子妮可，而现有证据几乎全部指向他。面对AI法官马多克斯给出的高额有罪概率，雷文只能反过来借助能够调取监控、通讯和私人数据的“天眼”系统，在倒计时结束前重新调查妻子的死亡。随着一条条线索被重新审视，他也逐渐发现，自己熟悉的人和过去隐藏着远比想象中复杂的秘密……｜TMDB 7.1"
  date: 2026-01-19
  added: 2026-09-30
  image: mv-032.jpg


- id: mv-033
  title: "重返重生"
