  description: "《山竹刀》改编自第 22 届中国动漫金龙奖获奖作品。女侠芷竹与医女李小若因缘同行，一场看似简单的还刀之旅，把两人卷进了接踵而至的江湖风波。一路上她们要面对追逐、选择与未知，也在彼此陪伴中重新理解什么叫侠义、什么叫守护。影片融合了江南风情、地域文化与传统武侠美学，用一套偏东方的视觉语言，讲了一个关于江湖、情义与归途的故事。适合喜欢武侠题材、看重画面质感的观众。动作设计偏写意，不是那种硬桥硬马的路线。｜TMDB 0.0"
