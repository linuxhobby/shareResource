  description: "《黑袋行动》围绕一对情报圈的夫妻展开：乔治·伍德豪斯是传奇情报员，凯瑟琳是他深爱的妻子，两人都在同一个系统里做事，也都习惯把话只说到一半。当凯瑟琳被怀疑背叛国家，乔治被迫在婚姻与职责之间做选择。导演索德伯格把它拍成了一部相当克制的间谍片——没有追车和枪战撑场面，紧张感全靠几场饭桌对话和彼此试探的眼神累积。适合喜欢《柏林谍影》那种冷调谍战、愿意自己拼线索的观众；想要热闹动作的会觉得它闷。两位主演的对手戏几乎撑起了整部片子。｜TMDB 6.4"
