  quark_url: "https://pan.quark.cn/s/75e026070bd6"
  description: "《加勒比海盗 2：聚魂棺》里，杰克船长遇上了比他更难缠的对手——传说中的不死人大卫·琼斯，驾驶着那艘没人追得上的「飞行荷兰人」号。杰克欠琼斯一笔血债，必须在期限到来之前找到破解的办法，否则余生都要成为琼斯的奴隶。与此同时，威尔与伊丽莎白也被卷进这场围绕聚魂棺的争夺。这一部把系列的规模往上推了一档，海战、章鱼脸和那座巨大轮盘都成了经典画面，基调也比第一部更暗。适合喜欢冒险题材、想看点热闹奇观的观众。三部的情节互相咬合，建议按顺序看。｜TMDB 7.4"
