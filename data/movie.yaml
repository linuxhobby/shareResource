  description: "《猎杀游戏》的舞台是一个近未来的反乌托邦社会：一档名为《猎杀游戏》的电视真人秀霸占收视榜首，参赛者必须在职业杀手的追杀下活满三十天，一举一动实时直播，多活一天就多累积一笔奖金。本·理查兹为了救重病的女儿孤注一掷，以「最后希望」的身份踏进这场死亡游戏。影片在娱乐至死这件事上写得很直白——观众越兴奋，处境越荒诞。格伦·鲍威尔的主演表现撑得住场面。适合喜欢反乌托邦题材、或者对真人秀文化有兴趣的观众。动作段落一场接一场，节奏不拖。｜TMDB 6.7"
