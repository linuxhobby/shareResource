  description: "《特立独行》的设定挺有意思：三十年前，以超人王长海为首的超英协会把外星人打了回去；三十年后，这位最强的英雄却被派回老家莱茵镇组建战斗小队。麻烦在于这个镇子已经和平太久，真正难缠的不是敌人，而是人情世故、礼尚往来和各种不好明说的规矩。一个习惯用拳头解决问题的人，被丢进一套靠关系运转的日常里，冲突自然一层接一层。影片把超英题材往生活喜剧的方向拉，笑点主要来自身份错位。适合想看点轻松、带点中国式人情的超英片观众。动作场面是点缀，重点在那些推不掉的应酬。｜TMDB 6.7"
