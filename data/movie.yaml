- id: mv-262
  title: "狄仁杰之通天帝国"
  category: 电影
  tags: ["电影", "动作", "冒险", "剧情", "悬疑", "狄仁杰之通天帝国 狄仁傑之通天帝國"]
  quark_url: "https://pan.quark.cn/s/81055b8a990b"
  description: "随着高达100米的通天浮屠落成，武则天登基之日亦将近。但接二连三骇人的自焚案相继发生，死者全为武后的亲信。一切究竟是逆天而行的天谴，或是有人暗中在挑战她的权威！武则天听从国师的指引，命令上官静儿将通天神探狄仁杰召回，并命为钦差，联同上官静儿、裴东来查案。自焚案受害者越来越多，登基大典迫在眉睫。未查出真凶是谁，所有证据都直指与武后有关。究竟这个女皇帝背后藏有多少个不可告人的秘密？而被委派协助的上官静儿及婓东来究竟是敌？或是友？通天干探狄仁杰誓言以性命解开千古奇案！｜TMDB 6.6"
  date: 2010-09-18
  added: "2026-10-08 20:10"
  image: mv-262.jpg
