  quark_url: "https://pan.quark.cn/s/fdc120e8ef43"
  description: "《孤峰追击》讲的是乔丹·赖特上尉带着中队去墨西哥参加战友的婚礼——任务间隙难得的一次休假，庆祝却被一支凶残的贩毒集团突然打断。当乔丹试图把幸存的人带出去时，小队与对方之间爆发了正面冲突，他不得不为了保住队员而与整个犯罪组织交火。影片属于那种任务变事故、休假变战场的军事动作片，节奏推进得快，交火段落一场接一场。适合喜欢小队作战题材、看重战术配合的观众。人物关系铺垫得不多，重点基本都放在冲突与突围上。｜TMDB 5.9"
