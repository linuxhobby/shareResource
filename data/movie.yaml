  quark_url: "https://pan.quark.cn/s/74536d80690a"
  description: "《瞒天过海：美人计》讲的是黛比·奥申——丹尼·奥申的妹妹，刚出狱就着手策划一桩惊天大案。她与好友一起网罗各路顶尖高手，目标是一年一度的 Met Gala：在那场名流云集的时尚盛会上，把大明星脖子上那条价值一亿五千万美元的卡地亚钻石项链拿走。影片的乐趣在于看这支队伍怎么分工、怎么踩点、怎么在最热闹的地方动手，过程比结果更好玩。适合喜欢偷盗题材、看重团队配合的观众。全女性阵容是它最大的卖点，服装与场面也确实养眼。｜TMDB 6.9"
