  quark_url: "https://pan.quark.cn/s/8ea92ed35215"
  description: "奎因是一个粗鲁乏味的货机驾驶员，洛宾是一个唠叨的职场女强人，二人有着自己各自的生活。但是，所谓千里姻缘一线牵，自从洛宾和未婚夫一起前来夏威夷度假，她和奎因之间的故事便开始了。洛宾在度假第二天便接到工作任务，需要尽快赶往大溪地拍摄明星广告。洛宾央求奎因用货机载她一程，不料飞行路上货机不幸遇上暴风雨，奎因只好紧急迫降在一个荒凉的小岛上。在这里，奎因和洛宾将面临着严峻的生存问题：如何寻找食物，如何寻找活路，以及如何逃过岛上凶险的海盗。奎因虽是个粗人，此时却强有力地保护着洛宾，二人情不自禁地互生情愫，然而身为他人未婚妻的洛宾，心中却有万分挣扎。这段感情，是否只能存活在这个现实世界之外的小岛…｜TMDB 6.7"
  date: 2007-11-14
  added: 2026-09-30
  image: mv-117.jpg


