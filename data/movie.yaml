  quark_url: "https://pan.quark.cn/s/6323a755978f"
  description: "《一战再战》讲的是曾经投身激进运动的鲍勃：如今他早已远离过去，与女儿薇拉过着与世隔绝的生活。十六年来他始终没能摆脱对危险的警惕，薇拉也在父亲的过度保护下长大。直到某一天，鲍勃昔日的宿敌重新出现，薇拉随之失踪，这个落魄的前革命者不得不重新联系旧日的伙伴，再次踏入那个他竭力逃离了十六年的世界，当年留下的恩怨也随之浮出水面。影片把政治与个人处境绑在一起，既有紧张的大场面，也有父女之间那种说不清的拉扯。适合喜欢作者性强的剧情片观众。｜TMDB 7.3"
