  description: "这是《十一罗汉》《十二罗汉》《十三罗汉》三部曲的合集：丹尼·奥逊（乔治·克鲁尼 饰）刚出狱就重操旧业，第一部的目标是赌城富豪的一亿五千万；后面两部把舞台搬到欧洲，团队一次次扩充，骗局也一层层叠上去。这套片子的乐趣不在悬疑——反正没有人真的抢不到手——而在看一群人配合得行云流水，顺带回味当年的明星阵容。适合喜欢轻松盗贼题材、想念老派群戏的观众。看完最大的后遗症是想订一张去拉斯维加斯的机票。｜TMDB 7.5"
