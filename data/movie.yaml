- id: mv-066
  title: "寄生虫"
  category: 电影
  tags: ["电影", "喜剧", "惊悚", "剧情", "寄生虫 기생충"]
  quark_url: "https://pan.quark.cn/s/df65bab6db94"
  description: "金基泽一家四口挤在首尔一间狭小的半地下室里，没有稳定工作，只能靠零散的活计勉强维持生活。一天，儿子基宇经朋友介绍，得到前往富裕的朴社长家担任英语家教的机会。进入这个与自己生活截然不同的家庭后，基宇发现了新的机会，并设法将妹妹基婷包装成艺术老师介绍给朴家。随后，一家人通过精心设计，让父亲和母亲也先后进入朴家工作，而朴家始终不知道这四名新雇员其实来自同一个家庭。就在金家逐渐适应这份来之不易的优渥生活时，一个隐藏在朴家豪宅中的秘密突然出现，两个家庭之间看似稳定的关系也开始走向无法预料的方向……｜TMDB 8.5"
  date: 2019-05-30
  added: 2026-09-30
  image: mv-066.jpg


- id: mv-067
  title: "拯救大兵瑞恩"
  category: 电影
  tags: ["电影", "战争", "剧情", "历史", "拯救大兵瑞恩 Saving Private Ryan"]
  quark_url: "https://pan.quark.cn/s/2317b23a1700"
  description: "1944年，诺曼底登陆期间。经历奥马哈海滩的惨烈战斗后，约翰·米勒上尉突然接到一项特殊命令：深入德军控制区，寻找失散的伞兵詹姆斯·瑞恩。瑞恩家中四兄弟均在军中服役，其中三人已经先后阵亡，为了避免他们的母亲失去最后一个儿子，美军决定将瑞恩找到并安全送回家。米勒只得带领七名士兵离开正在推进的部队，深入危机四伏的法国战场寻找一个素未谋面的人。随着搜寻不断深入，小队不仅要面对随时可能出现的德军，也开始无法回避同一个问题：为了拯救一个人的生命，让更多人冒险甚至牺牲，究竟是否值得……｜TMDB 8.2"
  date: 1998-07-24
  added: 2026-09-30
  image: mv-067.jpg


- id: mv-068
  title: "正义过客"
  category: 电影
  tags: ["电影", "犯罪", "动作", "惊悚", "正义过客 जाट"]
  quark_url: "https://pan.quark.cn/s/3ce816cdd3ff"
  description: "《正义过客》讲的是一座被黑帮老大铁腕统治的偏远小镇，某天来了一个来历不明的外乡人——他不说话、不解释，一路打进去，身上带着一个很具体的暴力目的：给这个地方的人一点公道。这类印度动作片的路数相当固定：前期慢热铺垫、中段反转、最后把清算做足，情绪宣泄相当直接。适合喜欢这种「一夫当关」式复仇动作片的观众；受不了长片和歌舞段落的话，可能会觉得拖。配乐和场面调度的分量不低于剧情本身，主角登场那场戏拍得很有仪式感。｜TMDB 6.3"
  date: 2025-04-10
  added: 2026-09-30
  image: mv-068.jpg


- id: mv-069
  title: "毒劫"
  category: 电影
  tags: ["电影", "动作", "犯罪", "惊悚", "毒劫 Havoc"]
  quark_url: "https://pan.quark.cn/s/d05351363344"
  description: "《毒劫》的故事起因是一桩彻底走样的毒品抢劫：为了把一名政客的儿子从烂摊子里捞出来，一名已经快撑不住的警察不得不在这座腐败的城市里到处钻缝，跟那些见不得光的人周旋。影片的整体基调偏脏：雨夜、霓虹、枪战都是压着来，动作场面多且狠。属于那种看完很难复述剧情、但过程相当亢奋的片子。适合喜欢《突袭》式的密集动作、不在乎故事逻辑严丝合缝的观众。雨夜、霓虹与枪火基本贯穿全片，视觉相当统一，几位主演的组合也是看点。｜TMDB 6.4"
  date: 2025-04-25
  added: 2026-09-30
  image: mv-069.jpg


- id: mv-070
  title: "商海通牒"
  category: 电影
