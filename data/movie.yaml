  description: "《罪证子弹3》是法国动作片《罪证子弹》系列的第三部兼最终章，沿袭前作改装车与城市飙车的硬核路线。莱诺在这部里彻底被复仇驱动，发誓要把阿列斯基找出来做个了断，而对手也早已不只是单一帮派。系列的招牌是实打实的飙车与近身动作，金属碰撞和轮胎摩擦的声音做得相当扎实，几乎不加遮掩。建议按 1、2、3 的顺序看，人物关系和恩怨脉络才清楚。适合想要肾上腺素、不太在意剧情复杂度的动作片观众，是周末消遣的稳妥选择。｜TMDB 6.5"
