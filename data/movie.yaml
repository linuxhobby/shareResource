- id: mv-007
  title: "核战边缘"
  category: 电影
  tags: ["电影", "剧情", "历史"]
  quark_url: "https://pan.quark.cn/s/a04e2244df1f"
  description: "《核战边缘》把时间放在冷战末期，全球正站在核战争的悬崖边上：美国总统里根急于与苏联领导人戈尔巴乔夫达成核裁军协议，试图把世界从毁灭边缘拉回来。可白宫内部主战派的阻力、苏联阵营的猜忌、各方势力的角力从四面涌来，重重压力同时压在两位领导人身上。谈判桌上句句藏锋，台面下暗流涌动，每一句对话都关乎全人类的命运。影片属于那种靠对话与对峙撑起来的政治惊悚片，场面不大但张力足。适合喜欢冷战题材、享受语言交锋的观众。两位演员的对手戏是最大看点。｜TMDB 7.1"
