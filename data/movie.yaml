- id: mv-246
  title: "蜘蛛侠：崭新之日"
  category: 电影
  tags: ["电影", "科幻", "动作", "冒险", "蜘蛛侠：崭新之日 Spider-Man: Brand New Day"]
  quark_url: "https://pan.quark.cn/s/0ba57cf66df4"
  description: "全世界已经忘记了彼得·帕克的存在。失去曾经的朋友、爱人与家人后，他选择独自留在纽约，将全部生活投入打击犯罪，成为一名真正的全职蜘蛛侠。数年过去，日复一日的战斗和孤独让彼得承受着越来越沉重的压力，而他的身体也开始发生无法解释的异常变化。与此同时，一股难以察觉的新威胁正在城市中悄然蔓延。为了阻止危机继续扩大，彼得必须在自己逐渐失控的变化与这名甚至无法被看见的敌人之间寻找新的战斗方式，也再次面对那些他以为已经彻底放下的过去……｜TMDB 8.0"
  date: 2026-07-29
  added: 2026-10-06
  image: mv-246.jpg


- id: mv-247
  title: "潜伏6：血域"
  category: 电影
  tags: ["电影", "恐怖", "惊悚", "潜伏6：血域 Insidious: Out of the Further"]
  quark_url: "https://pan.quark.cn/s/e7d6a503b68f"
  description: "《潜伏 6：血域》把一户刚搬进郊区新家的家庭，推到了「灵薄狱」的夹缝里：三名潜行者悄然入侵，原本像是一场残酷的猎杀游戏，却在过程中撕开了现实与异界之间的边界——深渊那一侧的东西，正顺着裂缝一点点渗进现实世界。作为这个系列的又一章，它延续了「潜入灵界」这套设定，恐怖段落依旧靠声音与空间调度堆气氛，而不是单纯靠突然出现的画面。适合追完前几部、熟悉这套世界观的观众；没看过前作也跟得上，但会少掉不少呼应。Jump Scare 用得比想象中克制。｜TMDB 6.5"
  date: 2026-08-19
  added: 2026-10-06
  image: mv-247.jpg
- id: mv-248
  title: "挖掘者"
  category: 电影
  tags: ["电影", "喜剧", "剧情", "挖掘者 Digger"]
  quark_url: "https://pan.quark.cn/s/df8464d137be"
  description: "《挖掘者》是一部带黑色喜剧色彩的剧情片。主角大概是这个世界上最有权力的人，他执着地要向所有人证明自己其实是人类的救世主，结果等来的是一场他自己酝酿多年的灾难正准备把一切夷平。影片的讽刺锋芒很直接，把权力、自负与自我神话之间的距离压缩到荒诞的程度。它属于用喜剧外壳包着末世焦虑的作品，笑点和不适感经常同时出现。适合偏作者向、能接受黑色幽默与开放式结局的观众；指望看到传统英雄叙事的人，这部大概会让人不太舒服。｜TMDB 7.5"
  date: 2026-09-28
  added: 2026-10-06
  image: mv-248.jpg
- id: mv-249
  title: "生化危机：爆发夜"
  category: 电影
  tags: ["电影", "恐怖", "科幻", "冒险", "生化危机：爆发夜 Resident Evil"]
  quark_url: "https://pan.quark.cn/s/cb03b8251279"
  description: "《生化危机：爆发夜》讲的是奉命奔赴浣熊市的医疗速递员布莱恩：他本以为只是送一趟货，到了才发现整座城市已经失控——病毒扩散、怪物横行，到处是被捕猎的人。他要在这座地狱里找出一条活路。作为这一游戏改编系列的又一版重启，它把重心放回了小人物的求生过程，恐怖场面与动作段落都不含糊。适合喜欢丧尸末日题材、或者喜欢「在城里逃出生天」这类设定的观众。夜戏和封闭空间的比重相当大，压迫感主要靠这两样堆出来。不需要补前作也能看懂。｜TMDB 7.3"
  date: 2026-09-16
  added: 2026-10-06
  image: mv-249.jpg

- id: mv-250
  title: "坠落2：死点"
  category: 电影
  tags: ["电影", "惊悚", "坠落2：死点 Fall 2: Deadpoint"]
  quark_url: "https://pan.quark.cn/s/7ba6809f1ed5"
  description: "《坠落 2：死点》发生在上一部之后：失去了姐妹汉特的杰克斯，与汉特那位同样胆大的好友露斯重新聚到一起。为了抚平伤痛，两人结伴去泰国坤山山脉徒步疗伤，没想到一场突如其来的山体滑坡把她们逼上绝境——两人被困在一段摇摇欲坠、高悬于三千英尺之上的高空栈道。要在这样的地方活下去，杰克斯必须先直面自己心里那道坎。作为续作，它把前作那套「高处加无处可退」的压迫感换了个场景重来一遍。适合喜欢极限求生题材、能接受高空画面的观众。恐高的话，这部会相当难熬。｜TMDB 6.2"
  date: 2026-09-01
  added: 2026-10-06
  image: mv-250.jpg

- id: mv-251
  title: "新生化危机"
  category: 电影
  tags: ["电影", "动作", "恐怖", "科幻", "新生化危机 Resident Evil: Welcome to Raccoon City"]
  quark_url: "https://pan.quark.cn/s/89c22dc9532e"
  description: "《新生化危机：欢迎来到浣熊市》把故事拉回起点：浣熊市曾是制药巨头伞公司的总部所在地，如今却是一座死气沉沉的小镇。公司撤离后，地下埋着的那些东西并没有跟着走。当它们被释放出来，镇上的人在一夜之间被永远改变，一小群幸存者必须合力撑过这个夜晚，并揭开保护伞背后的真相。这一版回到了游戏最初的恐怖基调——封闭空间、资源有限、怪物未知，而不是后期那种一路开火的动作路线。适合喜欢丧尸恐怖、或者玩过原作的观众。夜戏比重很大，氛围比剧情更抓人。｜TMDB 5.9"
  date: 2021-11-24
  added: 2026-10-06
  image: mv-251.jpg

- id: mv-252
  title: "生化危机6：终章"
  category: 电影
