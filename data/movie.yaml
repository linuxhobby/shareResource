  description: "《分手的决心》从一桩坠亡案开始：韩国某处山顶，一名男子坠落身亡，是自杀还是他杀，现场说不清。负责调查的刑警海俊把怀疑落在死者的妻子徐来身上，但随着接触变多，他自己也一步步走进这个女人的语言与沉默里。朴赞郁拍这部片子的方式很特别——镜头几乎像言语一样在移动，情绪藏得很深，不肯一次说尽。适合喜欢慢热悬疑、享受那种说不清道不明的暧昧感的观众。看第二遍会发现，很多话藏在镜头里而不是台词里。｜TMDB 7.3"
