  quark_url: "https://pan.quark.cn/s/8cef167b9489"
  description: "《爱情假说》改编自同名畅销小说，讲的是博士生奥利弗一时冲动，吻了系里那位最让人发怵的教授亚当·卡尔森。两人各自都需要一段「假恋情」来应付眼前的麻烦，于是顺理成章地凑到一起；真正有意思的是，这段关系被他们当成了某种实验——在化学实验室里讨论化学反应，顺便验证爱情到底能不能被解释。影片是标准的轻喜剧，节奏明快，斗嘴的段落写得挺俏皮。适合喜欢校园恋爱题材、或者读过原著的观众；对学术圈的描写只是背景板，不必当真。两位主角之间的推拉是最大看点。｜TMDB 8.0"
  date: 2026-09-23
  added: 2026-09-30
