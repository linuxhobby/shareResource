  description: "《金蝉脱壳 3：恶魔车站》继续跟着越狱专家布雷斯林走：一位香港科技大亨的女儿失踪，线索指向他一个老对手的疯狂儿子——对方不仅绑走了人，还把布雷斯林的爱人阿比盖尔关进了一座名为「恶魔车站」的巨大监狱。这一次他要带着团队硬闯虎穴，把人从里面捞出来。系列一贯的看点还是那套「先摸清监狱结构、再找漏洞」的越狱设计，本作把规模做得更大。适合喜欢这个系列、或者享受密室逃脱式动作片的观众。剧情不复杂，看的是过程是否合理、机关是否巧妙。｜TMDB 5.4"
