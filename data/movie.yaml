  quark_url: "https://pan.quark.cn/s/23d502dacec8"
  description: "《重返重生》设定在一个并不复杂的动机上：母亲艾琳·凯利的女儿遇害，而她获得了穿越平行宇宙的能力，于是她在各个世界里找到那个凶手，一次又一次地把他解决掉。问题在于，复仇做多了是要付出代价的——每一次重复都在磨掉她身上属于人的那部分。片子属于科幻惊悚包裹下的人物剧，看点多在主角逐渐失控的过程，而不是穿越机制本身。适合喜欢丧女复仇题材、能接受循环设定的观众。每重复一次，她原本的样子就少一分。｜TMDB 6.6"
