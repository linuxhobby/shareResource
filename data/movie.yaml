  quark_url: "https://pan.quark.cn/s/760d41dd3728"
  description: "《疯狂的麦克斯 4：狂暴之路》把舞台放在一片荒芜的沙漠里：人性早已破碎，人人为生存必需品而战。麦克斯行动果决、沉默寡言，在失去妻儿之后只求内心平静；弗瑞奥萨则坚信只有穿越沙漠、回到童年故土，才有一条活路。两人带着一群被囚禁的人夺车出逃，接下来几乎是一场不中断的追逐。乔治·米勒用实拍特技和极少的对白，拍出了近几十年最纯粹的动作片——叙事基本靠画面推进，信息量却一点不少。适合愿意被大片场面正面击中的观众。二刷会发现细节密度惊人。｜TMDB 7.6"
  date: 2015-05-13
  added: 2026-09-30
  image: mv-119.jpg


