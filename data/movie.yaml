  description: "《勇敢之人》的背景是朝韩局势骤然紧张的那段时间：一架美国直升机在朝鲜一侧坠毁，活下来的机组与随行人员不仅要设法自保，还得护送一名民用技术专家，在没有军方支援的情况下找出一条出境的路。片子的主要张力来自「孤立无援」这件事——后援不会来，误判一步就是国际事端。整体是标准的军事惊悚片拍法，节奏紧凑，篇幅也不长。适合喜欢韩朝题材与军人求生故事的观众。群像之间的分工与摩擦写得比同类片子仔细一点。｜TMDB 6.7"
