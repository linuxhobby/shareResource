  quark_url: "https://pan.quark.cn/s/8597a5e10055"
  description: "为人冷漠刻薄的单身房地产销售主管应佳（刘青 饰）带客户看完一套正在建设中的楼盘后，发现自己的另外一部手机遗忘在了样板间，她独自返回寻找，刚进入电梯，突然传来阵巨响，大厦坍塌，电梯坠毁从昏迷中醒来的应佳发现自己被困在废墟下30米的损毁电梯中动弹不得，身边只有一个破碎的工作手机，一个打火机和手提袋。应佳勉强拼凑好手机，只能按重播键尝试打电话求救，在求救的过程中，她意外发现了大厦倒塌事件后面隐藏着一个不可告人的阴谋，但更怕的是，在她身边还潜伏着因为环境污染而变异的嗜血异种 。｜TMDB 6.0"
