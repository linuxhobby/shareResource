  description: "《新世界》的舞台是东京这座繁华都市，男男女女各自过着多重的生活。玲子（铃木砂羽 饰）一天之中有两个截然不同的身份：白天她是小剧团的演员，努力精进表演；夜晚则化身涉谷的女王，见识那些白天衣冠楚楚、夜里藏着各种隐晦欲望的男人。亚由美（片冈礼子 饰）的男友小健是高考复读生，为了供养他，她瞒着对方用身体赚钱，盼着有朝一日能和他走进婚姻。两个女孩的故事，就在这座喧嚣的大都市中静静展开。适合喜欢都市群像、看重人物处境的观众。｜TMDB 7.4"
