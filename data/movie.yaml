  quark_url: "https://pan.quark.cn/s/aad746144ed6"
  description: "《末代皇帝》讲的是溥仪的一生：1908 年，三岁的他被接入紫禁城登上皇位，成为清王朝最后一位皇帝。年幼的他活在宫墙之内，拥有至高无上的名义与礼遇，却始终与真实的世界隔绝。随着时代巨变，清王朝覆灭，他被逐出紫禁城；此后又在日本人的扶植下成为伪满洲国皇帝，自以为重新掌握了权力，却逐渐发现自己不过是被操纵的傀儡。战争结束后，曾经高高在上的皇帝以战犯身份被押回中国，开始重新面对自己跌宕起伏的一生。贝托鲁奇拍得宏大又克制。适合喜欢历史题材、能接受长片的观众。｜TMDB 7.6"
  date: 1987-10-04
