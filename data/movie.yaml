  description: "《侵略机器》是一部科幻动作惊悚片。故事发生在陆军游骑兵训练的最后一项任务里：一支小队以为这只是毕业前的例行考核，却在演习中撞见来自异界的大型杀戮机械。战斗工兵被迫接过指挥权，带着并不齐整的装备和彼此还没完全建立信任的战友，设法把这些东西挡回去。影片把军事训练片的写实感和怪物片的压迫感叠在一起，节奏紧凑、场面直接。适合喜欢《明日边缘》这一类——以军人视角打异界敌人——组合的观众，对装备细节有要求的人也能看得下去。｜TMDB 7.5"
