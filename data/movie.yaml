- id: mv-063
  title: "教父"
  category: 电影
  tags: ["电影", "剧情", "犯罪", "教父 The Godfather"]
  quark_url: "https://pan.quark.cn/s/10bedb14715a"
  description: "40年代的美国，“教父”维托·唐·柯里昂是黑手党柯里昂家族的首领，带领家族从事非法的勾当，但同时他也是许多弱小平民的保护神，深得人们爱戴。因为拒绝了毒枭索洛索的毒品交易要求，柯里昂家族和纽约其他几个黑手党家族的矛盾激化、圣诞前夕，索洛索劫持了“教父”的参谋汤姆，并派人暗杀“教父”；因为内奸的出卖，“教父”的大儿子逊尼被仇家杀害；小儿子麦克也被卷了进来，失去爱妻。黑手党家族之间的矛盾越来越白热化。年老的“教父”面对丧子之痛怎样统领全局？黑手党之间的仇杀如何落幕？谁是家族的内奸？谁又能够成为新一代的“教父”？血雨腥风和温情脉脉，在这部里程碑式的黑帮史诗巨片里真实上演。｜TMDB 8.7"
  date: 1972-03-14
  added: 2026-09-30
  image: mv-063.jpg


- id: mv-064
  title: "指环王3：王者无敌"
  category: 电影
  tags: ["电影", "冒险", "奇幻", "动作", "指环王3：王者无敌 The Lord of the Rings: The Return of the King"]
  quark_url: "https://pan.quark.cn/s/da4c5f98baa2"
  description: "《指环王 3：王者无敌》是这块中土世界拼图的最后一块：索伦的大军已经压到刚铎都城米那斯提力斯城下，这座昔日最辉煌的王国如今只剩一位日渐衰弱的摄政王守着，比任何时候都更需要它的王者归来。阿拉贡能不能回应血脉里的召唤、成为命定之君，是这条线的核心；另一边，弗罗多与山姆正一步步走进魔多，那枚戒指的重量已经快压垮一个霍比特人。影片把战争场面与人物命运收束得相当完整，多条线索同时推向终点。适合愿意一次看完三部曲的观众——这一部的情绪回馈最足。结尾收得长，但每一段告别都有必要。｜TMDB 8.5"
  date: 2003-12-17
  added: 2026-09-30
  image: mv-064.jpg


- id: mv-065
  title: "变形金刚：超能勇士崛起"
