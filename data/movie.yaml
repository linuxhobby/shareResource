- id: mv-051
  title: "星际穿越"
  category: 电影
  tags: ["电影", "冒险", "剧情", "科幻", "星际穿越 Interstellar"]
  quark_url: "https://pan.quark.cn/s/465e1db6ce77"
  description: "近未来，地球环境持续恶化，枯萎病和沙尘暴让越来越多农作物消失，人类的生存前景也变得岌岌可危。曾为NASA飞行员的库珀如今与家人在农场生活，一次偶然发现的异常重力现象，却将他和女儿墨菲引向一个仍在秘密运作的NASA基地。布兰德教授告诉他，多年前土星附近出现了一处神秘虫洞，人类已经通过它寻找太阳系之外可能适合居住的新世界。为了给地球上的人类寻找延续文明的希望，库珀决定告别家人，与艾米莉亚·布兰德等人踏上一场穿越虫洞、前往遥远星系的探索之旅。然而在浩瀚宇宙中，距离与时间都将成为他们从未真正面对过的考验……｜TMDB 8.5"
  date: 2014-11-05
  added: 2026-09-30
  image: mv-051.jpg


- id: mv-036
  title: "阿诺拉"
  category: 电影
  tags: ["电影", "剧情", "喜剧", "爱情", "阿诺拉 Anora"]
  quark_url: "https://pan.quark.cn/s/cc90f19833de"
  description: "作为当代影坛首屈一指的记录者，肖恩·贝克始终聚焦那些在美国资本主义幻梦边缘挣扎的追梦者与投机客。在这部大胆的反灰姑娘故事中，他的导演技艺臻至新境——这部融合新现实主义与神经喜剧的旋风之作，内核却饱含刺痛人心的力量。米奇·麦迪逊以电力四射的“巨星诞生式”表演惊艳银幕，饰演野心勃勃、脏话连篇的布鲁克林艳舞女郎兼性工作者阿诺拉。她的“不太白马王子”竟是一位俄罗斯寡头的纨绔之子。这段破碎童话就此展开——卡伦·卡拉古利安、尤拉·鲍里索夫与瓦切·托夫马相亦贡献了精彩演出——影片以颠覆性姿态撕开阶级之间的残酷现实。荣获2024年戛纳电影节金棕榈奖，再次奠定了贝克作为当代杰出作者导演的地位。｜TMDB 7.1"
  date: 2024-10-14
  added: 2026-09-30
  image: mv-036.jpg


