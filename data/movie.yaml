  description: "《猫鼠游戏》讲的是尚未成年的弗兰克·阿巴内尔在父母婚姻破裂后离家出走：他凭着过人的伪装能力和一手伪造支票的本事四处行骗，先后冒充飞行员、医生和律师，在不同身份之间游刃有余，骗到手的是数百万美元。而 FBI 探员卡尔·汉拉蒂一点点锁定了这个年轻又狡猾的骗子，追了他很久。斯皮尔伯格把这个真实故事拍得轻快又带点孤独——主角越风光，越显出他只是个想让家重新完整的孩子。适合喜欢真实事件改编、享受双雄对手戏的观众。两位主演的对手戏撑起全片。｜TMDB 8.0"
