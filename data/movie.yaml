  description: "《会计刺客》的主角克里斯蒂安·沃尔夫（本·阿弗莱克 饰）是个沉默而神秘的数学天才，表面做着不起眼的会计工作，实际客户却是世界上各种见不得光的机构。财政部官员雷·金盯上了金融犯罪这条线，克里斯蒂安便找了一家合法的人工智能公司做掩护，而这家公司的会计（安娜·肯德里克 饰）似乎发现了上百万美元的账目差额。他接下来要面对的不只是当局的调查，还有更直接的人身危险。影片把高功能自闭症的设定与动作片结合得意外地顺。适合喜欢孤胆动作片、看重主角设定的观众。｜TMDB 7.1"
