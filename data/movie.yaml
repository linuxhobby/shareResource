  description: "《亚特兰蒂斯：世界的终结，传奇的诞生》把那个流传千古的传说当成一个可考的问题来查：一个繁荣的上古文明，是否真的在一夜之间被自然灾害抹去。影片带观众回到古希腊的锡拉岛，借两个年轻人皮纳鲁蒂与伊什哈鲁的视角，重现那场毁灭了米诺斯文明的地震与火山爆发，也解释了这场灾难如何间接催生了柏拉图笔下关于亚特兰蒂斯的构想。它是纪录片与剧情再现的混合体，画面做得相当用心。适合对古代文明、地质灾难或考古题材有兴趣的观众。叙事清楚，不要求任何前置知识。｜TMDB 6.0"
