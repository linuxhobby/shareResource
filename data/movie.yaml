- id: mv-217
  title: "史密斯夫妇"
  category: 电影
  tags: ["电影", "动作", "喜剧", "剧情", "史密斯夫妇 Mr. & Mrs. Smith"]
  quark_url: "https://pan.quark.cn/s/a31bd5079f62"
  description: "约翰和简已经结婚了7年多，生活就像淡水般无味。婚姻就像坟墓，让他们过着死水一潭的生活。然而这仅仅是表象。背后他们各有刺激惊险的职业——约翰和简分属两个不同的秘密杀手机构，但彼此却不知道对方的职业身份。直到他们同时接到一个任务，刺杀目标竟是同一人。身份的真相才开始慢慢揭开。 反复的试探和猜测，简终于不小心说穿了自己身份。于是一场同室操戈不可避免的发生了。但是他们也开始意识到，自己只是组织的一个棋子。而眼前的，是共同生活了7年的爱人。｜TMDB 6.7"
