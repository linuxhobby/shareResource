  quark_url: "https://pan.quark.cn/s/b0120a23cb6a"
  description: "《生化危机 6：终章》是这个系列的收尾：爱丽丝在华盛顿特区被威斯克背叛，人类几乎失去了最后的希望。作为唯一的幸存者，也是对抗僵尸大军的最后一道防线，她必须回到噩梦开始的地方——浣熊市，才能完成这场救赎。回到原点之后，她要和昔日的朋友一起对抗僵尸与新出现的变种怪物，与保护伞公司展开一场终极决战。这一部的重心全部压在动作与收束上，场面一场比一场大。适合追完整个系列、想看个结局的观众；单独看会缺不少前情。米拉·乔沃维奇的动作戏依然是最大卖点。｜TMDB 6.1"
