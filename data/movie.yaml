  quark_url: "https://pan.quark.cn/s/f242a291e41c"
  description: "《斗士》是一部印度动作剧情片。故事设定在一个腐败横行的国家：一个性情炽热的年轻人站了出来，正面撞上由政客、商人和执法者织成的利益网络，只为替普通人争一点最基本的权利。这类叙事通常搭配高强度的动作编排、歌舞段落和强烈的情绪宣泄，主角光环很亮，反派也足够脸谱化。它不追求复杂的政治分析，重点放在爽快感和情绪释放上。适合看过《RRR》《巴霍巴利王》这种印度大片、想再看一部同口味作品的观众，受不了长片和歌舞的人可能会觉得冗长。｜TMDB 4.9"
