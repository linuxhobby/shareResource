  description: "娜塔莎牺牲后，叶莲娜·贝洛娃始终无法摆脱内心的失落，在多年替瓦伦蒂娜执行秘密任务后，也逐渐厌倦了这种生活。一次，她被派往沙漠中的秘密设施清除目标，却在那里先后遇到约翰·沃克、幽灵和模仿大师。众人很快发现，他们其实都被瓦伦蒂娜安排来互相灭口，而整座设施也成为了销毁秘密与证据的死亡陷阱。设法逃脱的过程中，他们还遇到了一个失去记忆、来历不明的男子鲍勃，而他的存在似乎与瓦伦蒂娜隐藏的实验有关。与此同时，已经成为国会议员的巴基·巴恩斯正在追查瓦伦蒂娜的秘密行动，红色守卫者阿列克谢也因叶莲娜陷入危险而加入其中。这群彼此缺乏信任、各自背负着失败与创伤的人不得不临时合作，共同面对一场远超他们预料的危机……｜TMDB 7.3"
