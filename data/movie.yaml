- id: mv-257
  title: "生化危机"
  category: 电影
  tags: ["电影", "恐怖", "动作", "科幻", "生化危机 Resident Evil"]
  quark_url: "https://pan.quark.cn/s/9fc85e27756b"
  description: "为军方研究生化武器的保护伞公司在浣熊市地下设有巨大的研究中心——蜂巢，由于一次意外事故导致可通过空气传播的生化武器泄露，负责蜂巢安保的电脑系统“红后”启动应急措施，却导致数百名工作人员罹难……四小时后，蜂巢安保人员爱丽丝（米拉·乔沃维奇 Milla Jovovich 饰）在蜂巢出口醒来，并且因为催眠气体而失忆。一支受命关闭红后的特种小队来到此处，与爱丽丝、自称警察的安德森，以及蜂巢工作人员帕克斯组队深入地下。一行人因任务目标与红后冲突而先后遭遇保卫系统和丧尸的连番袭击，而爱丽丝渐渐恢复的记忆揭示了她与同行者非同一般的联系。这场生化丧尸危机该如何解除？又或者根本是一曲绝望的前奏？｜TMDB 6.7"
  date: 2002-03-15
  added: 2026-10-06
  image: mv-257.jpg

- id: mv-258
  title: "猛攻"
  category: 电影
