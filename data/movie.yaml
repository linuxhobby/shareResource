- id: mv-259
  title: "绵羊侦探团"
  category: 电影
  tags: ["电影", "喜剧", "家庭", "悬疑", "绵羊侦探团 The Sheep Detectives"]
  quark_url: "https://pan.quark.cn/s/2caaf10ef9c2"
  description: "《绵羊侦探团》改编自莱奥妮·斯万的畅销小说。牧羊人乔治最爱给羊群读侦探小说，没想到自己有天会离奇死亡；他留下的三千万巨额遗产，让身边每个人看起来都有了动机。警察毫无头绪的时候，这群羊决定「不务正业」，迈出牧场去查主人「躺平」的真相。它们信奉的哲学相当朴素：遇上麻烦就吃草，嗅到危险就躺倒——却意外查出了一个谁也没想到的结果。影片把动物视角和侦探故事捏在一起，荒诞又温和，笑点来得不动声色。适合喜欢轻松喜剧、或者家里有小孩的观众。｜TMDB 7.9"
  date: 2026-04-30
  added: "2026-10-07 17:40"
  image: mv-259.jpg

- id: mv-260
  title: "另一个妈妈"
  category: 电影
  tags: ["电影", "恐怖", "惊悚", "另一个妈妈 Other Mommy"]
  quark_url: "https://pan.quark.cn/s/021e876a85f2"
  description: "故事讲述八岁女孩贝拉住在父母婚姻摇摇欲坠的房子里。某天，她发现衣柜深处总在深夜探出一个东西——那东西长得和她妈妈乌苏拉一模一样，于是贝拉叫它“另一个妈妈”。它每天重复同一句话：“我可以进到你心里吗？”贝拉本能地拒绝，但“另一个妈妈”开始以更扭曲狰狞的形态渗透家庭生活，甚至试图取代真正的母亲。当家中怪事频发、家人也开始看见它时，贝拉必须在被彻底吞噬前，揪出这个伪装者，或者承认有些门不该打开。影片改编自乔什·马勒曼2024年的同名小说。｜TMDB 5.5"
  date: 2026-10-07
  added: 2026-10-07
  image: mv-260.jpg

- id: mv-261
  title: "猎黑行动"
  category: 电影
  tags: ["电影", "动作", "犯罪", "猎黑行动"]
  quark_url: "https://pan.quark.cn/s/8fb9858b4c9a"
  description: "《猎黑行动》讲的是刑警秦峰带着战友，跟一个以高利贷起家的涉黑团伙死磕的故事。团伙头目「无相佛」狡诈又狠，绑架人质、武力逼债，手段一层比一层脏；秦峰这边则要在证据不足、线索被掐断的情况下，一寸寸把这个团伙的犯罪链条摸出来。影片属于那种踏实办案路数的国产警匪片，重点在侦查与收网的过程，而不是个人英雄主义。适合喜欢扫黑题材、看重案件推进逻辑的观众。抓捕与解救人质的收尾段落是它最紧张的部分，整体风格偏写实。｜TMDB 0.0"
  date: 2023-02-22
