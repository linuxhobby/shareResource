  quark_url: "https://pan.quark.cn/s/23d9c5fa73a0"
  description: "《心慌方》的设定极简：一觉醒来，你发现自己身处一个由正立方体拼成的空间，上下左右都是门，门后还是一样的房间，没有食物也没有水。被困的人陆续碰面，各自带着不同的技能——有人会算数，有人懂结构，有人只是体力好。随着他们一层层往下走，人性的丑恶与自私在生死边缘暴露得一览无余。这部加拿大科幻片用极低的成本做出了极强的概念，悬念完全靠设定与人物关系驱动。适合喜欢高概念惊悚片、享受解谜过程的观众。结局的解释见仁见智，反而成了它最常被讨论的地方。｜TMDB 6.8"
