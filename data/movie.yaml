  description: "《铁血战士：杀戮之王》是这个系列的首部动画电影，采用三段式结构：维京时代的一名女战士、幕府日本的一对武士兄弟、二战时期的一名王牌飞行员，各自在不同年代遭遇同一位宇宙来客。三条线索互有呼应，把「铁血战士偏爱强敌」这个设定推到了系列里最极致的地方，收尾又把三条线拧到一起。动画形式让动作场面放得更开，尺度也比真人电影更大。适合已经看过系列前作、或本身就喜欢成人向科幻动画的观众；完全没接触过这个系列的话，直接从它进来也看得懂。｜TMDB 7.8"
