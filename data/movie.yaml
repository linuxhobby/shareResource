- id: mv-243
  title: "金蝉脱壳"
  category: 电影
  tags: ["电影", "动作", "惊悚", "金蝉脱壳 Escape Plan"]
  quark_url: "https://pan.quark.cn/s/95d5073f70f9"
  description: "雷·布雷斯林（西尔维斯特·史泰龙 Sylvester Stallone 饰）是最强的越狱高手，曾在8年内成功逃出14座安全防卫工程最严密的重刑监狱。他的真正身份是美国国家安全局的监狱安管专家，每一次越狱成功，就代表他能找出该个监狱的安管漏洞，进而强化改善。这回是雷退休前的最后一次任务，要挑战传说中最滴水不漏的超级监狱“坟墓”，然而当他入狱后，却发现这不但是个深埋海底不见天日的死狱，就连他决定放弃任务，想表明身份出狱时，典狱长竟更变本加厉地折磨他。｜TMDB 6.7"
  date: 2013-10-09
  added: 2026-10-04
  image: mv-243.jpg


- id: mv-244
  title: "金蝉脱壳2：冥府"
  category: 电影
  tags: ["电影", "动作", "惊悚", "犯罪", "金蝉脱壳2"]
  quark_url: "https://pan.quark.cn/s/59c0fdc82996"
  description: "《金蝉脱壳 2：冥府》里，周树（黄晓明 饰）在夜市被蒙面人挟持，关进了一座名为「Hades」的监狱——里面关着的都是各色重刑犯，活脱脱一个残酷的人类战场。为了把他捞出来，布雷斯林找来戴夫·巴蒂斯塔接应，故意让自己也被抓进去，两人里应外合，在这座监狱里找出生路。系列一贯的看点是那套「摸清结构、找出漏洞」的越狱设计，本作把舞台做得更封闭也更复杂。适合喜欢越狱题材、享受机关拆解过程的观众。合拍片的阵容是它最直观的卖点。｜TMDB 5.2"
  date: 2018-06-05
  added: 2026-10-04
  image: mv-244.jpg


