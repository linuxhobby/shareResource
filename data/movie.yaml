  quark_url: "https://pan.quark.cn/s/80b965797233"
  description: "《爆弹》从一桩荒诞的拘押开始：一名醉酒的中年男子砸了自动售货机、打了便利店店员，被警方带走后却声称自己有超能力，并预告东京会发生爆炸。从秋叶原那一起算起，他说还会有三次，间隔各一小时。警方一边审讯一边与时间赛跑，而这个男人不正面回答，只抛出一些关于炸弹的「问题」。影片本质是一场审讯室里的心理对决，悬念靠对话推进，气氛压得很紧。适合喜欢倒计时结构、或者享受密闭空间智斗的观众。真相揭晓的方式相当意外，不建议提前看剧透。｜TMDB 7.5"
