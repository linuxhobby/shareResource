  quark_url: "https://pan.quark.cn/s/d0614b33f200"
  description: "《偷破天际线》的设定一句话就能说完：一支国际盗贼团在四万英尺的高空，争分夺秒地把一架客机上价值五亿的黄金搬走。难点在于整桩事都发生在飞行途中，窗口极短，还得同时应付机组、乘客和另一伙人。影片走的是轻松路线——热闹、幽默，不想把抢劫拍得太沉重。适合想要一部不用动脑、看个开心的爆米花片的观众；认真追究每个环节的可行性会破坏它的乐趣。万米高空这个设定简化了逻辑，也放大了紧张感。几场机舱内的调度拍得挺巧。｜TMDB 6.4"
