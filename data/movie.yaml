  description: "《极寒潜袭》有两条线并行：一艘俄罗斯导弹潜艇在格陵兰海执行秘密任务时失联，北方舰队最年轻的司令维克托·沃罗宁奉命前去搜寻，而失踪潜艇的指挥官正是他的哥哥；与此同时，一座极地考察站被毁，北方海域出现了不明生物。深海灾难片与深海怪兽片在这部里凑到了一起，冰海之上还有一种格外压抑的孤立感。适合喜欢潜艇题材、或者对极地背景下的军事科幻有兴趣的观众。北方海域的实景拍得相当冷冽，音效与密闭空间的压迫感也做得足。｜TMDB 6.8"
