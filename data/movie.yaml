  quark_url: "https://pan.quark.cn/s/b9ffa17239a0"
  description: "《我要复仇》讲述 Ryu（申河均 饰）这个聋哑青年的故事：父母去世后他与姐姐相依为命，在特殊学校里遇上一个装作失聪的女孩（裴斗娜 饰），生活好不容易有了起色，姐姐却查出绝症，必须换肾才能维持生命。为了凑钱，他走上一条再也回不了头的路。朴赞郁导演的这一部常被拿来和《亲切的金子》并提，基调冷到骨子里，每一步都像是被命运推着往下走。适合愿意被剧情重击、不介意结局残酷的观众。细节铺得很实，越回想越冷。｜TMDB 7.5"
