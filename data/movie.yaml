  description: "《大卫叔叔》是 2010 年的英国黑色喜剧惊悚片，行为艺术家大卫·霍伊尔与 Mike Nicholls、Gary Reich 联合执导，霍伊尔本人出演主角。故事写一位叔叔和侄子之间不断滑向失控的关系：表面是英国式的体面与日常，内里却是近乎疯癫的逻辑，一路走到令人不安的结局。影片成本极低、风格粗粝，舞台感、即兴和挑衅式的幽默混在一起，是典型的小众邪典小品。欣赏《天鹅绒金矿》里霍伊尔那种气质的观众会格外有感觉，追求工整叙事的人多半会不适应。｜TMDB 3.9"
