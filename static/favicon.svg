<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="网盘资源站">
  <defs>
    <linearGradient id="plate" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#8038f2"/>
      <stop offset=".5" stop-color="#3f63f8"/>
      <stop offset="1" stop-color="#0f8cfc"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#2a6cf5"/>
      <stop offset="1" stop-color="#5f9cff"/>
    </linearGradient>
  </defs>
  <!-- 圆角六边形底板：R=22 的尖顶六边形 + 16px 同色圆角描边，得到外接半径 30、圆角 8 的软六边形 -->
  <polygon points="32,10 51.05,21 51.05,43 32,54 12.95,43 12.95,21" fill="url(#plate)" stroke="url(#plate)" stroke-width="16" stroke-linejoin="round"/>
  <!-- 文件夹落影 -->
  <rect x="17.4" y="26.8" width="30" height="17" rx="3.6" fill="#0d2ea6" fill-opacity=".15"/>
  <!-- 文件夹：tab + 主体 -->
  <rect x="17" y="20.5" width="13" height="9" rx="2.5" fill="#fff"/>
  <rect x="17" y="25" width="30" height="17" rx="3.6" fill="#fff"/>
  <!-- 播放三角 -->
  <path d="M27.7 28.4 38.3 33.5 27.7 38.6Z" fill="url(#play)" stroke="url(#play)" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
