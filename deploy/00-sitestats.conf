# /etc/nginx/conf.d/00-sitestats.conf
# 定义访问统计用的日志格式：combined 基础上，结尾追加访客 cookie $cookie_vid
# 文件名以 00- 开头，保证排在站点配置之前加载，否则 access_log 找不到该格式

log_format sitestats '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$cookie_vid"';
