name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 方式一：通知 VPS 自己拉取并重建（构建在服务器完成，无需传输 20MB 产物）
  deploy-vps:
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到 VPS 重新构建
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" /usr/local/bin/rebuild-site

  # 方式二：发布到 GitHub Pages（仓库 Settings → Pages → GitHub Actions）
  deploy-pages:
    if: ${{ vars.DEPLOY_TARGET != 'vps' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: BASE_URL=${{ vars.BASE_URL || 'https://example.com' }} npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
